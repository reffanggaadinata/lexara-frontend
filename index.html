   is the lawyer's video-call rate per 60-minute meeting (same stand-in the
   backend already uses to price Tatap Muka bookings).
============================================================ */
const HANGOUT_RADIUS_OPTIONS = [
  { label: '1 km', value: '1' }, { label: '3 km', value: '3' }, { label: '5 km', value: '5' },
  { label: '10 km', value: '10' }, { label: '25 km', value: '25' }, { label: 'Semua jarak', value: '' },
];
const HANGOUT_FEE_PRESETS = [
  { label: 'Di bawah Rp300rb', min: '', max: '299999' },
  { label: 'Rp300rb–750rb', min: '300000', max: '750000' },
  { label: 'Di atas Rp750rb', min: '750001', max: '' },
];
function defaultHangoutSearchFilter(){
  return {
    userLat: null, userLng: null,
    locating: false, locationError: null,
    radiusKm: '',
    gender: 'semua',
    biayaMin: '', biayaMax: '',
  };
}
function openHangoutSearchFilter(){
  const prev = state.activeSearchFilters && state.activeSearchFilters.kind === 'hangout' ? state.activeSearchFilters : null;
  state.hangoutSearchFilter = prev ? {
    userLat: prev.userLat, userLng: prev.userLng,
    locating: false, locationError: null,
    radiusKm: prev.radiusKm ?? '',
    gender: prev.gender ?? 'semua',
    biayaMin: prev.biayaMin ?? '', biayaMax: prev.biayaMax ?? '',
  } : defaultHangoutSearchFilter();
  state.showHangoutFilterSheet = true;
  if(state.hangoutSearchFilter.userLat === null) requestHangoutUserLocation();
  else render();
}
function closeHangoutSearchFilter(){
  state.hangoutSearchFilter = null;
  state.showHangoutFilterSheet = false;
  render();
}
function requestHangoutUserLocation(){
  const f = state.hangoutSearchFilter;
  if(!navigator.geolocation){
    f.locationError = 'Perangkat/browser ini tidak mendukung deteksi lokasi.';
    render();
    return;
  }
  f.locating = true;
  f.locationError = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if(state.hangoutSearchFilter !== f) return; // sheet closed while waiting
      f.userLat = pos.coords.latitude;
      f.userLng = pos.coords.longitude;
      f.locating = false;
      render();
    },
    (err) => {
      if(state.hangoutSearchFilter !== f) return;
      f.locating = false;
      f.locationError = err.code === 1
        ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk browser ini lalu coba lagi.'
        : 'Gagal mendapatkan lokasi. Coba lagi.';
      render();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
function setHangoutRadius(v){ state.hangoutSearchFilter.radiusKm = v; render(); }
function setHangoutGender(g){ state.hangoutSearchFilter.gender = g; render(); }
function onHangoutFilterNumberInput(field, v){ state.hangoutSearchFilter[field] = v; }
function submitHangoutSearchFilter(){
  const f = state.hangoutSearchFilter;
  if(f.userLat === null){
    requestHangoutUserLocation();
    return;
  }
  state.activeSearchFilters = {
    kind: 'hangout',
    areaPraktik: [],
    wilayah: 'terdekat',
    userLat: f.userLat, userLng: f.userLng,
    radiusKm: f.radiusKm,
    gender: f.gender,
    biayaMin: f.biayaMin, biayaMax: f.biayaMax,
  };
  state.hangoutSearchFilter = null;
  state.showHangoutFilterSheet = false;
  state.screen = 'cari-hangout-hasil';
  loadLawyers();
}

// Area Praktik is a two-level drill-down: clicking a category button
// expands it into its leaf sub-items, and only the LEAF is an actual
// selectable/searchable value (matching the "Parent – Leaf" specialization
// names seeded via cari-lawyer-area-praktik-migration.sql). The category
// button itself never gets selected — it's purely a folder to open.
// Quick preset buckets for the two range filters (Pengalaman, Biaya) — shown
// as tappable chips above the manual Min/Maks fields, mirroring how
// marketplace apps like Shopee offer "Di bawah X / X–Y / Di atas Y" presets
// alongside a custom range.
const PENGALAMAN_PRESETS = [
  { label: 'Di bawah 3 th', min: '', max: '2' },
  { label: '3–7 tahun', min: '3', max: '7' },
  { label: 'Di atas 7 th', min: '8', max: '' },
];
const LAWYER_FEE_PRESETS = [
  { label: 'Di bawah Rp100rb', min: '', max: '99999' },
  { label: 'Rp100rb–300rb', min: '100000', max: '300000' },
  { label: 'Di atas Rp300rb', min: '300001', max: '' },
];
function isPresetActive(f, minField, maxField, min, max){
  return String(f[minField] || '') === String(min) && String(f[maxField] || '') === String(max);
}
// Tapping an already-active preset clears the range (acts as a toggle);
// tapping a different one replaces min/max and updates the manual inputs too.
function searchFilterByKind(kind){
  if(isSvc(kind)) return state.svcFilter;
  if(isSvc(kind)) return state.svcFilter;
  return kind === 'notaris' ? state.notarisSearchFilter : kind === 'konsultan' ? state.konsultanSearchFilter : kind === 'hangout' ? state.hangoutSearchFilter : state.lawyerSearchFilter;
}
// Wilayah Kerja region pickers (shared by all three filters): Provinsi, then
// Kota/Kabupaten inside it. Empty value = "Semua Area" / "Semua Kota".
function setWilayahProvinsi(kind, v){
  const f = searchFilterByKind(kind);
  f.provinsi = v; f.kota = '';
  render();
}
function setWilayahKota(kind, v){
  searchFilterByKind(kind).kota = v;
  render();
}
function renderWilayahSelects(kind){
  const f = searchFilterByKind(kind);
  const cities = f.provinsi ? (WILAYAH_INDONESIA[f.provinsi] || []) : [];
  return `
  <div class="filter-range-row" style="flex-direction:column;align-items:stretch;gap:8px;">
    <select onchange="setWilayahProvinsi('${kind}', this.value)">
      <option value="">Semua Area (semua provinsi)</option>
      ${Object.keys(WILAYAH_INDONESIA).map(p => `<option value="${p}" ${f.provinsi===p?'selected':''}>${p}</option>`).join('')}
    </select>
    ${f.provinsi ? `
    <select onchange="setWilayahKota('${kind}', this.value)">
      <option value="">Semua Kota/Kabupaten di ${f.provinsi}</option>
      ${cities.map(c => `<option value="${c}" ${f.kota===c?'selected':''}>${c}</option>`).join('')}
    </select>` : ''}
  </div>`;
}

function setPresetRange(kind, minField, maxField, min, max){
  const f = searchFilterByKind(kind);
  if(isPresetActive(f, minField, maxField, min, max)){
    f[minField] = ''; f[maxField] = '';
  }else{
    f[minField] = min; f[maxField] = max;
  }
  render();
}
function renderPresetChipRow(kind, minField, maxField, presets){
  const f = searchFilterByKind(kind);
  return `
  <div class="filter-chip-row" style="margin-bottom:10px;">
    ${presets.map(p => `
      <button type="button" class="filter-chip ${isPresetActive(f, minField, maxField, p.min, p.max) ? 'selected' : ''}" onclick="setPresetRange('${kind}','${minField}','${maxField}','${p.min}','${p.max}')">${p.label}</button>`).join('')}
  </div>`;
}

// How many Area Praktik chips show before the "+N lainnya" chip that
// reveals the rest — matches the "Awan chip (wrap)" mockup the client
// picked (a handful of pills wrapping onto a few rows, plus a trailing
// "+N lainnya" pill rather than a hard cutoff or a full 28-item wall).
const AREA_PRAKTIK_VISIBLE_COUNT = 9;

// Area Praktik as wrapping rounded pill chips (marketplace "cloud of
// chips" style, per the client's chosen mockup) — the active category
// (the one whose sub-bidang panel is currently open) renders as a filled
// navy pill with a small dot, everything else stays outlined. Tapping a
// category doesn't expand inline: it sets the "active category", and its
// sub-bidang appear in a separate panel (renderAreaSubPanel) positioned
// right above "Tingkat Perkara".
function renderAreaPraktikBody(){
  const f = state.lawyerSearchFilter;
  const showAll = f.areaShowAll;
  const visible = showAll ? AREA_PRAKTIK_SEARCH_CATALOG : AREA_PRAKTIK_SEARCH_CATALOG.slice(0, AREA_PRAKTIK_VISIBLE_COUNT);
  const remaining = AREA_PRAKTIK_SEARCH_CATALOG.length - AREA_PRAKTIK_VISIBLE_COUNT;
  return `
  <div class="area-chip-wrap">
    ${visible.map(a => {
      const selectedInCat = a.subs.filter(s => f.areaPraktik.has(a.name + ' – ' + s)).length;
      const isActive = f.areaActiveCat === a.name;
      return `
      <button type="button" class="area-chip ${isActive ? 'active' : ''}" onclick="setAreaActiveCat('${a.name.replace(/'/g, "\\'")}')">
        ${isActive ? '<span class="chip-dot"></span>' : ''}${a.name}${selectedInCat ? ` (${selectedInCat})` : ''}
      </button>`;
    }).join('')}
    ${(!showAll && remaining > 0) ? `<button type="button" class="area-chip-more" onclick="toggleAreaShowAll()">+${remaining} lainnya</button>` : ''}
  </div>`;
}

// The tapped category's sub-bidang, rendered as its OWN filter section (not
// nested inside the icon grid) so it can sit between "Area Praktik" and
// "Tingkat Perkara" as the client asked. Returns '' when nothing is active,
// or when the active lawyer category has no sub-items to show.
function renderAreaSubPanel(kind){
  const f = kind === 'notaris' ? state.notarisSearchFilter : state.lawyerSearchFilter;
  const active = f.areaActiveCat;
  if(!active) return '';
  const catalog = kind === 'notaris' ? NOTARIS_AREA_PRAKTIK_CATALOG : AREA_PRAKTIK_SEARCH_CATALOG;
  const keyField = kind === 'notaris' ? 'label' : 'name';
  const cat = catalog.find(a => a[keyField] === active);
  if(!cat || !cat.subs.length) return '';
  const toggleFn = kind === 'notaris' ? 'toggleNotarisAreaPraktik' : 'toggleAreaPraktik';
  return `
  <div class="filter-section area-sub-panel">
    <div class="filter-flat-label">Sub-bidang: ${cat[keyField]}</div>
    <div class="filter-chip-row">
      ${cat.subs.map(s => {
        const leaf = cat[keyField] + ' – ' + s;
        return `<button type="button" class="filter-chip ${f.areaPraktik.has(leaf) ? 'selected' : ''}" onclick="${toggleFn}('${leaf.replace(/'/g, "\\'")}')">${s}</button>`;
      }).join('')}
    </div>
  </div>`;
}

// Clears one min/max pair on the draft filter (used by the "Filter dipilih"
// chip row's ✕ button on a range like Pengalaman/Biaya) and re-renders, so
// both the chip, the preset row and the manual inputs all update immediately.
function clearRangeFilter(kind, minField, maxField){
  const f = searchFilterByKind(kind);
  f[minField] = '';
  f[maxField] = '';
  render();
}

// Resets every SELECTION back to defaults but keeps which Area Praktik
// category is active and which document group is expanded, so the screen
// doesn't visually collapse out from under the client when they hit "Hapus".
function clearAllDraftFilters(kind){
  if(kind === 'notaris'){
    const { areaActiveCat, areaShowAll, dokumenOpen } = state.notarisSearchFilter;
    state.notarisSearchFilter = defaultNotarisSearchFilter();
    state.notarisSearchFilter.areaActiveCat = areaActiveCat;
    state.notarisSearchFilter.areaShowAll = areaShowAll;
    state.notarisSearchFilter.dokumenOpen = dokumenOpen;
  }else if(kind === 'hangout'){
    const prev = state.hangoutSearchFilter;
    state.hangoutSearchFilter = defaultHangoutSearchFilter();
    // keep the detected location — it's not a "selection" to wipe
    state.hangoutSearchFilter.userLat = prev.userLat;
    state.hangoutSearchFilter.userLng = prev.userLng;
  }else if(isSvc(kind)){
    const { dokumenOpen } = state.svcFilter;
    state.svcFilter = defaultSvcFilter(); state.svcFilter.dokumenOpen = dokumenOpen;
  }else if(kind === 'konsultan'){
    const { dokumenOpen } = state.konsultanSearchFilter;
    state.konsultanSearchFilter = defaultKonsultanSearchFilter();
    state.konsultanSearchFilter.dokumenOpen = dokumenOpen;
  }else{
    const { areaActiveCat, areaShowAll } = state.lawyerSearchFilter;
    state.lawyerSearchFilter = defaultLawyerSearchFilter();
    state.lawyerSearchFilter.areaActiveCat = areaActiveCat;
    state.lawyerSearchFilter.areaShowAll = areaShowAll;
  }
  render();
}

// Builds the live "Filter dipilih" summary shown at the top of the filter
// screen — every currently-selected value across all sections, as a
// removable chip, so the client can see (and undo) picks without having to
// re-open each accordion section to find them again.
function renderSelectedFilterChips(kind){
  const f = searchFilterByKind(kind);
  const esc = (s) => s.replace(/'/g, "\\'");
  const chips = [];

  // Area Praktik — leaf values are stored as "Kategori – Sub-bidang" for
  // lawyer/notaris; show just the sub-bidang part so chips stay short and
  // readable. Konsultan categories are all leaf-only to begin with, so
  // there's no " – " to strip there.
  const areaFn = isSvc(kind) ? 'toggleSvcArea' : kind === 'notaris' ? 'toggleNotarisAreaPraktik' : kind === 'konsultan' ? 'toggleKonsultanAreaPraktik' : 'toggleAreaPraktik';
  Array.from(f.areaPraktik).forEach(v => {
    const idx = v.lastIndexOf(' – ');
    chips.push({ text: idx >= 0 ? v.slice(idx + 3) : v, onclick: `${areaFn}('${esc(v)}')` });
  });

  // "Jenis Layanan" exists on "Cari Notaris/PPAT" and "Cari Konsultan" —
  // removed from "Cari Lawyer/Advokat" per the client's request.
  if(kind === 'notaris' || kind === 'konsultan' || isSvc(kind)){
    const jenisFn = isSvc(kind) ? 'toggleSvcJenis' : kind === 'notaris' ? 'toggleNotarisJenisLayanan' : 'toggleKonsultanJenisLayanan';
    Array.from(f.jenisLayanan).forEach(v => {
      chips.push({ text: v, onclick: `${jenisFn}('${esc(v)}')` });
    });
  }

  if(f.wilayah === 'terdekat'){
    const fn = isSvc(kind) ? 'setSvcWilayah' : kind === 'notaris' ? 'setNotarisWilayah' : kind === 'konsultan' ? 'setKonsultanWilayah' : 'setWilayah';
    const label = isSvc(kind) ? SVC[kind].near : kind === 'notaris' ? 'Notaris Terdekat' : kind === 'konsultan' ? 'Konsultan Terdekat' : 'Lawyer Terdekat';
    chips.push({ text: label, onclick: `${fn}('semua')` });
  }

  if(f.provinsi || f.kota){
    chips.push({
      text: f.kota ? f.kota + ', ' + f.provinsi : f.provinsi,
      onclick: `setWilayahProvinsi('${kind}','')`,
    });
  }

  if(f.pengalamanMin || f.pengalamanMax){
    chips.push({
      text: `Pengalaman ${f.pengalamanMin || '0'}–${f.pengalamanMax || '∞'} th`,
      onclick: `clearRangeFilter('${kind}','pengalamanMin','pengalamanMax')`,
    });
  }

  if(f.gender !== 'semua'){
    const fn = isSvc(kind) ? 'setSvcGender' : kind === 'notaris' ? 'setNotarisGender' : kind === 'konsultan' ? 'setKonsultanGender' : 'setGender';
    chips.push({ text: f.gender === 'male' ? 'Laki-laki' : 'Perempuan', onclick: `${fn}('semua')` });
  }

  if(kind === 'notaris'){
    if(f.biayaDokumenMin || f.biayaDokumenMax){
      chips.push({
        text: `Dokumen Rp${f.biayaDokumenMin || '0'}–Rp${f.biayaDokumenMax || '∞'}`,
        onclick: `clearRangeFilter('notaris','biayaDokumenMin','biayaDokumenMax')`,
      });
    }
  }else if(f.biayaMin || f.biayaMax){
    chips.push({
      text: `Biaya Rp${f.biayaMin || '0'}–Rp${f.biayaMax || '∞'}`,
      onclick: `clearRangeFilter('${kind}','biayaMin','biayaMax')`,
    });
  }

  if(!chips.length) return '';

  return `
  <div class="selected-filter-summary">
    <div class="sfs-head">
      <span>Filter dipilih (${chips.length})</span>
      <button type="button" class="btn-link" onclick="clearAllDraftFilters('${kind}')">Hapus semua</button>
    </div>
    <div class="sfs-chips">
      ${chips.map(c => `<span class="sfs-chip">${c.text}<button type="button" onclick="${c.onclick}">✕</button></span>`).join('')}
    </div>
  </div>`;
}

// The filter screen itself is a bottom sheet overlaying the home screen

// Same wrapping pill-chip treatment as the lawyer Area Praktik chips — with
// 8 notaris categories total, everything fits without needing a "lainnya"
// chip in practice. Leaf-only categories (no subs) toggle their own
// selection directly on tap (no sub-panel to show); the two categories that
// DO have subs set the active category instead, and their sub-bidang appear
// via renderAreaSubPanel('notaris').
function renderNotarisAreaPraktikBody(){
  const f = state.notarisSearchFilter;
  const showAll = f.areaShowAll;
  const visible = showAll ? NOTARIS_AREA_PRAKTIK_CATALOG : NOTARIS_AREA_PRAKTIK_CATALOG.slice(0, AREA_PRAKTIK_VISIBLE_COUNT);
  const remaining = NOTARIS_AREA_PRAKTIK_CATALOG.length - AREA_PRAKTIK_VISIBLE_COUNT;
  return `
  <div class="area-chip-wrap">
    ${visible.map(a => {
      const isLeafOnly = !a.subs.length;
      const selectedInCat = isLeafOnly
        ? (f.areaPraktik.has(a.label) ? 1 : 0)
        : a.subs.filter(s => f.areaPraktik.has(a.label + ' – ' + s)).length;
      const isActive = isLeafOnly ? !!selectedInCat : f.areaActiveCat === a.label;
      const onclick = isLeafOnly
        ? `toggleNotarisAreaPraktik('${a.label.replace(/'/g, "\\'")}')`
        : `setNotarisAreaActiveCat('${a.label.replace(/'/g, "\\'")}')`;
      return `
      <button type="button" class="area-chip ${isActive ? 'active' : ''}" onclick="${onclick}">

      </button>`;

    ${(!showAll && remaining > 0) ? `<button type="button" class="area-chip-more" onclick="toggleNotarisAreaShowAll()">+${remaining} lainnya</button>` : ''}
  </div>`;
}

// Wrapping pill-chip treatment, same look as the Area Praktik chips —

      ${NOTARIS_JENIS_LAYANAN_DOKUMEN.map(v => `
        <button type="button" class="area-chip ${f.jenisLayanan.has(v)?'active':''}" onclick="toggleNotarisJenisLayanan('${v.replace(/'/g, "\\'")}')">${f.jenisLayanan.has(v) ? '<span class="chip-dot"></span>' : ''}${v}</button>`).join('')}

function renderCariNotarisFilter(){

/* ============================================================
   Mesin filter generik untuk 4 layanan baru (state.svcFilter)
============================================================ */
function flowServiceForSearch(){
  const k = state.activeSearchFilters && state.activeSearchFilters.kind;
  if(isSvc(k)) return SVC[k].flow;
  return (k === 'notaris' || k === 'konsultan') ? k : 'lawyer';
}
function defaultSvcFilter(){
  return { areaPraktik:new Set(), areaActiveCat:null, areaShowAll:false, jenisLayanan:new Set(), dokumenOpen:false,
    wilayah:'semua', userLat:null, userLng:null, provinsi:'', kota:'', locating:false, locationError:null,
    pengalamanMin:'', pengalamanMax:'', gender:'semua', biayaMin:'', biayaMax:'' };
}
function openSvcSearchFilter(kind){
  const prev = state.activeSearchFilters && state.activeSearchFilters.kind === kind ? state.activeSearchFilters : null;
  state.svcKind = kind;
  state.svcFilter = prev ? Object.assign(defaultSvcFilter(), {
    areaPraktik:new Set(prev.areaPraktik), jenisLayanan:new Set(prev.jenisLayanan),
    wilayah:prev.wilayah, userLat:prev.userLat, userLng:prev.userLng, provinsi:prev.provinsi ?? '', kota:prev.kota ?? '',
    pengalamanMin:prev.pengalamanMin ?? '', pengalamanMax:prev.pengalamanMax ?? '', gender:prev.gender ?? 'semua',
    biayaMin:prev.biayaMin ?? '', biayaMax:prev.biayaMax ?? '' }) : defaultSvcFilter();
  state.showSvcFilterSheet = true;
  render();
}
function closeSvcSearchFilter(){ state.svcFilter = null; state.showSvcFilterSheet = false; render(); }
function toggleSvcArea(name){ const f = state.svcFilter; f.areaPraktik.has(name) ? f.areaPraktik.delete(name) : f.areaPraktik.add(name); render(); }
function toggleSvcJenis(v){ const f = state.svcFilter; f.jenisLayanan.has(v) ? f.jenisLayanan.delete(v) : f.jenisLayanan.add(v); render(); }
function toggleSvcDokumenOpen(){ state.svcFilter.dokumenOpen = !state.svcFilter.dokumenOpen; render(); }
function setSvcWilayah(mode){
  const f = state.svcFilter; f.wilayah = mode; f.locationError = null;
  if(mode === 'terdekat' && f.userLat === null) requestSvcUserLocation(); else render();
}
function requestSvcUserLocation(){
  const f = state.svcFilter;
  if(!navigator.geolocation){ f.locationError = 'Perangkat/browser ini tidak mendukung deteksi lokasi.'; render(); return; }
  f.locating = true; f.locationError = null; render();
  navigator.geolocation.getCurrentPosition(
    (pos) => { f.userLat = pos.coords.latitude; f.userLng = pos.coords.longitude; f.locating = false; render(); },
    (err) => { f.locating = false; f.locationError = err.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk browser ini lalu coba lagi.' : 'Gagal mendapatkan lokasi. Coba lagi.'; render(); },
    { enableHighAccuracy:true, timeout:10000 });
}
function setSvcGender(g){ state.svcFilter.gender = g; render(); }
function onSvcFilterNumberInput(field, v){ state.svcFilter[field] = v; }
function submitSvcSearchFilter(){
  const f = state.svcFilter, kind = state.svcKind;
  if(f.wilayah === 'terdekat' && f.userLat === null){ requestSvcUserLocation(); return; }
  state.activeSearchFilters = { kind, areaPraktik:Array.from(f.areaPraktik), jenisLayanan:Array.from(f.jenisLayanan),
    wilayah:f.wilayah, provinsi:f.provinsi, kota:f.kota, userLat:f.userLat, userLng:f.userLng,
    pengalamanMin:f.pengalamanMin, pengalamanMax:f.pengalamanMax, gender:f.gender, biayaMin:f.biayaMin, biayaMax:f.biayaMax };
  state.svcFilter = null; state.showSvcFilterSheet = false;
  state.screen = SVC[kind].screen;
  loadLawyers();
}

          <button type="button" class="area-chip ${grpActive?'active':''}" onclick="toggleSvcDokumenOpen()">${grpActive ? '<span class="chip-dot"></span>' : ''}${c.groupLabel}${grpCount ? ` (${grpCount})` : ''} ${f.dokumenOpen ? '˄' : '˅'}</button>
        </div>
        ${f.dokumenOpen ? `<div class="chip-sub-panel"><div class="filter-flat-label">${c.groupItemsLabel}</div><div class="area-chip-wrap">${c.group.map(v => chip(f.jenisLayanan.has(v), 'toggleSvcJenis', v)).join('')}</div></div>` : ''}
      </div>
      <div class="filter-section"><div class="filter-flat-label">Wilayah Kerja</div>${renderWilayahSelects(kind)}</div>
      <div class="filter-section">
        <div class="filter-flat-label">Pengalaman</div>

        <div class="filter-range-row">

}

function paintPromoSlide(){
  const el = document.getElementById('promoContent');
  if(el) el.innerHTML = renderPromoSlide();
}

function setBannerSlide(i){
  state.bannerIndex = i;
  paintPromoSlide();
}

// Runs once (started at boot, see Boot section below) rather than being
// re-created on every render() — it just checks each tick whether the home
// banner is actually on screen before touching the DOM, and only repaints
// the banner itself so scroll position and the rest of the screen are
// undisturbed.
let bannerAutoplayStarted = false;
function startBannerAutoplay(){
  if(bannerAutoplayStarted) return;
  bannerAutoplayStarted = true;
  setInterval(() => {
    if(!state.token || state.screen !== 'home' || state.mode !== 'klien') return;
    state.bannerIndex = (state.bannerIndex + 1) % BANNER_SLIDES.length;
    paintPromoSlide();
  }, 4000);
}

// accept it first (dashboard "Permintaan Baru" section, further down) before
// the client is asked to pay. This assumes the backend creates the booking

// Express/Prisma backend needs a matching status + accept/reject endpoints

async function confirmBooking(){
  if(!state.selectedMethod || !state.selectedSlot) return;
  state.bookingSubmitting = true;
  state.bookingError = null;
  render();
  try{
    const booking = await api('/bookings', {
      method:'POST',
      body:{
        lawyerId: state.selectedLawyerDetail.id,
        method: state.selectedMethod,
        scheduledAt: slotToDate(state.selectedSlot).toISOString(),
        durationMinutes: 60,

      },
    });
    state.lastBooking = booking;
    state.lastPaymentRedirect = null;
    state.screen = 'confirm';
  }catch(e){
    state.bookingError = e.message;
  }finally{
    state.bookingSubmitting = false;
    render();

}

/* ============================================================
   Ruang chat (booking dengan metode chat)
============================================================ */
// true = tombol Mulai Chat aktif kapan saja setelah bayar (masa development).
// Ubah ke false sebelum rilis agar mengikuti jadwal (buka 5 menit sebelum jadwal).
// Backend punya aturan sendiri: jendela jadwal diabaikan selama
// MIDTRANS_IS_PRODUCTION bukan true.
const CHAT_IGNORE_SCHEDULE = true;

function chatButtonFor(b){
  if(b.method !== 'chat') return '';
  if(b.status === 'completed'){
    return `<div class="bi-actions"><button class="btn btn-outline" style="flex:1;" onclick="openChat('${b.id}')">Lihat Riwayat Chat</button></div>`;
  }
  if(b.status !== 'confirmed' && b.status !== 'ongoing') return '';
  const opensAt = new Date(new Date(b.scheduledAt).getTime() - 5*60*1000);
  const closesAt = new Date(new Date(b.scheduledAt).getTime() + (b.durationMinutes||30)*60*1000);
  const now = Date.now();
  if(!CHAT_IGNORE_SCHEDULE && now < opensAt.getTime()){
    return `<div class="bi-actions"><button class="btn btn-outline" style="flex:1;" disabled>Chat dibuka ${formatDateTime(opensAt)}</button></div>`;
  }
  if(!CHAT_IGNORE_SCHEDULE && now > closesAt.getTime() && b.status === 'confirmed'){
    return '';
  }
  return `<div class="bi-actions"><button class="btn btn-gold" style="flex:1;" onclick="openChat('${b.id}')">${b.status === 'ongoing' ? 'Lanjutkan Chat' : 'Mulai Chat'}</button></div>`;
}

async function openChat(bookingId){
  state.chat = { bookingId, booking: null, messages: [], draft: '', sending: false, error: null, loading: true, poll: null, tick: null };
  render(); resetScreenScroll();
  await chatFetch(true);
  const c = state.chat;
  if(!c) return;
  c.poll = setInterval(() => chatFetch(false), 3000);
  c.tick = setInterval(updateChatDom, 1000);
}
function closeChat(){
  const c = state.chat;
  if(c){ clearInterval(c.poll); clearInterval(c.tick); }
  state.chat = null;
  render(); resetScreenScroll();
  loadMyBookings();
}
async function chatFetch(initial){
  const c = state.chat;
  if(!c) return;
  // Jangan menumpuk permintaan bila server sedang lambat, dan hemat saat tab tersembunyi.
  if(c.fetching) return;
  if(!initial && typeof document !== 'undefined' && document.hidden) return;
  c.fetching = true;
  try{
    const last = c.messages.length ? c.messages[c.messages.length-1].createdAt : null;
    const url = '/bookings/' + c.bookingId + '/messages' + (!initial && last ? '?after=' + encodeURIComponent(last) : '');
    const res = await api(url);
    if(state.chat !== c) return;
    c.booking = Object.assign({}, c.booking || {}, res.booking);
    const known = new Set(c.messages.map(m => m.id));
    const fresh = (res.messages || []).filter(m => !known.has(m.id));
    // buang pesan sementara (optimistic) yang sudah digantikan pesan asli
    if(fresh.length) c.messages = c.messages.filter(m => !m.pending).concat(fresh);
    c.error = null;
  }catch(e){
    if(initial){ c.error = e.message; }
  }finally{
    c.fetching = false;
    if(state.chat === c){ c.loading = false; if(document.getElementById('chat-root')) updateChatDom(); else render(); }
  }
}
function chatInput(v){ if(state.chat) state.chat.draft = v; }
function chatKey(ev){
  if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); sendChat(); }
}
async function sendChat(){
  const c = state.chat;
  if(!c || c.sending) return;
  const ta = document.getElementById('chat-input');
  const body = ((ta && ta.value) || c.draft || '').trim();
  if(!body) return;
  c.sending = true; c.draft = ''; if(ta) ta.value = '';
  const temp = { id: 'tmp-' + Date.now(), senderId: state.user.id, body, createdAt: new Date().toISOString(), pending: true };
  c.messages.push(temp); c.error = null; updateChatDom(true);
  try{
    const m = await api('/bookings/' + c.bookingId + '/messages', { method:'POST', body:{ body } });
    c.messages = c.messages.filter(x => x.id !== temp.id);
    if(!c.messages.some(x => x.id === m.id)) c.messages.push(m);
    if(c.booking && c.booking.status === 'confirmed') c.booking.status = 'ongoing';
  }catch(e){
    c.messages = c.messages.filter(x => x.id !== temp.id);
    c.draft = body; if(ta) ta.value = body;
    c.error = e.message;
  }finally{
    c.sending = false; updateChatDom(true);
  }
}
async function endChatSessionNow(){
  const c = state.chat;
  if(!c || !confirm('Akhiri sesi chat ini? Setelah diakhiri, pesan tidak bisa dikirim lagi.')) return;
  try{
    await api('/bookings/' + c.bookingId + '/end', { method:'POST' });
    await chatFetch(false);
    c.booking = Object.assign({}, c.booking, { status:'completed', canSend:false });
    updateChatDom();
  }catch(e){ alert('Gagal mengakhiri sesi: ' + e.message); }
}
function chatClock(iso){
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + '.' + p(d.getMinutes());
}
function chatStatusLine(c){
  const b = c.booking;
  if(!b) return '';
  if(b.status === 'completed') return 'Sesi telah berakhir';
  if(b.devMode) return 'Mode uji · jadwal diabaikan';
  const now = Date.now(), o = new Date(b.opensAt).getTime(), e = new Date(b.closesAt).getTime();
  if(now < o){ return 'Dibuka ' + formatDateTime(b.opensAt); }
  const left = Math.max(0, e - now), p = n => String(n).padStart(2,'0');
  return 'Sisa waktu ' + p(Math.floor(left/60000)) + ':' + p(Math.floor(left%60000/1000));
}
function chatBubbles(c){
  const me = state.user.id;
  if(!c.messages.length){
    return `<div class="chat-empty">${c.loading ? 'Memuat…' : 'Belum ada pesan. Mulai percakapan dengan menulis pesan di bawah.'}</div>`;
  }
  return c.messages.map(m => `
    <div class="chat-row ${m.senderId === me ? 'me' : 'them'}">
      <div class="chat-bubble ${m.pending ? 'pending' : ''}">${escChat(m.body)}<span class="chat-time">${chatClock(m.createdAt)}</span></div>
    </div>`).join('');
}
function escChat(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function chatFooter(c){
  const b = c.booking;
  if(c.error && !b) return `<div class="chat-ended">${escChat(c.error)}</div>`;
  if(!b) return '';
  if(b.status === 'completed'){
    return `<div class="chat-ended">Sesi chat telah berakhir.${b.myRole === 'client' ? '<button class="btn btn-gold" style="width:100%;flex:none;margin-top:10px;" onclick="closeChat(); goToKonsultasi();">Kembali ke Aktivitas · Beri Ulasan</button>' : ''}</div>`;
  }
  if(!b.canSend){
    return `<div class="chat-ended">Chat belum dibuka. ${chatStatusLine(c)}</div>`;
  }
  return `
    ${c.error ? `<div class="pay-err" style="margin:0 0 6px;">${escChat(c.error)}</div>` : ''}
    <div class="chat-compose">
      <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Tulis pesan…" oninput="chatInput(this.value)" onkeydown="chatKey(event)">${escChat(c.draft).replace(/<br>/g,'\n')}</textarea>
      <button class="chat-send" onclick="sendChat()" aria-label="Kirim"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>`;
}
function renderChat(){
  const c = state.chat, b = c.booking;
  const name = b ? b.otherName : '…';
  return `
  <div class="screen active" id="chat-root" style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
    <div class="legal-head">
      <button class="legal-back" onclick="closeChat()" aria-label="Kembali"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="min-width:0;flex:1;">
        <div class="legal-title" id="chat-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escChat(name)}</div>
        <div class="chat-sub" id="chat-status">${chatStatusLine(c)}</div>
      </div>
      <button class="chat-end" id="chat-end" onclick="endChatSessionNow()" style="${b && b.myRole === 'lawyer' && b.status !== 'completed' ? '' : 'display:none;'}">Akhiri</button>
    </div>
    <div class="chat-notice">Bukan layanan darurat. Jika Anda dalam bahaya, hubungi 112 atau 110.</div>
    <div class="chat-msgs" id="chat-msgs">${chatBubbles(c)}</div>
    <div class="chat-foot" id="chat-foot">${chatFooter(c)}</div>
  </div>`;
}
// Perbarui bagian yang berubah saja, tanpa membangun ulang layar.
function updateChatDom(forceScroll){
  const c = state.chat;
  if(!c) return;
  const root = document.getElementById('chat-root');
  if(!root) return;
  const msgs = document.getElementById('chat-msgs');
  const nearBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
  const sig = c.messages.map(m => m.id + (m.pending?'p':'')).join(',') + '|' + c.loading;
  if(msgs.dataset.sig !== sig){
    msgs.innerHTML = chatBubbles(c); msgs.dataset.sig = sig;
    if(forceScroll === true || nearBottom || !msgs.dataset.init){ msgs.scrollTop = msgs.scrollHeight; msgs.dataset.init = '1'; }
  }
  const b = c.booking;
  const nm = document.getElementById('chat-name'); if(nm && b) nm.textContent = b.otherName;
  const st = document.getElementById('chat-status'); if(st) st.textContent = chatStatusLine(c);
  const en = document.getElementById('chat-end'); if(en) en.style.display = (b && b.myRole === 'lawyer' && b.status !== 'completed') ? '' : 'none';
  const foot = document.getElementById('chat-foot');
  const fsig = (b ? b.status + b.canSend : 'x') + '|' + (c.error || '');
  if(foot && foot.dataset.sig !== fsig){
    foot.innerHTML = chatFooter(c); foot.dataset.sig = fsig;
  }
}

// Builds the timeline events for one booking from the timestamps the API
// already returns (createdAt / respondedAt / payment.paidAt / scheduledAt /
// completedAt / cancelledAt), newest first — the same layout as a parcel
// tracking page.
function bookingTimeline(b, name){
  const ev = [];
  ev.push({ at: b.createdAt, title: 'Permintaan Dikirim', sub: 'Menunggu ' + name + ' menerima' });
  if(b.proposedAt){
    ev.push({ at: b.respondedAt, title: 'Jadwal Baru Diusulkan', sub: formatDateTime(b.proposedAt) + (b.proposalNote ? ' · ' + b.proposalNote : '') });
    if(b.proposalAnsweredAt){
      ev.push(b.status === 'cancelled'
        ? { at: b.proposalAnsweredAt, title: 'Usulan Jadwal Ditolak Klien', sub: '', tone: 'bad' }
        : { at: b.proposalAnsweredAt, title: 'Jadwal Baru Disetujui', sub: 'Menunggu pembayaran' });
    }
  }else if(b.respondedAt){
    ev.push(b.status === 'rejected'
      ? { at: b.respondedAt, title: 'Ditolak Pengacara', sub: name, tone: 'bad' }
      : { at: b.respondedAt, title: 'Disetujui Pengacara', sub: 'Menunggu pembayaran' });
  }
  if(b.status === 'expired') ev.push({ at: new Date(new Date(b.proposedAt ? b.respondedAt : b.createdAt).getTime() + 24*3600*1000).toISOString(), title: 'Kedaluwarsa', sub: 'Tidak dijawab dalam 24 jam', tone: 'bad' });
  if(b.payment && b.payment.paidAt){
    ev.push({ at: b.payment.paidAt, title: 'Pembayaran Berhasil', sub: formatRupiah(b.price), tone: 'good' });
  }
  if(['confirmed','ongoing','completed'].includes(b.status)){
    ev.push({ at: b.scheduledAt, title: b.status === 'ongoing' ? 'Konsultasi Berlangsung' : 'Jadwal Konsultasi', sub: methodLabelTitle(b.method) + ' · ' + name });
  }
  if(b.completedAt) ev.push({ at: b.completedAt, title: 'Konsultasi Selesai', sub: name, tone: 'good' });
  if(b.cancelledAt) ev.push({ at: b.cancelledAt, title: 'Dibatalkan', sub: '', tone: 'bad' });
  return ev.sort((a, c) => new Date(c.at) - new Date(a.at));
}

function formatTrackTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return d.toLocaleDateString('id-ID', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }) +
         ' | ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

   ------------------------------------------------------------
   Backed by the real /posts API (see backend/src/modules/posts). Photos
   are resized client-side to a max 1280px edge and re-encoded as JPEG
   before upload — keeps the base64 payload well under the backend's
   ~3.5MB ceiling and the request from ever hitting Vercel's body-size
   limit, since a raw phone-camera photo can otherwise be 5-10MB.
============================================================ */
async function loadCakrawalaFeed(){

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if(min < 1) return 'Baru saja';
  if(min < 60) return min + ' menit lalu';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' jam lalu';
  const day = Math.floor(hr / 24);
  if(day === 1) return 'Kemarin';
  if(day < 7) return day + ' hari lalu';
  return new Date(iso).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

// Deliberately does NOT call render() — that would rebuild the whole feed's
// innerHTML on every keystroke and kick focus out of the textarea. Instead
// it updates state (for submitCakrawalaPost to read) and flips just the
// submit button's disabled attribute directly, so "Bagikan" enables live
// as you type instead of staying stuck in whatever state it was first
// rendered in.
function onCakrawalaComposerInput(v){
  state.cakrawalaComposerText = v;
  const btn = document.getElementById('cakrawala-submit-btn');
  if(btn) btn.disabled = !(v.trim().length > 0 || !!state.cakrawalaComposerPhoto);
}

// Downscales/re-encodes the picked image on a <canvas> before it ever
// becomes a data URL, so a 10MB phone photo turns into a few hundred KB
// JPEG — the actual thing keeping uploads under the backend's size limit.
function onCakrawalaPhotoPicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX_EDGE = 1280;
      let { width, height } = img;
      if(width > MAX_EDGE || height > MAX_EDGE){
        if(width >= height){ height = Math.round(height * (MAX_EDGE / width)); width = MAX_EDGE; }
        else{ width = Math.round(width * (MAX_EDGE / height)); height = MAX_EDGE; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      state.cakrawalaComposerPhoto = canvas.toDataURL('image/jpeg', 0.78);
      render();
    };
    img.onerror = () => { alert('Foto tidak bisa dibaca, coba foto lain.'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeComposerPhoto(){ state.cakrawalaComposerPhoto = null; render(); }

async function submitCakrawalaPost(){
  const text = state.cakrawalaComposerText.trim();
  const photo = state.cakrawalaComposerPhoto;
  if(!text && !photo) return;

  state.cakrawalaPosting = true;
  render();
  try{
    const post = await api('/posts', { method:'POST', body:{ text: text || undefined, photo: photo || undefined } });
    state.cakrawalaPosts.unshift(post);
    state.cakrawalaComposerText = '';
    state.cakrawalaComposerPhoto = null;
  }catch(e){
    alert(e.message);
  }finally{
    state.cakrawalaPosting = false;
    render();
  }
}

async function toggleLikePost(postId){
  const post = state.cakrawalaPosts.find(p => p.id === postId);
  if(!post || state.cakrawalaLikeBusy[postId]) return;
  state.cakrawalaLikeBusy[postId] = true;

  // Optimistic update — flip immediately, reconcile (or roll back) once
  // the request settles, so tapping "Suka" feels instant on a slow network.
  const prevLiked = post.likedByMe;
  post.likedByMe = !prevLiked;
  post.likesCount += post.likedByMe ? 1 : -1;
  render();

  try{
    const result = await api(`/posts/${postId}/like`, { method:'POST' });
    post.likedByMe = result.liked;
  }catch(e){
    post.likedByMe = prevLiked;
    post.likesCount += prevLiked ? 1 : -1;
  }finally{
    delete state.cakrawalaLikeBusy[postId];
    render();
  }
}

function toggleComments(postId){
  state.cakrawalaOpenComments[postId] = !state.cakrawalaOpenComments[postId];
  render();
}
// Same reasoning as onCakrawalaComposerInput — no render() here, just a
// direct disabled-attribute flip, so the send button reacts immediately
// without knocking focus out of the comment field mid-type.
function onCommentDraftInput(postId, v){
  state.cakrawalaCommentDraft[postId] = v;
  const btn = document.getElementById('comment-send-' + postId);
  if(btn) btn.disabled = !v.trim();
}

async function submitComment(postId){
  const text = (state.cakrawalaCommentDraft[postId] || '').trim();
  if(!text || state.cakrawalaCommentBusy[postId]) return;
  const post = state.cakrawalaPosts.find(p => p.id === postId);
  if(!post) return;

  state.cakrawalaCommentBusy[postId] = true;
  render();
  try{
    const comment = await api(`/posts/${postId}/comments`, { method:'POST', body:{ text } });
    post.comments.push(comment);
    state.cakrawalaCommentDraft[postId] = '';
  }catch(e){
    alert(e.message);
  }finally{
    delete state.cakrawalaCommentBusy[postId];
    render();
  }
}

  }
}

function useCurrentLocationForProfile(){
  const f = state.profileForm;
  if(!navigator.geolocation){
    f.locationError = 'Perangkat/browser ini tidak mendukung deteksi lokasi.';
    render();
    return;
  }
  f.locating = true;
  f.locationError = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      f.latitude = pos.coords.latitude;
      f.longitude = pos.coords.longitude;
      f.locating = false;
      render();
    },
    (err) => {
      f.locating = false;
      f.locationError = err.code === 1
        ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk browser ini lalu coba lagi.'
        : 'Gagal mendapatkan lokasi. Coba lagi.';
      render();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function submitLawyerProfile(){
  const f = state.profileForm;
  const barRegistrationNumber = document.getElementById('pf-bar').value.trim();
  const city = document.getElementById('pf-city').value.trim();
  const bio = document.getElementById('pf-bio').value.trim();
  const yearsExperience = Number(document.getElementById('pf-exp').value || 0);
  const hourlyRateChat = Number(document.getElementById('pf-rate-chat').value || 0);
  const hourlyRateVideo = Number(document.getElementById('pf-rate-video').value || 0);

  state.profileFormSubmitting = true;
  state.profileFormError = null;

  try{
    await api('/lawyers/me/profile', {
      method:'PUT',
      body:{
        barRegistrationNumber, city, bio: bio || undefined,
        yearsExperience, hourlyRateChat, hourlyRateVideo,
        specializationIds: Array.from(f.specializationIds),
        gender: f.gender || undefined,
        caseLevels: Array.from(f.caseLevels),
        serviceTypes: Array.from(f.serviceTypes),

/* ============================================================
   Live-ish updates while the tab stays open
   ------------------------------------------------------------
   This mockup has no real push-notification channel — it's a static
   HTML file with no server to push from. What it CAN do honestly is
   poll the API for booking changes while the app is open and, if
   anything new shows up, both bump the nav badge above and fire a
   browser Notification() popup (notifyNewActivity()). That covers the
   "I'm using the app right now" case. Getting a phone notification
   while Lexara is closed needs real infrastructure on the actual
   Express/Prisma backend — e.g. Firebase Cloud Messaging or web push
   (VAPID) — which is outside what a front-end mockup file can provide.
============================================================ */
async function pollForBookingUpdates(){
  if(!state.token || !state.user) return;
  if(typeof document !== 'undefined' && document.hidden) return; // tab not in front — skip this tick
  const before = new Map(state.myBookings.map(b => [b.id, b.status]));
  try{
    const fresh = await api('/bookings/me');
    const isLawyer = state.user.role === 'lawyer';
    fresh.forEach(b => {
      const prevStatus = before.get(b.id);
      if(prevStatus === undefined) return; // first load — nothing to compare yet
      if(prevStatus === b.status) return;
      if(isLawyer && b.status === 'pending_approval'){
        notifyNewActivity('Permintaan konsultasi baru', (b.client ? b.client.fullName : 'Klien') + ' mengajukan konsultasi.');
      }else if(!isLawyer && b.status === 'pending_payment'){
        notifyNewActivity('Permintaan diterima', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' menerima permintaan Anda — lanjutkan pembayaran.');
      }else if(!isLawyer && b.status === 'pending_reschedule'){
        notifyNewActivity('Usulan jadwal baru', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' mengusulkan jam lain untuk konsultasi Anda.');
      }else if(!isLawyer && b.status === 'rejected'){
        notifyNewActivity('Permintaan ditolak', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' tidak dapat menerima permintaan Anda.');
      }
    });
    state.myBookings = fresh;
    render();
  }catch(e){ /* silent — this is a background refresh, not a user action */ }
}

/* ---------- navigasi ---------- */
function flowOpen(view, extra){
  const prev = state.flow;
  stopFlowPoll();
  state.flow = Object.assign({ view, draft:{}, error:null, busy:false, msgs:[], back:null }, extra || {});
  if(prev && prev.view && view !== 'inbox' && !state.flow.back) state.flow.back = { view: prev.view, id: prev.id };
  render(); resetScreenScroll();
}
function flowClose(){ stopFlowPoll(); state.flow = null; render(); }
function flowBack(){
  const f = state.flow; if(!f) return;
  const b = f.back;
  if(f.view === 'inbox' || !b || b.view === 'detail'){ flowClose(); return; }
  if(b.view === 'conv') openFlowConv(b.id, true);
  else if(b.view === 'eng') openFlowEng(b.id, true);
  else openFlowInbox();
}
function stopFlowPoll(){ const f = state.flow; if(f && f.poll){ clearInterval(f.poll); f.poll = null; } }

/* ---------- inbox ---------- */
async function openFlowInbox(){
  flowOpen('inbox', { convs:[], engs:[], notifs:null, loading:true });
  await flowLoadInbox();
}
async function flowLoadInbox(){
  const f = state.flow; if(!f || f.view !== 'inbox') return;
  try{
    const [convs, engs, notifs] = await Promise.all([fl('/conversations'), fl('/engagements'), fl('/notifications')]);
    f.convs = convs; f.engs = engs; f.notifs = notifs; f.error = null;
    state.flowUnread = notifs.unread;
  }catch(e){ f.error = e.message; }
  f.loading = false; render();
}
async function flowMarkRead(){ try{ await fl('/notifications/read', { method:'POST' }); state.flowUnread = 0; if(state.flow && state.flow.notifs){ state.flow.notifs.unread = 0; state.flow.notifs.items.forEach(i => i.readAt = i.readAt || new Date().toISOString()); } render(); }catch(e){} }
async function flowRefreshBadge(){
  if(!state.token || !state.user) return;
  if(typeof document !== 'undefined' && document.hidden) return;
  try{ const n = await fl('/notifications'); const old = state.flowUnread || 0; state.flowUnread = n.unread; if(n.unread > old && n.items[0]) notifyNewActivity(n.items[0].title, n.items[0].body); if(n.unread !== old && !state.flow) render(); }catch(e){}
}

async function submitFlowNew(){
  const f = state.flow, d = f.draft;
  if(!d.title || d.title.trim().length < 3){ f.error = 'Isi judul singkat (min. 3 karakter).'; render(); return; }
  if(!d.brief || d.brief.trim().length < 10){ f.error = 'Ceritakan kebutuhan Anda (min. 10 karakter).'; render(); return; }
  f.busy = true; f.error = null; render();
  try{
    const c = await fl('/conversations', { method:'POST', body:{
      mitraId:f.mitra.id, service:d.service, practiceArea:d.practiceArea, tier:d.tier, title:d.title.trim(), brief:d.brief.trim(),
      opposingParty:(d.opposing||'').trim() || undefined, urgent:!!d.urgent, safetyAnswer:d.safety } });
    flowOpen('conv', { id:c.id, conv:c, back:{ view:'inbox' } }); flowStartConvPoll(); flowLoadMsgs(true);
  }catch(e){ f.busy = false; f.error = e.message; render(); }
}

/* ---------- detail obrolan ---------- */
async function openFlowConv(id, keepBack){
  const back = keepBack ? null : undefined;
  flowOpen('conv', { id, conv:null, loading:true, back: state.flow && state.flow.view === 'inbox' ? { view:'inbox' } : (state.flow && state.flow.back) || { view:'inbox' } });
  await flowLoadConv();
  flowStartConvPoll();
  flowLoadMsgs(true);
}
async function flowLoadConv(){
  const f = state.flow; if(!f || f.view !== 'conv') return;
  try{ f.conv = await fl('/conversations/' + f.id); f.error = null; }catch(e){ f.error = e.message; }
  f.loading = false;
  if(!flowTyping()) render();
}
function flowTyping(){ const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#app')); }
function flowStartConvPoll(){
  const f = state.flow; if(!f) return;
  f.poll = setInterval(async () => {
    if(document.hidden || f.pollBusy) return; f.pollBusy = true;
    try{ await flowLoadMsgs(false); const sig = JSON.stringify(f.conv && [f.conv.status, f.conv.actions, f.conv.offers && f.conv.offers.length, f.conv.agreement && [f.conv.agreement.clientSignedAt, f.conv.agreement.mitraSignedAt], f.conv.engagementId]);
      const c = await fl('/conversations/' + f.id); const s2 = JSON.stringify([c.status, c.actions, c.offers.length, c.agreement && [c.agreement.clientSignedAt, c.agreement.mitraSignedAt], c.engagementId]);
      f.conv = c; if(s2 !== sig && !flowTyping()) render(); }catch(e){} finally{ f.pollBusy = false; }
  }, 4000);
}
async function flowLoadMsgs(scroll){
  const f = state.flow; if(!f || f.view !== 'conv') return;
  try{
    const last = f.msgs.length ? f.msgs[f.msgs.length-1].createdAt : null;
    const rows = await fl('/conversations/' + f.id + '/messages' + (last ? '?after=' + encodeURIComponent(last) : ''));
    const have = new Set(f.msgs.map(m => m.id));
    const fresh = rows.filter(r => !have.has(r.id));
    if(fresh.length || scroll){ f.msgs = f.msgs.concat(fresh); flowPaintMsgs(scroll === true || fresh.length > 0); }
  }catch(e){}
}
function flowMsgsHtml(f){
  if(!f.msgs.length) return '<div class="chat-empty">Belum ada pesan.</div>';
  return f.msgs.map(m => {
    const me = m.senderId === state.user.id;
    return `<div class="chat-row ${me?'me':'them'}"><div class="chat-bubble">${flEsc(m.body)}<span class="chat-time">${new Date(m.createdAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div></div>`;
  }).join('');
}
function flowPaintMsgs(scroll){
  const el = document.getElementById('fl-msgs'); if(!el) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = flowMsgsHtml(state.flow);
  if(scroll && near || !el.dataset.init){ el.scrollTop = el.scrollHeight; el.dataset.init = '1'; }
}
function flHas(c, a){ return c.actions && c.actions.indexOf(a) >= 0; }
async function flAct(fn, after){
  const f = state.flow; if(!f || f.busy) return; f.busy = true; f.error = null; render();
  try{ const r = await fn(); if(after) after(r); if(f.needReload){ f.needReload = false; f.conv = await fl('/conversations/' + f.id); } }catch(e){ f.error = e.message; }
  f.busy = false; render();
}
function flConvCall(path, body){ return () => fl('/conversations/' + state.flow.id + path, { method:'POST', body: body || {} }); }
function flSetConv(r){ if(r && r.id && r.actions) state.flow.conv = r; else if(r && r.conversation) state.flow.conv = r.conversation; else state.flow.needReload = true; }

function flowPayFee(){ flAct(() => fl('/conversations/' + state.flow.id + '/pay/simulate', { method:'POST', body:{ method:'simulasi' } }), flSetConv); }
function flowSend(){

  if(flHas(c,'decline')) btns.push(`<button class="btn btn-outline" onclick="flDoConv('/decline',null,'Tolak obrolan ini? Bila belum ada pembahasan inti, biaya Pelanggan dikembalikan.')">Tolak</button>`);

  if(flHas(c,'complaint')) btns.push(`<button class="btn btn-outline" onclick="flowComplaint()">Balasan tidak bermakna</button>`);

    ${flHead(c.title, other + ' · ' + st)}
    <div class="content" style="flex:1;min-height:0;overflow-y:auto;padding:12px 14px 10px;">
      ${flErr()}${banner}
      ${c.opposingParty ? `<div class="fl-kv"><span>Pihak lawan</span><b>${flEsc(c.opposingParty)}</b></div>` : ''}
      <div class="fl-kv"><span>Biaya Platform</span><b>${formatRupiah(c.fee.amount)} · ${c.fee.status==='paid'?'Dibayar':c.fee.status==='refunded'?'Dikembalikan':c.fee.status==='pending'?'Belum dibayar':c.fee.status}</b></div>
      ${c.myRole==='mitra' ? `<div class="about-box" style="margin:8px 0;"><small style="color:var(--ink-soft);">Ringkasan dari Pelanggan</small><div>${flEsc(c.brief)}</div></div>` : ''}
      ${renderFlowOffers(c)}

      ${showChat ? `<div class="section-title" style="margin-top:14px;">Percakapan</div>
        <div class="chat-notice" style="border-radius:8px;margin-bottom:6px;">Bagikan identitas lengkap, nomor kontak, atau ajakan transaksi di luar platform dilarang sampai PKS aktif.</div>
        <div class="fl-msgs chat-msgs" id="fl-msgs">${flowMsgsHtml(f)}</div>` : ''}
    </div>
    ${showChat && canSend ? `<div class="chat-foot"><div class="chat-compose"><textarea id="fl-msg" rows="1" placeholder="Tulis pesan…" oninput="flSet('msg', this.value)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();flowSend();}">${flEsc(flDraft('msg')).replace(/<br>/g,'\n')}</textarea>
      <button class="chat-send" onclick="flowSend()" aria-label="Kirim"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div></div>` : ''}

function flowComplaint(){ const n = prompt('Jelaskan mengapa balasan Mitra tidak bermakna (maks. 24 jam setelah balasan pertama):'); if(n && n.trim().length >= 3) flDoConv('/complaint', { note:n.trim() }); }
function flowReportOff(){ const n = prompt('Ceritakan singkat ajakan transaksi di luar platform (opsional):') ; if(n !== null) flDoConv('/report-offplatform', { note:(n||'').trim() }); }

/* ---------- penawaran ---------- */
function renderFlowOffers(c){
  if(!c.offers || !c.offers.length) return f2offerFormHtml();

    <div class="fl-item-sub">${o.mine?'Dari Anda':'Dari pihak lawan'} · ${o.durationDays} hari${o.thirdPartyCost?` · biaya pihak ketiga ${formatRupiah(o.thirdPartyCost)}`:''}</div>
    <div style="font-size:13px;margin:4px 0;">${flEsc(o.scope)}</div>
    <ol style="margin:4px 0 0 18px;padding:0;font-size:12.5px;">${(o.termins||[]).map(t => `<li>${flEsc(t.description)} — ${formatRupiah(t.amount)}</li>`).join('')}</ol>

    ${o.status==='pending' && !o.mine ? `<div class="fl-btns"><button class="btn btn-primary" onclick="flDoConv('/offers/confirm',null,'Setujui tawaran ${formatRupiah(o.amount)}? PKS akan dibuat dari tawaran ini.')">Setujui</button><button class="btn btn-outline" onclick="flowOpenOfferForm(true)">Tawar balik</button></div>` : ''}
  </div>`).join('');

}
function f2offerFormHtml(){
  const f = state.flow, d = f.offerForm; if(!d) return '';
  const sum = d.termins.reduce((s,t) => s + (parseInt(t.amount,10)||0), 0);
  const total = parseInt(d.amount,10) || 0;
  const mitra = f.conv.myRole === 'mitra';
  return `<div class="fl-form"><div class="section-title" style="margin-top:0;">${d.counter?'Tawar balik':'Penawaran baru'}</div>

    <div class="field"><label>Lingkup pekerjaan</label><textarea rows="3" oninput="flowOfferSet('scope', this.value)">${flEsc(d.scope).replace(/<br>/g,'\n')}</textarea></div>

    <div class="field"><label>Termin pembayaran</label>
      ${d.termins.map((t,i) => `<div class="fl-termin"><input placeholder="Deskripsi termin ${i+1}" value="${flEsc(t.description)}" oninput="flowTerminSet(${i},'description',this.value)"><input type="number" inputmode="numeric" placeholder="Rp" value="${t.amount}" oninput="flowTerminSet(${i},'amount',this.value)">${d.termins.length>1?`<button class="btn-link" onclick="flowTerminDel(${i})">✕</button>`:''}</div>`).join('')}
      <button class="btn-link" onclick="flowTerminAdd()">+ Tambah termin</button>
      <div class="fl-sum" id="fl-termin-sum" style="margin-top:6px;"><span>Jumlah termin</span><b style="color:${sum===total?'inherit':'var(--danger)'}">${formatRupiah(sum)}${sum===total?' ✓':' (harus = total)'}</b></div></div>
    <div class="field"><label>Biaya pihak ketiga (opsional, dana titipan)</label><input type="number" inputmode="numeric" value="${d.thirdPartyCost}" oninput="flowOfferSet('thirdPartyCost', this.value)"></div>
    ${mitra ? `<div class="field"><label>Alasan (wajib bila di luar rentang indikatif Anda)</label><input value="${flEsc(d.reason)}" oninput="flowOfferSet('reason', this.value)"></div>` : ''}
    <div class="fl-btns"><button class="btn btn-primary" ${f.busy?'disabled':''} onclick="flowSubmitOffer()">Kirim</button><button class="btn btn-outline" onclick="flowCloseOfferForm()">Batal</button></div></div>`;
}
function flowOpenOfferForm(counter){
  const f = state.flow, p = f.conv.pendingOffer;
  f.offerForm = p && counter ? { counter:true, amount:p.amount, scope:p.scope, durationDays:p.durationDays, termins:p.termins.map(t => ({ description:t.description, amount:t.amount })), thirdPartyCost:p.thirdPartyCost||0, reason:'' }

function flowCloseOfferForm(){ state.flow.offerForm = null; render(); }
function flowOfferSet(k, v){ state.flow.offerForm[k] = v; if(k === 'amount') flowSumRefresh(); }
function flowTerminSet(i, k, v){ state.flow.offerForm.termins[i][k] = v; flowSumRefresh(); }
function flowSumRefresh(){
  const d = state.flow.offerForm, el = document.getElementById('fl-termin-sum'); if(!el) return;
  const sum = d.termins.reduce((s,t) => s + (parseInt(t.amount,10)||0), 0), total = parseInt(d.amount,10)||0;
  el.innerHTML = `<span>Jumlah termin</span><b style="color:${sum===total?'inherit':'var(--danger)'}">${formatRupiah(sum)}${sum===total?' ✓':' (harus = total)'}</b>`;
}
function flowTerminAdd(){ if(state.flow.offerForm.termins.length < 12){ state.flow.offerForm.termins.push({ description:'', amount:'' }); render(); } }
function flowTerminDel(i){ state.flow.offerForm.termins.splice(i,1); render(); }
function flowSubmitOffer(){
  const d = state.flow.offerForm;
  const body = { amount:parseInt(d.amount,10), scope:d.scope.trim(), durationDays:parseInt(d.durationDays,10),
    termins:d.termins.map(t => ({ description:t.description.trim(), amount:parseInt(t.amount,10) })), thirdPartyCost:parseInt(d.thirdPartyCost,10)||0, reason:(d.reason||'').trim() || undefined };

      ${!mine ? `<div class="fl-sign">

        <div class="fl-termin"><input inputmode="numeric" maxlength="8" placeholder="Masukkan kode OTP" value="${flEsc(flDraft('otp'))}" oninput="flSet('otp', this.value)"><button class="btn btn-primary" style="flex:none;padding:10px 16px;" onclick="flowSign()">Tanda tangani</button></div>` : ''}
      </div>` : ''}`;

  return `<div class="fl-offer pending" style="margin-top:12px;"><div class="fl-item-top"><b>Perjanjian Kerja Sama (PKS)</b></div>${body}
    ${c.engagementId ? `<div class="fl-btns"><button class="btn btn-gold" onclick="openFlowEng('${c.engagementId}')">Buka pekerjaan</button></div>` : ''}</div>`;
}
async function flowToggleDoc(){
  const f = state.flow; f.showDoc = !f.showDoc; render();

function flowSign(){

  flAct(() => fl('/conversations/' + f.id + '/agreement/sign', { method:'POST', body:{ otp:(f.draft.otp||'').trim(), consentIdentity:!!f.draft.c02 } }), r => { flSetConv(r); f.otpInfo = null; f.draft.otp = ''; });
}

/* ---------- pekerjaan (engagement) ---------- */
async function openFlowEng(id, keepBack){
  const prev = state.flow;
  flowOpen('eng', { id, eng:null, loading:true, back: prev && prev.view === 'conv' ? { view:'conv', id: prev.id } : { view:'inbox' } });
  await flowLoadEng();

  catch(err){ if(!quiet){ f.error = err.message; f.loading = false; render(); } }
}
function flEngCall(path, body){ return () => fl('/engagements/' + state.flow.id + path, { method:'POST', body: body || {} }); }
function flSetEng(r){ if(r && r.id && r.milestones) state.flow.eng = r; }
function flDoEng(path, body, confirmText){ if(confirmText && !confirm(confirmText)) return; flAct(flEngCall(path, body), flSetEng); }
function flowEngRef(){ return state.flow && state.flow.eng; }

      ${prog}
      ${e.myRole==='mitra' ? `<div class="section-title" style="margin-top:16px;">Catatan privat <small style="font-weight:500;color:var(--ink-soft);">(hanya Anda)</small></div>
        <div class="field"><textarea rows="2" placeholder="Catatan internal…" oninput="flSet('note', this.value)">${flEsc(flDraft('note')).replace(/<br>/g,'\n')}</textarea><button class="btn btn-outline" style="margin-top:6px;" onclick="flowPostNote()">Simpan catatan</button></div>
        ${(e.privateNotes||[]).map(n => `<div class="fl-note"><div>${flEsc(n.body)}</div><small>${flDate(n.createdAt)}</small></div>`).join('')}` : ''}
      ${A('feedback') ? renderFlowFeedback(e) : ''}
      <div class="section-title" style="margin-top:16px;">Perjanjian</div>
      <button class="btn-link" onclick="flowToggleEngDoc()">${f.showDoc?'Sembunyikan':'Baca'} isi PKS</button>
      ${f.showDoc ? `<pre class="fl-doc">${flEsc(e.agreement.docText)}</pre><div style="font-size:11px;color:var(--ink-soft);">SHA-256: ${e.agreement.docHash}</div>` : ''}
    </div></div>`;
}
function flowToggleEngDoc(){ state.flow.showDoc = !state.flow.showDoc; render(); }
function flowPostProgress(){ const b = (state.flow.draft.prog||'').trim(); if(!b) return; flAct(flEngCall('/progress', { body:b }), r => { flSetEng(r); state.flow.draft.prog = ''; }); }
function flowPostNote(){ const b = (state.flow.draft.note||'').trim(); if(!b) return; flAct(flEngCall('/notes', { body:b }), r => { flSetEng(r); state.flow.draft.note = ''; }); }

/* adendum */
function renderFlowAddendum(e){
  const a = e.addendum; if(!a || a.status !== 'pending') return '';
  const f = state.flow, mine = e.myRole === 'client' ? a.clientSignedAt : a.mitraSignedAt;
  return `<div class="fl-offer pending" style="margin-top:12px;"><b>Adendum diusulkan</b><div style="font-size:13px;margin:4px 0;">${flEsc(a.summary)}</div>
    <small style="color:var(--ink-soft);">Batas tanda tangan ${flDate(a.expiresAt)} · Klien ${a.clientSignedAt?'✓':'belum'} · Mitra ${a.mitraSignedAt?'✓':'belum'}</small>
    ${!mine ? `<div class="fl-btns"><button class="btn btn-outline" onclick="flowAddOtp()">Kirim OTP</button></div>
      ${f.otpInfo ? `<div style="font-size:12px;">${f.otpInfo.devCode?`<b>Kode (dev): ${f.otpInfo.devCode}</b>`:'Kode terkirim.'}</div><div class="fl-termin"><input inputmode="numeric" placeholder="Kode OTP" value="${flEsc(flDraft('otp'))}" oninput="flSet('otp', this.value)"><button class="btn btn-primary" style="flex:none;padding:10px 16px;" onclick="flowAddSign()">Tanda tangani</button></div>` : ''}` : ''}</div>`;
}
function flowAddendum(){ const s = prompt('Jelaskan perubahan lingkup / biaya yang diusulkan:'); if(s && s.trim().length >= 5) flDoEng('/addendum', { summary:s.trim() }); }
function flowAddOtp(){ flAct(flEngCall('/addendum/otp'), r => { state.flow.otpInfo = r; }); }
function flowAddSign(){ const f = state.flow; flAct(flEngCall('/addendum/sign', { otp:(f.draft.otp||'').trim() }), r => { flSetEng(r); f.otpInfo = null; f.draft.otp = ''; }); }

/* sengketa */
function flowOpenDispute(seq){
  const r = prompt('Jelaskan alasan sengketa (min. 10 karakter). Hanya termin terkait yang dibekukan; Lexara menyimpan cuplikan PKS dan progres saat ini.');
  if(r && r.trim().length >= 10) flDoEng('/dispute', { reason:r.trim(), milestoneSeq: seq || undefined });
}
function renderFlowDispute(e){
  const d = e.dispute; if(!d) return '';
  const label = { open:'Level 1 — penyelesaian bersama (48 jam)', escalated:'Level 2 — mediasi Lexara', decided:'Diputuskan', appealed:'Banding ditinjau', resolved:'Selesai' }[d.status] || d.status;
  const outcome = { release_to_mitra:'Dana dilepas ke Mitra', refund_to_client:'Dana dikembalikan ke Pelanggan', split:'Dana dibagi sebagian' }[d.outcome] || '';
  return `<div class="fl-offer pending" style="margin-top:12px;"><b>Sengketa — ${label}</b>
    <div style="font-size:13px;margin:4px 0;">${flEsc(d.reason)}</div>
    ${d.status==='open' ? `<small>Batas Level 1: ${flDate(d.level1Deadline)}</small><div class="fl-btns"><button class="btn btn-outline" onclick="flDoEng('/dispute/escalate',null,'Naikkan ke mediasi Lexara (Level 2)?')">Naikkan ke Level 2</button></div>` : ''}
    ${d.status==='escalated' ? `<small>Target putusan: ${flDate(d.targetDecisionAt)} (10 hari kerja)</small>` : ''}
    ${(d.status==='decided'||d.status==='appealed'||d.status==='resolved') ? `<div class="fl-warn" style="background:var(--gold-pale);color:inherit;"><b>${outcome}</b><div>${flEsc(d.decision||'')}</div></div>` : ''}
    ${d.status==='decided' ? `<small>Banding dapat diajukan sampai ${flDate(d.appealDeadline)}</small><div class="fl-btns"><button class="btn btn-outline" onclick="flowAppeal()">Ajukan banding</button></div>` : ''}</div>`;
}
function flowAppeal(){ const r = prompt('Alasan banding:'); if(r && r.trim().length >= 3) flDoEng('/dispute/appeal', { reason:r.trim() }); }

/* umpan balik buta-ganda */
function renderFlowFeedback(e){
  const fb = e.feedback, f = state.flow;
  const sealedNote = fb.sealed ? `<div class="fl-banner"><div>Ulasan bersifat <b>tersegel</b>: baru terbuka setelah kedua pihak mengisi atau pada hari ke-7 (${flDate(e.feedbackDeadline)}). ${fb.otherSubmitted ? 'Pihak lawan sudah mengisi.' : ''}</div></div>` : '';
  const rating = flDraft('rating', fb.mine ? fb.mine.rating : 0);
  const canForm = !fb.mine || fb.canEdit;
  const mineBox = fb.mine ? `<div class="fl-note"><b>Ulasan Anda</b> · ${stars(fb.mine.rating)}<div>${flEsc(fb.mine.review||'')}</div></div>` : '';
  const otherBox = !fb.sealed && fb.other ? `<div class="fl-note"><b>Ulasan pihak lawan</b> · ${stars(fb.other.rating)}<div>${flEsc(fb.other.review||'')}</div>${fb.other.reply?`<div style="margin-top:4px;"><i>Balasan: ${flEsc(fb.other.reply)}</i></div>`:''}</div>` : '';
  const replyBtn = !fb.sealed && e.myRole==='mitra' && fb.other && fb.other.authorRole==='client' && !fb.other.reply ? `<button class="btn btn-outline" onclick="flowReply()">Balas ulasan (satu kali)</button>` : '';
  const reportBtn = !fb.sealed && fb.other ? `<button class="btn-link" onclick="flowReportFb()">Laporkan ulasan</button>` : '';
  return `<div class="section-title" style="margin-top:16px;">Umpan balik</div>${sealedNote}${mineBox}${otherBox}
    ${canForm ? `<div class="field"><label>Beri nilai</label><div class="fl-stars">${[1,2,3,4,5].map(n => `<button class="${n<=rating?'on':''}" onclick="flSetRender('rating',${n})">★</button>`).join('')}</div>
      <textarea rows="3" placeholder="Ulasan (opsional)" oninput="flSet('review', this.value)">${flEsc(flDraft('review', fb.mine?fb.mine.review||'':'')).replace(/<br>/g,'\n')}</textarea>
      <button class="btn btn-primary" style="margin-top:6px;" onclick="flowSubmitFb()">${fb.mine?'Ubah (maks. 24 jam)':'Kirim umpan balik'}</button></div>` : ''}
    <div class="fl-btns">${replyBtn}${reportBtn}</div>`;
}
function flowSubmitFb(){ const f = state.flow, r = flDraft('rating', f.eng.feedback.mine ? f.eng.feedback.mine.rating : 0); if(!r){ f.error = 'Pilih rating 1–5.'; render(); return; }
  flAct(flEngCall('/feedback', { rating:r, review:flDraft('review', f.eng.feedback.mine ? f.eng.feedback.mine.review||'' : '') || undefined }), flSetEng); }
function flowReply(){ const r = prompt('Balasan Anda (hanya satu kali):'); if(r && r.trim()) flDoEng('/feedback/reply', { reply:r.trim() }); }
function flowReportFb(){ const n = prompt('Alasan melaporkan ulasan ini:'); if(n !== null) flAct(flEngCall('/feedback/report', { note:(n||'').trim() }), () => { alert('Laporan diterima dan akan ditinjau.'); }); }

/* ---------- pemasangan ke render() ---------- */
function renderFlow(){
  const f = state.flow;
  if(f.view === 'inbox') return renderFlowInbox();
  if(f.view === 'new') return renderFlowNew();
  if(f.view === 'conv') return renderFlowConv();
  if(f.view === 'eng') return renderFlowEng();
  if(f.view === 'profile') return renderProfileView();
  return '';
}

async function flowSyncConsent(){
  try{
    if(!state.token) return;
    const c = readLegalConsent(); if(!c.version || !c.privacyAt || !c.policyAt || !c.termsAt) return;
    await fl('/consents', { method:'POST', body:{ docs:[ { documentKey:'privacy', version:c.version, acceptedAt:c.privacyAt }, { documentKey:'privacy_policy', version:c.version, acceptedAt:c.policyAt }, { documentKey:'terms', version:c.version, acceptedAt:c.termsAt } ] } });
  }catch(e){}
}

/* ============================================================
   Boot
============================================================ */
loadSession();
render();
if(state.token){
  loadLawyers();
  loadMyBookings();
  loadCakrawalaFeed();
  // 60s, not 20s — this hits the API on every open tab; too short risks
  // exhausting Supabase's connection pool on small/free-tier plans and
  // showing "terjadi kesalahan pada server" more often than before this
  // polling existed. Widen further (or drop it) if errors keep happening.
  setInterval(pollForBookingUpdates, 60000);
  flowSyncConsent(); flowRefreshBadge();
  setInterval(flowRefreshBadge, 60000);
}
startBannerAutoplay();
</script>
</body>
</html>
