/* ---------- API helper ---------- */
async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json' };
  if(opts.auth !== false && state.token){
    headers['Authorization'] = 'Bearer ' + state.token;
  }
  let res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  }catch(networkErr){
    throw new Error('Tidak bisa menghubungi server (' + API_BASE + '). Pastikan backend sedang berjalan.');
  }
  let data = {};
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    let msg = data && data.error ? data.error : ('Permintaan gagal (' + res.status + ')');
    if(data && data.detail) msg += '\n\nDetail teknis: ' + data.detail;
    throw new Error(msg);
  }
  return data;
}

function initials(name){ return (name||'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function formatRupiah(n){ return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function stars(rating){ const full = Math.round(rating||0); return '★'.repeat(full) + '☆'.repeat(5-full); }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) + ', ' +
         d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
}

/* ============================================================
   Render root
============================================================ */
// render() always rebuilds #app's HTML from scratch, which would otherwise
// silently reset any open scrollable panel — the active screen, or a filter
// bottom sheet's .sheet-body — back to the top on every single tap (e.g.
// picking a filter chip). This captures the current scroll position(s)
// before the rebuild and restores them on the freshly-created elements
// right after, so scrolling only happens when the client actually scrolls.
function setAppHtml(app, html){
  const screenScroll = app.querySelector('.screen.active')?.scrollTop || 0;
  const sheetScroll = app.querySelector('.sheet-body')?.scrollTop || 0;
  // A bottom sheet (filter sheet, "Lihat Semua", etc.) plays a slide-up +
  // fade-in entrance animation when it first opens. Because render() always
  // rebuilds the whole #app from scratch, the sheet's DOM nodes get
  // recreated on every single tap too — which would replay that same
  // entrance animation each time, making a simple filter pick look like the
  // whole screen "refreshing"/jumping. Remember whether a sheet was already
  // open before this rebuild so we can skip the animation on the new nodes.
  const sheetWasOpen = !!app.querySelector('.sheet-panel');
  app.innerHTML = html;
  if(screenScroll){
    const el = app.querySelector('.screen.active');
    if(el) el.scrollTop = screenScroll;
  }
  if(sheetScroll){
    const el = app.querySelector('.sheet-body');
    if(el) el.scrollTop = sheetScroll;
  }
  if(sheetWasOpen){
    const panel = app.querySelector('.sheet-panel');
    const backdrop = app.querySelector('.sheet-backdrop');
    if(panel) panel.style.animation = 'none';
    if(backdrop) backdrop.style.animation = 'none';
  }
}

function render(){
  const app = document.getElementById('app');

  // The full-text reader works both signed-out (from the consent screen) and
  // signed-in (from Akun), so it takes over before anything else.
  if(state.legalDoc){
    setAppHtml(app, renderLegalDoc());
    return;
  }

  if(!state.token || !state.user){
    // First visit (or after the documents' version changed): consent screen
    // comes before Masuk/Daftar.
    if(!hasLegalConsent()){
      setAppHtml(app, renderConsentGate());
      return;
    }
    setAppHtml(app, state.authScreen === 'login' ? renderLogin() : renderRegister());
    return;
  }

  // The pengacara dashboard takes over the whole screen except when the
  // lawyer has drilled into the profile-completion form — that form needs
  // its own back button rather than the dashboard's fixed layout.
  if(state.chat){
    // Jangan bangun ulang layar chat bila sudah tampil (agar ketikan & scroll tidak hilang).
    if(document.getElementById('chat-root')) updateChatDom(); else setAppHtml(app, renderChat());
    return;
  }
  if(state.checkout){ setAppHtml(app, renderCheckout()); return; }

  if(state.mode === 'pengacara' && state.screen !== 'lawyer-profile-form'){
    setAppHtml(app, renderLawyerDashboard() + renderBottomNav());
    return;
  }

  let html = '';
  if(state.screen === 'home') html = renderHome();
  else if(state.screen === 'detail') html = renderDetail();
  else if(state.screen === 'booking') html = renderBooking();
  else if(state.screen === 'confirm') html = renderConfirm();
  else if(state.screen === 'konsultasi') html = renderKonsultasi();
  else if(state.screen === 'cakrawala') html = renderCakrawala();
  else if(state.screen === 'profil') html = renderProfil();
  else if(state.screen === 'lawyer-profile-form') html = renderLawyerProfileForm();
  else if(state.screen === 'layanan-detail') html = renderLayananDetail();
  else if(state.screen === 'cari-lawyer-hasil') html = renderSearchResultsScreen('lawyer');
  else if(state.screen === 'cari-notaris-hasil') html = renderSearchResultsScreen('notaris');
  else if(state.screen === 'cari-konsultan-hasil') html = renderSearchResultsScreen('konsultan');
  else if(state.screen === 'cari-hangout-hasil') html = renderSearchResultsScreen('hangout');
  else html = renderHome();

  html += renderBottomNav();
  if(state.showAllServices) html += renderAllServicesSheet();
  // These two overlay whichever screen is behind them — normally 'home',
  // but also 'cari-lawyer-hasil'/'cari-notaris-hasil' when the client taps
  // "Ubah" on an already-submitted search — rather than replacing it, same
  // mechanism as the sheet above, so the client sees the filter as a
  // bottom sheet, not a full page nav.
  if(state.showLawyerFilterSheet) html += renderCariLawyerFilter();
  if(state.showNotarisFilterSheet) html += renderCariNotarisFilter();
  if(state.showKonsultanFilterSheet) html += renderCariKonsultanFilter();
  if(state.showHangoutFilterSheet) html += renderCariHangoutFilter();
  setAppHtml(app, html);
  setupHomeScroll();
}

async function loadLawyers(){
  state.lawyersLoading = true;
  state.lawyersError = null;
  render();
  try{
    const params = new URLSearchParams();
    const sortMap = { rating:'rating', price:'price', exp:'experience' };
    params.set('sortBy', sortMap[state.sortBy] || 'rating');
    params.set('pageSize', '50');

    const f = state.activeSearchFilters;
    if(f){
      // Advanced filters from "Cari Lawyer/Advokat" take priority over the
      // plain category chips — setCategory()/setSort() clear f when the
      // client goes back to simple chip browsing.
      if(f.areaPraktik.length) params.set('specialization', f.areaPraktik.join(','));
      // "Tingkat Perkara" no longer exists on the "Cari Lawyer/Advokat"
      // filter (removed per client request), so caseLevel is never sent
      // for a lawyer search. "Jenis Layanan" only still exists on the
      // "Cari Notaris/PPAT" filter, so it's guarded here too — a plain
      // lawyer activeSearchFilters object no longer has this field at all.
      if(f.jenisLayanan && f.jenisLayanan.length) params.set('serviceType', f.jenisLayanan.join(','));
      if(f.gender && f.gender !== 'semua') params.set('gender', f.gender);
      if(f.pengalamanMin) params.set('minExperience', f.pengalamanMin);
      if(f.pengalamanMax) params.set('maxExperience', f.pengalamanMax);
      // "Hang Out" prices an in-person meet-up (the video rate stands in for it),
      // so its fee range is applied after the fetch below — the backend's
      // minFee/maxFee compares against the CHAT rate, which would be wrong here.
      if(f.kind !== 'hangout'){
        if(f.biayaMin) params.set('minFee', f.biayaMin);
        if(f.biayaMax) params.set('maxFee', f.biayaMax);
      }
      // Wilayah Kerja by region: a specific city/kabupaten, or — when only a
      // province is picked — every city/kabupaten inside that province.
      if(f.kota) params.set('city', f.kota);
      else if(f.provinsi && WILAYAH_INDONESIA[f.provinsi]) params.set('city', WILAYAH_INDONESIA[f.provinsi].join(','));
      if(f.wilayah === 'terdekat' && f.userLat !== null){
        params.set('lat', f.userLat);
        params.set('lng', f.userLng);
      }
    }else{
      const category = CATEGORIES.find(c => c.label === state.activeCategory);
      if(category && category.specialization) params.set('specialization', category.specialization);
    }

    const result = await api('/lawyers?' + params.toString(), { auth:false });
    state.lawyers = result.items;
    if(f && f.kind === 'hangout'){
      const min = Number(f.biayaMin) || 0, max = Number(f.biayaMax) || Infinity, rad = Number(f.radiusKm) || Infinity;
      state.lawyers = state.lawyers.filter(l =>
        l.distanceKm != null && l.distanceKm <= rad && l.hourlyRateVideo >= min && l.hourlyRateVideo <= max);
    }
  }catch(e){
    state.lawyersError = e.message;
    state.lawyers = [];
  }finally{
    state.lawyersLoading = false;
    render();
  }
}

// A sub-service itself isn't a bookable thing in the backend (there's no
// per-document/per-service order flow) — picking one either jumps straight
// to the real, working lawyer list filtered by the closest matching
// specialization, or, when the category has none, gives an honest "segera"
// notice naming the exact thing they tapped rather than pretending to book it.
function selectLayananItem(serviceKey, item){
  const s = SERVICE_CATALOG.find(x => x.key === serviceKey);
  if(s && s.key === 'pendampingan'){
    // Tag the request so it survives into the booking screen (shown to the
    // lawyer as context) and picks the "Tatap Muka" method automatically.
    state.bookingServiceNote = 'Pendampingan · ' + item;
    state.activeCategory = PENDAMPINGAN_CATEGORY_MAP[item] || 'Semua';
    state.screen = 'home';
    loadLawyers().then(scrollToAllLawyers);
  }else if(s && s.mapCategory){
    state.screen = 'home';
    state.activeCategory = s.mapCategory;
    state.bookingServiceNote = null;
    // loadLawyers() re-renders #homeScreen once the list finishes loading —
    // scrolling before that would just get wiped out by that later render,
    // so wait for its promise instead of a fixed timeout.
    loadLawyers().then(scrollToAllLawyers);
  }else{
    comingSoon(item);
  }
}

// Dedicated results page for "Cari Lawyer/Advokat" / "Cari Notaris/PPAT" —
// shown once the client taps "Lihat Hasil" on the filter sheet, instead of
// dumping the results back into the home screen's own separate lawyer list
// (which has its own promo banner, category grid, etc. and would bury the
// results the client specifically asked for). Reuses the exact same
// state.lawyers / state.activeSearchFilters / sort machinery as the home
// screen's list — this is just a focused, single-purpose view of it.
function renderSearchResultsScreen(kind){
  let filtered = state.lawyers;
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    filtered = filtered.filter(l => l.name.toLowerCase().includes(q) || l.specializations.join(' ').toLowerCase().includes(q));
  }

  let body;
  if(state.lawyersLoading){
    body = `<div class="loading-state">Memuat daftar pengacara…</div>`;
  }else if(state.lawyersError){
    body = `<div class="error-box">${state.lawyersError}</div>`;
  }else if(filtered.length === 0){
    body = renderEmptySearch();
  }else{
    body = filtered.map(l => renderLawyerCard(l, kind === 'hangout' ? 'hangout' : null)).join('');
  }

  const title = kind === 'notaris' ? 'Cari Notaris/PPAT' : kind === 'konsultan' ? 'Cari Konsultan' : kind === 'hangout' ? 'Hang Out' : 'Cari Lawyer/Advokat';
  const hasFilters = state.activeSearchFilters && state.activeSearchFilters.kind === kind;

  return `
  <div class="screen active" style="display:flex;">
    <div class="detail-header">
      <div class="nav-strip">
        <button class="back-link" onclick="goHome()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Kembali
        </button>
      </div>
      <div class="detail-hero">
        <div class="profile-name">${title}</div>
        <div class="profile-spec" style="color:#C8D1E3;">${state.lawyersLoading ? 'Memuat…' : filtered.length + ' ditemukan'}</div>
      </div>
    </div>
    <div class="content">

      ${hasFilters ? `
      <div class="active-filter-bar">
        <span>🔎 Filter aktif (${countActiveFilters(state.activeSearchFilters)} kriteria)</span>
        <span class="active-filter-actions">
          <button type="button" class="btn-link" onclick="openActiveSearchFilterEditor()">Ubah</button>
          <button type="button" class="btn-link" onclick="clearLawyerSearchFilters()">Hapus</button>
        </span>
      </div>` : `
      <button type="button" class="btn btn-outline" style="width:100%;margin-bottom:14px;" onclick="openActiveSearchFilterEditor()">Atur Filter</button>`}

      <div class="sort-row">
        <div class="result-count">${state.lawyersLoading ? '…' : filtered.length + ' pengacara ditemukan'}</div>
        <select onchange="setSort(this.value)">
          <option value="rating" ${state.sortBy==='rating'?'selected':''}>Rating tertinggi</option>
          <option value="price" ${state.sortBy==='price'?'selected':''}>Harga terendah</option>
          <option value="exp" ${state.sortBy==='exp'?'selected':''}>Pengalaman</option>
        </select>
      </div>

      ${body}
    </div>
  </div>`;
}

// Works for either shape: the draft filter (Sets, while editing on the
// filter screen) or the submitted filter (plain arrays, once applied).
function countActiveFilters(f){
  if(!f) return 0;
  const sizeOf = (x) => (x.size !== undefined ? x.size : x.length);
  let n = 0;
  if(f.areaPraktik && sizeOf(f.areaPraktik)) n++;
  if(f.jenisLayanan && sizeOf(f.jenisLayanan)) n++; // only present for "Cari Notaris/PPAT" now
  if(f.wilayah === 'terdekat') n++;
  if(f.provinsi || f.kota) n++;
  if(f.radiusKm) n++; // only present for "Hang Out"
  if(f.pengalamanMin || f.pengalamanMax) n++;
  if(f.gender !== 'semua') n++;
  if(f.biayaMin || f.biayaMax) n++;
  if(f.biayaDokumenMin || f.biayaDokumenMax) n++; // only present for "Cari Notaris/PPAT" (informational tier)
  return n;
}

  // home screen, which has its own separate (unfiltered) lawyer list.
  state.screen = 'cari-konsultan-hasil';
  loadLawyers();
}

/* ============================================================
   "Hang Out" — find lawyers near the client's location and invite one to
   meet in person for a legal discussion. Reuses the same search endpoint
   (lat/lng distance sort) and the existing "Tatap Muka" booking method.
   There's no separate in-person rate column yet, so "Biaya Investasi" here
   is the lawyer's video-call rate per 60-minute meeting (same stand-in the
   backend already uses to price Tatap Muka bookings).
============================================================ */
const HANGOUT_RADIUS_OPTIONS = [
  { label: '1 km', value: '1' }, { label: '3 km', value: '3' }, { label: '5 km', value: '5' },
  { label: '10 km', value: '10' }, { label: '25 km', value: '25' }, { label: 'Semua jarak', value: '' },
];
const HANGOUT_FEE_PRESETS = [
  { label: 'Di bawah Rp300rb', min: '', max: '299999' },
  { label: 'Rp300rb–750rb', min: '300000', max: '750000' },
  { label: 'Di atas Rp750rb', min: '750001', max: '' },
];
function defaultHangoutSearchFilter(){
  return {
    userLat: null, userLng: null,
    locating: false, locationError: null,
    radiusKm: '',
    gender: 'semua',
    biayaMin: '', biayaMax: '',
  };
}
function openHangoutSearchFilter(){
  const prev = state.activeSearchFilters && state.activeSearchFilters.kind === 'hangout' ? state.activeSearchFilters : null;
  state.hangoutSearchFilter = prev ? {
    userLat: prev.userLat, userLng: prev.userLng,
    locating: false, locationError: null,
    radiusKm: prev.radiusKm ?? '',
    gender: prev.gender ?? 'semua',
    biayaMin: prev.biayaMin ?? '', biayaMax: prev.biayaMax ?? '',
  } : defaultHangoutSearchFilter();
  state.showHangoutFilterSheet = true;
  if(state.hangoutSearchFilter.userLat === null) requestHangoutUserLocation();
  else render();
}
function closeHangoutSearchFilter(){
  state.hangoutSearchFilter = null;
  state.showHangoutFilterSheet = false;
  render();
}
function requestHangoutUserLocation(){
  const f = state.hangoutSearchFilter;
  if(!navigator.geolocation){
    f.locationError = 'Perangkat/browser ini tidak mendukung deteksi lokasi.';
    render();
    return;
  }
  f.locating = true;
  f.locationError = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      if(state.hangoutSearchFilter !== f) return; // sheet closed while waiting
      f.userLat = pos.coords.latitude;
      f.userLng = pos.coords.longitude;
      f.locating = false;
      render();
    },
    (err) => {
      if(state.hangoutSearchFilter !== f) return;
      f.locating = false;
      f.locationError = err.code === 1
        ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk browser ini lalu coba lagi.'
        : 'Gagal mendapatkan lokasi. Coba lagi.';
      render();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
function setHangoutRadius(v){ state.hangoutSearchFilter.radiusKm = v; render(); }
function setHangoutGender(g){ state.hangoutSearchFilter.gender = g; render(); }
function onHangoutFilterNumberInput(field, v){ state.hangoutSearchFilter[field] = v; }
function submitHangoutSearchFilter(){
  const f = state.hangoutSearchFilter;
  if(f.userLat === null){
    requestHangoutUserLocation();
    return;
  }
  state.activeSearchFilters = {
    kind: 'hangout',
    areaPraktik: [],
    wilayah: 'terdekat',
    userLat: f.userLat, userLng: f.userLng,
    radiusKm: f.radiusKm,
    gender: f.gender,
    biayaMin: f.biayaMin, biayaMax: f.biayaMax,
  };
  state.hangoutSearchFilter = null;
  state.showHangoutFilterSheet = false;
  state.screen = 'cari-hangout-hasil';
  loadLawyers();
}

// Area Praktik is a two-level drill-down: clicking a category button
// expands it into its leaf sub-items, and only the LEAF is an actual
// selectable/searchable value (matching the "Parent – Leaf" specialization
// names seeded via cari-lawyer-area-praktik-migration.sql). The category
// button itself never gets selected — it's purely a folder to open.
// Quick preset buckets for the two range filters (Pengalaman, Biaya) — shown
// as tappable chips above the manual Min/Maks fields, mirroring how
// marketplace apps like Shopee offer "Di bawah X / X–Y / Di atas Y" presets
// alongside a custom range.
const PENGALAMAN_PRESETS = [
  { label: 'Di bawah 3 th', min: '', max: '2' },
  { label: '3–7 tahun', min: '3', max: '7' },
  { label: 'Di atas 7 th', min: '8', max: '' },
];
const LAWYER_FEE_PRESETS = [
  { label: 'Di bawah Rp100rb', min: '', max: '99999' },
  { label: 'Rp100rb–300rb', min: '100000', max: '300000' },
  { label: 'Di atas Rp300rb', min: '300001', max: '' },
];
function isPresetActive(f, minField, maxField, min, max){
  return String(f[minField] || '') === String(min) && String(f[maxField] || '') === String(max);
}
// Tapping an already-active preset clears the range (acts as a toggle);
// tapping a different one replaces min/max and updates the manual inputs too.
function searchFilterByKind(kind){
  return kind === 'notaris' ? state.notarisSearchFilter : kind === 'konsultan' ? state.konsultanSearchFilter : kind === 'hangout' ? state.hangoutSearchFilter : state.lawyerSearchFilter;
}
// Wilayah Kerja region pickers (shared by all three filters): Provinsi, then
// Kota/Kabupaten inside it. Empty value = "Semua Area" / "Semua Kota".
function setWilayahProvinsi(kind, v){
  const f = searchFilterByKind(kind);
  f.provinsi = v; f.kota = '';
  render();
}
function setWilayahKota(kind, v){
  searchFilterByKind(kind).kota = v;
  render();
}
function renderWilayahSelects(kind){
  const f = searchFilterByKind(kind);
  const cities = f.provinsi ? (WILAYAH_INDONESIA[f.provinsi] || []) : [];
  return `
  <div class="filter-range-row" style="flex-direction:column;align-items:stretch;gap:8px;">
    <select onchange="setWilayahProvinsi('${kind}', this.value)">
      <option value="">Semua Area (semua provinsi)</option>
      ${Object.keys(WILAYAH_INDONESIA).map(p => `<option value="${p}" ${f.provinsi===p?'selected':''}>${p}</option>`).join('')}
    </select>
    ${f.provinsi ? `
    <select onchange="setWilayahKota('${kind}', this.value)">
      <option value="">Semua Kota/Kabupaten di ${f.provinsi}</option>
      ${cities.map(c => `<option value="${c}" ${f.kota===c?'selected':''}>${c}</option>`).join('')}
    </select>` : ''}
  </div>`;
}

function setPresetRange(kind, minField, maxField, min, max){
  const f = searchFilterByKind(kind);
  if(isPresetActive(f, minField, maxField, min, max)){
    f[minField] = ''; f[maxField] = '';
  }else{
    f[minField] = min; f[maxField] = max;
  }
  render();
}
function renderPresetChipRow(kind, minField, maxField, presets){
  const f = searchFilterByKind(kind);
  return `
  <div class="filter-chip-row" style="margin-bottom:10px;">
    ${presets.map(p => `
      <button type="button" class="filter-chip ${isPresetActive(f, minField, maxField, p.min, p.max) ? 'selected' : ''}" onclick="setPresetRange('${kind}','${minField}','${maxField}','${p.min}','${p.max}')">${p.label}</button>`).join('')}
  </div>`;
}

// How many Area Praktik chips show before the "+N lainnya" chip that
// reveals the rest — matches the "Awan chip (wrap)" mockup the client
// picked (a handful of pills wrapping onto a few rows, plus a trailing
// "+N lainnya" pill rather than a hard cutoff or a full 28-item wall).
const AREA_PRAKTIK_VISIBLE_COUNT = 9;

// Area Praktik as wrapping rounded pill chips (marketplace "cloud of
// chips" style, per the client's chosen mockup) — the active category
// (the one whose sub-bidang panel is currently open) renders as a filled
// navy pill with a small dot, everything else stays outlined. Tapping a
// category doesn't expand inline: it sets the "active category", and its
// sub-bidang appear in a separate panel (renderAreaSubPanel) positioned
// right above "Tingkat Perkara".
function renderAreaPraktikBody(){
  const f = state.lawyerSearchFilter;
  const showAll = f.areaShowAll;
  const visible = showAll ? AREA_PRAKTIK_SEARCH_CATALOG : AREA_PRAKTIK_SEARCH_CATALOG.slice(0, AREA_PRAKTIK_VISIBLE_COUNT);
  const remaining = AREA_PRAKTIK_SEARCH_CATALOG.length - AREA_PRAKTIK_VISIBLE_COUNT;
  return `
  <div class="area-chip-wrap">
    ${visible.map(a => {
      const selectedInCat = a.subs.filter(s => f.areaPraktik.has(a.name + ' – ' + s)).length;
      const isActive = f.areaActiveCat === a.name;
      return `
      <button type="button" class="area-chip ${isActive ? 'active' : ''}" onclick="setAreaActiveCat('${a.name.replace(/'/g, "\\'")}')">
        ${isActive ? '<span class="chip-dot"></span>' : ''}${a.name}${selectedInCat ? ` (${selectedInCat})` : ''}
      </button>`;
    }).join('')}
    ${(!showAll && remaining > 0) ? `<button type="button" class="area-chip-more" onclick="toggleAreaShowAll()">+${remaining} lainnya</button>` : ''}
  </div>`;
}

// The tapped category's sub-bidang, rendered as its OWN filter section (not
// nested inside the icon grid) so it can sit between "Area Praktik" and
// "Tingkat Perkara" as the client asked. Returns '' when nothing is active,
// or when the active lawyer category has no sub-items to show.
function renderAreaSubPanel(kind){
  const f = kind === 'notaris' ? state.notarisSearchFilter : state.lawyerSearchFilter;
  const active = f.areaActiveCat;
  if(!active) return '';
  const catalog = kind === 'notaris' ? NOTARIS_AREA_PRAKTIK_CATALOG : AREA_PRAKTIK_SEARCH_CATALOG;
  const keyField = kind === 'notaris' ? 'label' : 'name';
  const cat = catalog.find(a => a[keyField] === active);
  if(!cat || !cat.subs.length) return '';
  const toggleFn = kind === 'notaris' ? 'toggleNotarisAreaPraktik' : 'toggleAreaPraktik';
  return `
  <div class="filter-section area-sub-panel">
    <div class="filter-flat-label">Sub-bidang: ${cat[keyField]}</div>
    <div class="filter-chip-row">
      ${cat.subs.map(s => {
        const leaf = cat[keyField] + ' – ' + s;
        return `<button type="button" class="filter-chip ${f.areaPraktik.has(leaf) ? 'selected' : ''}" onclick="${toggleFn}('${leaf.replace(/'/g, "\\'")}')">${s}</button>`;
      }).join('')}
    </div>
  </div>`;
}

// Clears one min/max pair on the draft filter (used by the "Filter dipilih"
// chip row's ✕ button on a range like Pengalaman/Biaya) and re-renders, so
// both the chip, the preset row and the manual inputs all update immediately.
function clearRangeFilter(kind, minField, maxField){
  const f = searchFilterByKind(kind);
  f[minField] = '';
  f[maxField] = '';
  render();
}

// Resets every SELECTION back to defaults but keeps which Area Praktik
// category is active and which document group is expanded, so the screen
// doesn't visually collapse out from under the client when they hit "Hapus".
function clearAllDraftFilters(kind){
  if(kind === 'notaris'){
    const { areaActiveCat, areaShowAll, dokumenOpen } = state.notarisSearchFilter;
    state.notarisSearchFilter = defaultNotarisSearchFilter();
    state.notarisSearchFilter.areaActiveCat = areaActiveCat;
    state.notarisSearchFilter.areaShowAll = areaShowAll;
    state.notarisSearchFilter.dokumenOpen = dokumenOpen;
  }else if(kind === 'hangout'){
    const prev = state.hangoutSearchFilter;
    state.hangoutSearchFilter = defaultHangoutSearchFilter();
    // keep the detected location — it's not a "selection" to wipe
    state.hangoutSearchFilter.userLat = prev.userLat;
    state.hangoutSearchFilter.userLng = prev.userLng;
  }else if(kind === 'konsultan'){
    const { dokumenOpen } = state.konsultanSearchFilter;
    state.konsultanSearchFilter = defaultKonsultanSearchFilter();
    state.konsultanSearchFilter.dokumenOpen = dokumenOpen;
  }else{
    const { areaActiveCat, areaShowAll } = state.lawyerSearchFilter;
    state.lawyerSearchFilter = defaultLawyerSearchFilter();
    state.lawyerSearchFilter.areaActiveCat = areaActiveCat;
    state.lawyerSearchFilter.areaShowAll = areaShowAll;
  }
  render();
}

// Builds the live "Filter dipilih" summary shown at the top of the filter
// screen — every currently-selected value across all sections, as a
// removable chip, so the client can see (and undo) picks without having to
// re-open each accordion section to find them again.
function renderSelectedFilterChips(kind){
  const f = searchFilterByKind(kind);
  const esc = (s) => s.replace(/'/g, "\\'");
  const chips = [];

  // Area Praktik — leaf values are stored as "Kategori – Sub-bidang" for
  // lawyer/notaris; show just the sub-bidang part so chips stay short and
  // readable. Konsultan categories are all leaf-only to begin with, so
  // there's no " – " to strip there.
  const areaFn = kind === 'notaris' ? 'toggleNotarisAreaPraktik' : kind === 'konsultan' ? 'toggleKonsultanAreaPraktik' : 'toggleAreaPraktik';
  Array.from(f.areaPraktik).forEach(v => {
    const idx = v.lastIndexOf(' – ');
    chips.push({ text: idx >= 0 ? v.slice(idx + 3) : v, onclick: `${areaFn}('${esc(v)}')` });
  });

  // "Jenis Layanan" exists on "Cari Notaris/PPAT" and "Cari Konsultan" —
  // removed from "Cari Lawyer/Advokat" per the client's request.
  if(kind === 'notaris' || kind === 'konsultan'){
    const jenisFn = kind === 'notaris' ? 'toggleNotarisJenisLayanan' : 'toggleKonsultanJenisLayanan';
    Array.from(f.jenisLayanan).forEach(v => {
      chips.push({ text: v, onclick: `${jenisFn}('${esc(v)}')` });
    });
  }

  if(f.wilayah === 'terdekat'){
    const fn = kind === 'notaris' ? 'setNotarisWilayah' : kind === 'konsultan' ? 'setKonsultanWilayah' : 'setWilayah';
    const label = kind === 'notaris' ? 'Notaris Terdekat' : kind === 'konsultan' ? 'Konsultan Terdekat' : 'Lawyer Terdekat';
    chips.push({ text: label, onclick: `${fn}('semua')` });
  }

  if(f.provinsi || f.kota){
    chips.push({
      text: f.kota ? f.kota + ', ' + f.provinsi : f.provinsi,
      onclick: `setWilayahProvinsi('${kind}','')`,
    });
  }

  if(f.pengalamanMin || f.pengalamanMax){
    chips.push({
      text: `Pengalaman ${f.pengalamanMin || '0'}–${f.pengalamanMax || '∞'} th`,
      onclick: `clearRangeFilter('${kind}','pengalamanMin','pengalamanMax')`,
    });
  }

  if(f.gender !== 'semua'){
    const fn = kind === 'notaris' ? 'setNotarisGender' : kind === 'konsultan' ? 'setKonsultanGender' : 'setGender';
    chips.push({ text: f.gender === 'male' ? 'Laki-laki' : 'Perempuan', onclick: `${fn}('semua')` });
  }

  if(kind === 'notaris'){
    if(f.biayaDokumenMin || f.biayaDokumenMax){
      chips.push({
        text: `Dokumen Rp${f.biayaDokumenMin || '0'}–Rp${f.biayaDokumenMax || '∞'}`,
        onclick: `clearRangeFilter('notaris','biayaDokumenMin','biayaDokumenMax')`,
      });
    }
  }else if(f.biayaMin || f.biayaMax){
    chips.push({
      text: `Biaya Rp${f.biayaMin || '0'}–Rp${f.biayaMax || '∞'}`,
      onclick: `clearRangeFilter('${kind}','biayaMin','biayaMax')`,
    });
  }

  if(!chips.length) return '';

  return `
  <div class="selected-filter-summary">
    <div class="sfs-head">
      <span>Filter dipilih (${chips.length})</span>
      <button type="button" class="btn-link" onclick="clearAllDraftFilters('${kind}')">Hapus semua</button>
    </div>
    <div class="sfs-chips">
      ${chips.map(c => `<span class="sfs-chip">${c.text}<button type="button" onclick="${c.onclick}">✕</button></span>`).join('')}
    </div>
  </div>`;
}

// Same wrapping pill-chip treatment as the lawyer Area Praktik chips — with

// Wrapping pill-chip treatment, same look as the Area Praktik chips —

// AREA_PRAKTIK_VISIBLE_COUNT === 9, no "+N lainnya" chip ever appears.
function renderKonsultanAreaPraktikBody(){
  const f = state.konsultanSearchFilter;
  const showAll = f.areaShowAll;
  const visible = showAll ? KONSULTAN_AREA_PRAKTIK_CATALOG : KONSULTAN_AREA_PRAKTIK_CATALOG.slice(0, AREA_PRAKTIK_VISIBLE_COUNT);
  const remaining = KONSULTAN_AREA_PRAKTIK_CATALOG.length - AREA_PRAKTIK_VISIBLE_COUNT;
  return `
  <div class="area-chip-wrap">
    ${visible.map(a => {
      const isActive = f.areaPraktik.has(a.label);
      return `
      <button type="button" class="area-chip ${isActive ? 'active' : ''}" onclick="toggleKonsultanAreaPraktik('${a.label.replace(/'/g, "\\'")}')">
        ${isActive ? '<span class="chip-dot"></span>' : ''}${a.label}
      </button>`;
    }).join('')}
    ${(!showAll && remaining > 0) ? `<button type="button" class="area-chip-more" onclick="toggleKonsultanAreaShowAll()">+${remaining} lainnya</button>` : ''}
  </div>`;
}

function renderPromoSlide(){

      ${BANNER_SLIDES.map((_, i) => `<span class="${i === state.bannerIndex ? 'on' : ''}" onclick="setBannerSlide(${i})"></span>`).join('')}
    </div>`;
}

function paintPromoSlide(){
  const el = document.getElementById('promoContent');
  if(el) el.innerHTML = renderPromoSlide();
}

function setBannerSlide(i){
  state.bannerIndex = i;
  paintPromoSlide();
}

// Runs once (started at boot, see Boot section below) rather than being
// re-created on every render() — it just checks each tick whether the home
// banner is actually on screen before touching the DOM, and only repaints
// the banner itself so scroll position and the rest of the screen are
// undisturbed.
let bannerAutoplayStarted = false;
function startBannerAutoplay(){
  if(bannerAutoplayStarted) return;
  bannerAutoplayStarted = true;
  setInterval(() => {
    if(!state.token || state.screen !== 'home' || state.mode !== 'klien') return;
    state.bannerIndex = (state.bannerIndex + 1) % BANNER_SLIDES.length;
    paintPromoSlide();
  }, 4000);
}

============================================================ */
// `ctx` sets what the booking will be tagged as: 'hangout' → an in-person
// "Hang Out" meet-up (preselects Tatap Muka), null → a plain consultation.
// Left undefined (e.g. the booking screen's own back link), it keeps whatever
// was set when the client first opened this lawyer.
async function openDetail(id, ctx){
  if(ctx === 'hangout') state.bookingServiceNote = 'Hang Out · Diskusi hukum tatap muka';
  else if(ctx === null) state.bookingServiceNote = null;
  state.selectedLawyerId = id;
  state.screen = 'detail';
  state.detailLoading = true;
  state.detailError = null;
  state.selectedLawyerDetail = null;
  render();
  try{
    state.selectedLawyerDetail = await api('/lawyers/' + id, { auth:false });
  }catch(e){
    state.detailError = e.message;
  }finally{
    state.detailLoading = false;
    render();
  }
}

  if(state.detailLoading){
    return `<div class="screen active" style="display:flex;"><div class="loading-state">Memuat profil…</div></div>`;

    return `<div class="screen active" style="display:flex;flex-direction:column;">
      <div class="content"><div class="error-box">${state.detailError || 'Data tidak ditemukan.'}</div>
      <button class="btn btn-outline" style="width:100%;" onclick="goHome()">Kembali</button></div>

      <div class="info-grid">

  state.selectedMethod = state.bookingServiceNote ? 'tatap-muka' : null;

  state.screen = 'booking';

  const l = state.selectedLawyerDetail;
  const slots = ['09:00','10:30','13:00','14:30','16:00','19:00'];
  const rateFor = m => m==='video' ? l.hourlyRateVideo : m==='tatap-muka' ? (l.hourlyRateInPerson || l.hourlyRateVideo) : l.hourlyRateChat;
  const total = state.selectedMethod ? rateFor(state.selectedMethod) : null; // durationMinutes fixed at 60 → total == hourly rate

  return `
  <div class="screen active" style="display:flex;">
    <div class="detail-header">
      <div class="nav-strip">
        <button class="back-link" onclick="openDetail('${l.id}')">

        <div class="hero-sub">dengan ${l.name}</div>

    </div>
    <div class="content" style="padding-top:18px;">
      ${state.bookingError ? `<div class="error-box">${state.bookingError}</div>` : ''}

        <div class="error-box" style="background:var(--navy-pale);color:var(--navy);margin-bottom:14px;">
          Mengajukan untuk: <b>${state.bookingServiceNote}</b>
        </div>` : ''}
      <div class="booking-block">
        <span class="lbl">Pilih metode konsultasi (durasi 60 menit)</span>
        <div class="method-row" style="${state.bookingServiceNote ? 'flex-wrap:wrap;' : ''}">
          ${state.bookingServiceNote ? `
          <div class="method-card ${state.selectedMethod==='tatap-muka'?'selected':''}" onclick="selectMethod('tatap-muka')">
            <div class="m-title">Tatap Muka</div>
            <div class="m-price">${formatRupiah(rateFor('tatap-muka'))}</div>
          </div>` : ''}
          <div class="method-card ${state.selectedMethod==='chat'?'selected':''}" onclick="selectMethod('chat')">
            <div class="m-title">Chat</div>
            <div class="m-price">${formatRupiah(l.hourlyRateChat)}</div>
          </div>
          <div class="method-card ${state.selectedMethod==='video'?'selected':''}" onclick="selectMethod('video')">
            <div class="m-title">Video Call</div>
            <div class="m-price">${formatRupiah(l.hourlyRateVideo)}</div>
          </div>
        </div>
      </div>

      <div class="booking-block">
        <span class="lbl">Pilih jadwal — Hari ini</span>
        <div class="slot-grid">
          ${slots.map(s=>`<div class="slot ${state.selectedSlot===s?'selected':''}" onclick="selectSlot('${s}')">${s}</div>`).join('')}

      <div class="booking-block">
        <span class="lbl">Ringkasan</span>
        <div class="summary-box">
          <div class="summary-row"><span>Metode</span><span>${state.selectedMethod ? methodLabelTitle(state.selectedMethod) : '—'}</span></div>
          <div class="summary-row"><span>Jadwal</span><span>${state.selectedSlot || '—'}</span></div>
          <div class="summary-row total"><span>Estimasi biaya</span><span>${total !== null ? formatRupiah(total) : '—'}</span></div>
        </div>
      </div>

function slotToDate(slot){
  const [h, m] = slot.split(':').map(Number);

  d.setHours(h, m, 0, 0);

}

// Sends the booking as a REQUEST only — no payment yet. The lawyer has to

/* ============================================================
   Ruang chat (booking dengan metode chat)
============================================================ */
// true = tombol Mulai Chat aktif kapan saja setelah bayar (masa development).
// Ubah ke false sebelum rilis agar mengikuti jadwal (buka 5 menit sebelum jadwal).
// Backend punya aturan sendiri: jendela jadwal diabaikan selama
// MIDTRANS_IS_PRODUCTION bukan true.
const CHAT_IGNORE_SCHEDULE = true;

function chatButtonFor(b){
  if(b.method !== 'chat') return '';
  if(b.status === 'completed'){
    return `<div class="bi-actions"><button class="btn btn-outline" style="flex:1;" onclick="openChat('${b.id}')">Lihat Riwayat Chat</button></div>`;
  }
  if(b.status !== 'confirmed' && b.status !== 'ongoing') return '';
  const opensAt = new Date(new Date(b.scheduledAt).getTime() - 5*60*1000);
  const closesAt = new Date(new Date(b.scheduledAt).getTime() + (b.durationMinutes||30)*60*1000);
  const now = Date.now();
  if(!CHAT_IGNORE_SCHEDULE && now < opensAt.getTime()){
    return `<div class="bi-actions"><button class="btn btn-outline" style="flex:1;" disabled>Chat dibuka ${formatDateTime(opensAt)}</button></div>`;
  }
  if(!CHAT_IGNORE_SCHEDULE && now > closesAt.getTime() && b.status === 'confirmed'){
    return '';
  }
  return `<div class="bi-actions"><button class="btn btn-gold" style="flex:1;" onclick="openChat('${b.id}')">${b.status === 'ongoing' ? 'Lanjutkan Chat' : 'Mulai Chat'}</button></div>`;
}

async function openChat(bookingId){
  state.chat = { bookingId, booking: null, messages: [], draft: '', sending: false, error: null, loading: true, poll: null, tick: null };
  render(); resetScreenScroll();
  await chatFetch(true);
  const c = state.chat;
  if(!c) return;
  c.poll = setInterval(() => chatFetch(false), 3000);
  c.tick = setInterval(updateChatDom, 1000);
}
function closeChat(){
  const c = state.chat;
  if(c){ clearInterval(c.poll); clearInterval(c.tick); }
  state.chat = null;
  render(); resetScreenScroll();
  loadMyBookings();
}
async function chatFetch(initial){
  const c = state.chat;
  if(!c) return;
  try{
    const last = c.messages.length ? c.messages[c.messages.length-1].createdAt : null;
    const url = '/bookings/' + c.bookingId + '/messages' + (!initial && last ? '?after=' + encodeURIComponent(last) : '');
    const res = await api(url);
    if(state.chat !== c) return;
    c.booking = res.booking;
    const known = new Set(c.messages.map(m => m.id));
    const fresh = (res.messages || []).filter(m => !known.has(m.id));
    // buang pesan sementara (optimistic) yang sudah digantikan pesan asli
    if(fresh.length) c.messages = c.messages.filter(m => !m.pending).concat(fresh);
    c.error = null;
  }catch(e){
    if(initial){ c.error = e.message; }
  }finally{
    if(state.chat === c){ c.loading = false; if(document.getElementById('chat-root')) updateChatDom(); else render(); }
  }
}
function chatInput(v){ if(state.chat) state.chat.draft = v; }
function chatKey(ev){
  if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); sendChat(); }
}
async function sendChat(){
  const c = state.chat;
  if(!c || c.sending) return;
  const ta = document.getElementById('chat-input');
  const body = ((ta && ta.value) || c.draft || '').trim();
  if(!body) return;
  c.sending = true; c.draft = ''; if(ta) ta.value = '';
  const temp = { id: 'tmp-' + Date.now(), senderId: state.user.id, body, createdAt: new Date().toISOString(), pending: true };
  c.messages.push(temp); c.error = null; updateChatDom(true);
  try{
    const m = await api('/bookings/' + c.bookingId + '/messages', { method:'POST', body:{ body } });
    c.messages = c.messages.filter(x => x.id !== temp.id);
    if(!c.messages.some(x => x.id === m.id)) c.messages.push(m);
    if(c.booking && c.booking.status === 'confirmed') c.booking.status = 'ongoing';
  }catch(e){
    c.messages = c.messages.filter(x => x.id !== temp.id);
    c.draft = body; if(ta) ta.value = body;
    c.error = e.message;
  }finally{
    c.sending = false; updateChatDom(true);
  }
}
async function endChatSessionNow(){
  const c = state.chat;
  if(!c || !confirm('Akhiri sesi chat ini? Setelah diakhiri, pesan tidak bisa dikirim lagi.')) return;
  try{
    await api('/bookings/' + c.bookingId + '/end', { method:'POST' });
    await chatFetch(false);
    c.booking = Object.assign({}, c.booking, { status:'completed', canSend:false });
    updateChatDom();
  }catch(e){ alert('Gagal mengakhiri sesi: ' + e.message); }
}
function chatClock(iso){
  const d = new Date(iso), p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + '.' + p(d.getMinutes());
}
function chatStatusLine(c){
  const b = c.booking;
  if(!b) return '';
  if(b.status === 'completed') return 'Sesi telah berakhir';
  if(b.devMode) return 'Mode uji · jadwal diabaikan';
  const now = Date.now(), o = new Date(b.opensAt).getTime(), e = new Date(b.closesAt).getTime();
  if(now < o){ return 'Dibuka ' + formatDateTime(b.opensAt); }
  const left = Math.max(0, e - now), p = n => String(n).padStart(2,'0');
  return 'Sisa waktu ' + p(Math.floor(left/60000)) + ':' + p(Math.floor(left%60000/1000));
}
function chatBubbles(c){
  const me = state.user.id;
  if(!c.messages.length){
    return `<div class="chat-empty">${c.loading ? 'Memuat…' : 'Belum ada pesan. Mulai percakapan dengan menulis pesan di bawah.'}</div>`;
  }
  return c.messages.map(m => `
    <div class="chat-row ${m.senderId === me ? 'me' : 'them'}">
      <div class="chat-bubble ${m.pending ? 'pending' : ''}">${escChat(m.body)}<span class="chat-time">${chatClock(m.createdAt)}</span></div>
    </div>`).join('');
}
function escChat(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function chatFooter(c){
  const b = c.booking;
  if(c.error && !b) return `<div class="chat-ended">${escChat(c.error)}</div>`;
  if(!b) return '';
  if(b.status === 'completed'){
    return `<div class="chat-ended">Sesi chat telah berakhir.${b.myRole === 'client' ? '<button class="btn btn-gold" style="width:100%;flex:none;margin-top:10px;" onclick="closeChat(); goToKonsultasi();">Kembali ke Aktivitas · Beri Ulasan</button>' : ''}</div>`;
  }
  if(!b.canSend){
    return `<div class="chat-ended">Chat belum dibuka. ${chatStatusLine(c)}</div>`;
  }
  return `
    ${c.error ? `<div class="pay-err" style="margin:0 0 6px;">${escChat(c.error)}</div>` : ''}
    <div class="chat-compose">
      <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Tulis pesan…" oninput="chatInput(this.value)" onkeydown="chatKey(event)">${escChat(c.draft).replace(/<br>/g,'\n')}</textarea>
      <button class="chat-send" onclick="sendChat()" aria-label="Kirim"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>`;
}
function renderChat(){
  const c = state.chat, b = c.booking;
  const name = b ? b.otherName : '…';
  return `
  <div class="screen active" id="chat-root" style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
    <div class="legal-head">
      <button class="legal-back" onclick="closeChat()" aria-label="Kembali"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="min-width:0;flex:1;">
        <div class="legal-title" id="chat-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escChat(name)}</div>
        <div class="chat-sub" id="chat-status">${chatStatusLine(c)}</div>
      </div>
      <button class="chat-end" id="chat-end" onclick="endChatSessionNow()" style="${b && b.myRole === 'lawyer' && b.status !== 'completed' ? '' : 'display:none;'}">Akhiri</button>
    </div>
    <div class="chat-notice">Bukan layanan darurat. Jika Anda dalam bahaya, hubungi 112 atau 110.</div>
    <div class="chat-msgs" id="chat-msgs">${chatBubbles(c)}</div>
    <div class="chat-foot" id="chat-foot">${chatFooter(c)}</div>
  </div>`;
}
// Perbarui bagian yang berubah saja, tanpa membangun ulang layar.
function updateChatDom(forceScroll){
  const c = state.chat;
  if(!c) return;
  const root = document.getElementById('chat-root');
  if(!root) return;
  const msgs = document.getElementById('chat-msgs');
  const nearBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
  const sig = c.messages.map(m => m.id + (m.pending?'p':'')).join(',') + '|' + c.loading;
  if(msgs.dataset.sig !== sig){
    msgs.innerHTML = chatBubbles(c); msgs.dataset.sig = sig;
    if(forceScroll === true || nearBottom || !msgs.dataset.init){ msgs.scrollTop = msgs.scrollHeight; msgs.dataset.init = '1'; }
  }
  const b = c.booking;
  const nm = document.getElementById('chat-name'); if(nm && b) nm.textContent = b.otherName;
  const st = document.getElementById('chat-status'); if(st) st.textContent = chatStatusLine(c);
  const en = document.getElementById('chat-end'); if(en) en.style.display = (b && b.myRole === 'lawyer' && b.status !== 'completed') ? '' : 'none';
  const foot = document.getElementById('chat-foot');
  const fsig = (b ? b.status + b.canSend : 'x') + '|' + (c.error || '');
  if(foot && foot.dataset.sig !== fsig){
    foot.innerHTML = chatFooter(c); foot.dataset.sig = fsig;
  }
}

// Builds the timeline events for one booking from the timestamps the API
// already returns (createdAt / respondedAt / payment.paidAt / scheduledAt /
// completedAt / cancelledAt), newest first — the same layout as a parcel
// tracking page.
function bookingTimeline(b, name){
  const ev = [];
  ev.push({ at: b.createdAt, title: 'Permintaan Dikirim', sub: 'Menunggu ' + name + ' menerima' });
  if(b.proposedAt){
    ev.push({ at: b.respondedAt, title: 'Jadwal Baru Diusulkan', sub: formatDateTime(b.proposedAt) + (b.proposalNote ? ' · ' + b.proposalNote : '') });
    if(b.proposalAnsweredAt){
      ev.push(b.status === 'cancelled'
        ? { at: b.proposalAnsweredAt, title: 'Usulan Jadwal Ditolak Klien', sub: '', tone: 'bad' }
        : { at: b.proposalAnsweredAt, title: 'Jadwal Baru Disetujui', sub: 'Menunggu pembayaran' });
    }
  }else if(b.respondedAt){
    ev.push(b.status === 'rejected'
      ? { at: b.respondedAt, title: 'Ditolak Pengacara', sub: name, tone: 'bad' }
      : { at: b.respondedAt, title: 'Disetujui Pengacara', sub: 'Menunggu pembayaran' });
  }
  if(b.status === 'expired') ev.push({ at: new Date(new Date(b.proposedAt ? b.respondedAt : b.createdAt).getTime() + 24*3600*1000).toISOString(), title: 'Kedaluwarsa', sub: 'Tidak dijawab dalam 24 jam', tone: 'bad' });
  if(b.payment && b.payment.paidAt){
    ev.push({ at: b.payment.paidAt, title: 'Pembayaran Berhasil', sub: formatRupiah(b.price), tone: 'good' });
  }
  if(['confirmed','ongoing','completed'].includes(b.status)){
    ev.push({ at: b.scheduledAt, title: b.status === 'ongoing' ? 'Konsultasi Berlangsung' : 'Jadwal Konsultasi', sub: methodLabelTitle(b.method) + ' · ' + name });
  }
  if(b.completedAt) ev.push({ at: b.completedAt, title: 'Konsultasi Selesai', sub: name, tone: 'good' });
  if(b.cancelledAt) ev.push({ at: b.cancelledAt, title: 'Dibatalkan', sub: '', tone: 'bad' });
  return ev.sort((a, c) => new Date(c.at) - new Date(a.at));
}

function formatTrackTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return d.toLocaleDateString('id-ID', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }) +
         ' | ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

    <div class="track-rows">

/* ============================================================
   Cakrawala — social feed
   ------------------------------------------------------------
   Backed by the real /posts API (see backend/src/modules/posts). Photos
   are resized client-side to a max 1280px edge and re-encoded as JPEG
   before upload — keeps the base64 payload well under the backend's
   ~3.5MB ceiling and the request from ever hitting Vercel's body-size
   limit, since a raw phone-camera photo can otherwise be 5-10MB.
============================================================ */
async function loadCakrawalaFeed(){
  state.cakrawalaLoading = true;
  state.cakrawalaError = null;
  render();
  try{
    const result = await api('/posts');
    state.cakrawalaPosts = result.items;
  }catch(e){
    state.cakrawalaError = e.message;
  }finally{
    state.cakrawalaLoading = false;
    render();
  }
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if(min < 1) return 'Baru saja';
  if(min < 60) return min + ' menit lalu';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' jam lalu';
  const day = Math.floor(hr / 24);
  if(day === 1) return 'Kemarin';
  if(day < 7) return day + ' hari lalu';
  return new Date(iso).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

// Deliberately does NOT call render() — that would rebuild the whole feed's
// innerHTML on every keystroke and kick focus out of the textarea. Instead
// it updates state (for submitCakrawalaPost to read) and flips just the
// submit button's disabled attribute directly, so "Bagikan" enables live
// as you type instead of staying stuck in whatever state it was first
// rendered in.
function onCakrawalaComposerInput(v){
  state.cakrawalaComposerText = v;
  const btn = document.getElementById('cakrawala-submit-btn');
  if(btn) btn.disabled = !(v.trim().length > 0 || !!state.cakrawalaComposerPhoto);
}

// Downscales/re-encodes the picked image on a <canvas> before it ever
// becomes a data URL, so a 10MB phone photo turns into a few hundred KB
// JPEG — the actual thing keeping uploads under the backend's size limit.
function onCakrawalaPhotoPicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX_EDGE = 1280;
      let { width, height } = img;
      if(width > MAX_EDGE || height > MAX_EDGE){
        if(width >= height){ height = Math.round(height * (MAX_EDGE / width)); width = MAX_EDGE; }
        else{ width = Math.round(width * (MAX_EDGE / height)); height = MAX_EDGE; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      state.cakrawalaComposerPhoto = canvas.toDataURL('image/jpeg', 0.78);
      render();
    };
    img.onerror = () => { alert('Foto tidak bisa dibaca, coba foto lain.'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeComposerPhoto(){ state.cakrawalaComposerPhoto = null; render(); }

async function submitCakrawalaPost(){
  const text = state.cakrawalaComposerText.trim();
  const photo = state.cakrawalaComposerPhoto;
  if(!text && !photo) return;

  state.cakrawalaPosting = true;
  render();
  try{
    const post = await api('/posts', { method:'POST', body:{ text: text || undefined, photo: photo || undefined } });
    state.cakrawalaPosts.unshift(post);
    state.cakrawalaComposerText = '';
    state.cakrawalaComposerPhoto = null;
  }catch(e){
    alert(e.message);
  }finally{
    state.cakrawalaPosting = false;
    render();
  }
}

async function toggleLikePost(postId){
  const post = state.cakrawalaPosts.find(p => p.id === postId);
  if(!post || state.cakrawalaLikeBusy[postId]) return;
  state.cakrawalaLikeBusy[postId] = true;

  // Optimistic update — flip immediately, reconcile (or roll back) once
  // the request settles, so tapping "Suka" feels instant on a slow network.
  const prevLiked = post.likedByMe;
  post.likedByMe = !prevLiked;
  post.likesCount += post.likedByMe ? 1 : -1;
  render();

  try{
    const result = await api(`/posts/${postId}/like`, { method:'POST' });
    post.likedByMe = result.liked;
  }catch(e){
    post.likedByMe = prevLiked;
    post.likesCount += prevLiked ? 1 : -1;
  }finally{
    delete state.cakrawalaLikeBusy[postId];
    render();
  }
}

function toggleComments(postId){
  state.cakrawalaOpenComments[postId] = !state.cakrawalaOpenComments[postId];
  render();
}
// Same reasoning as onCakrawalaComposerInput — no render() here, just a
// direct disabled-attribute flip, so the send button reacts immediately
// without knocking focus out of the comment field mid-type.
function onCommentDraftInput(postId, v){
  state.cakrawalaCommentDraft[postId] = v;
  const btn = document.getElementById('comment-send-' + postId);
  if(btn) btn.disabled = !v.trim();
}

async function submitComment(postId){
  const text = (state.cakrawalaCommentDraft[postId] || '').trim();
  if(!text || state.cakrawalaCommentBusy[postId]) return;
  const post = state.cakrawalaPosts.find(p => p.id === postId);
  if(!post) return;

  state.cakrawalaCommentBusy[postId] = true;
  render();
  try{
    const comment = await api(`/posts/${postId}/comments`, { method:'POST', body:{ text } });
    post.comments.push(comment);
    state.cakrawalaCommentDraft[postId] = '';
  }catch(e){
    alert(e.message);
  }finally{
    delete state.cakrawalaCommentBusy[postId];
    render();
  }
}

async function loadMyLawyerProfile(){
  state.myLawyerProfileLoading = true;
  state.myLawyerProfileError = null;
  render();
  try{
    const [profile, specs] = await Promise.all([
      api('/lawyers/me/profile'),
      state.specializationsCatalog.length ? Promise.resolve(state.specializationsCatalog) : api('/lawyers/specializations', { auth:false }),
    ]);
    state.myLawyerProfile = profile;
    state.specializationsCatalog = specs;
  }catch(e){
    state.myLawyerProfileError = e.message;
  }finally{
    state.myLawyerProfileLoading = false;
    render();
  }
}

  state.mode = m;

function setProfileGender(g){
  const f = state.profileForm;
  f.gender = f.gender === g ? '' : g;

function toggleProfileCaseLevel(value){
  const set = state.profileForm.caseLevels;
  set.has(value) ? set.delete(value) : set.add(value);
  render();
}
function toggleProfileServiceType(value){
  const set = state.profileForm.serviceTypes;
  set.has(value) ? set.delete(value) : set.add(value);
  render();
}
function toggleProfileDokumenOpen(){
  state.profileForm.dokumenOpen = !state.profileForm.dokumenOpen;
  render();
}
function toggleProfileDokumenNotarisOpen(){
  state.profileForm.dokumenNotarisOpen = !state.profileForm.dokumenNotarisOpen;
  render();
}
function toggleProfileAreaPraktikOpen(name){
  const set = state.profileForm.areaPraktikOpen;
  set.has(name) ? set.delete(name) : set.add(name);
  render();
}
function toggleProfileNotarisAreaPraktikOpen(name){
  const set = state.profileForm.notarisAreaPraktikOpen;
  set.has(name) ? set.delete(name) : set.add(name);
  render();
}
function useCurrentLocationForProfile(){
  const f = state.profileForm;
  if(!navigator.geolocation){
    f.locationError = 'Perangkat/browser ini tidak mendukung deteksi lokasi.';
    render();
    return;
  }
  f.locating = true;
  f.locationError = null;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      f.latitude = pos.coords.latitude;
      f.longitude = pos.coords.longitude;
      f.locating = false;
      render();
    },
    (err) => {
      f.locating = false;
      f.locationError = err.code === 1
        ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk browser ini lalu coba lagi.'
        : 'Gagal mendapatkan lokasi. Coba lagi.';
      render();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function backToLawyerDashboard(){ state.screen = 'home'; render(); }

function toggleSpec(id){
  const set = state.profileForm.specializationIds;
  if(set.has(id)) set.delete(id); else set.add(id);
  render();
}

async function submitLawyerProfile(){
  const f = state.profileForm;
  const barRegistrationNumber = document.getElementById('pf-bar').value.trim();
  const city = document.getElementById('pf-city').value.trim();
  const bio = document.getElementById('pf-bio').value.trim();
  const yearsExperience = Number(document.getElementById('pf-exp').value || 0);
  const hourlyRateChat = Number(document.getElementById('pf-rate-chat').value || 0);
  const hourlyRateVideo = Number(document.getElementById('pf-rate-video').value || 0);

  state.profileFormSubmitting = true;
  state.profileFormError = null;
  render();
  try{
    await api('/lawyers/me/profile', {
      method:'PUT',
      body:{
        barRegistrationNumber, city, bio: bio || undefined,
        yearsExperience, hourlyRateChat, hourlyRateVideo,
        specializationIds: Array.from(f.specializationIds),
        gender: f.gender || undefined,
        caseLevels: Array.from(f.caseLevels),
        serviceTypes: Array.from(f.serviceTypes),
        latitude: f.latitude ?? undefined,
        longitude: f.longitude ?? undefined,
      },
    });
    state.screen = 'home'; // back to dashboard content, mode stays 'pengacara'
    await loadMyLawyerProfile();
  }catch(e){
    state.profileFormError = e.message;
    state.profileFormSubmitting = false;
    render();
    return;
  }
  state.profileFormSubmitting = false;
}

    {key:'profil', label:'Akun', icon:`<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`},
  ];
  const activeKey = ['home','detail','booking','confirm','layanan-detail','cari-lawyer-hasil','cari-notaris-hasil','cari-konsultan-hasil'].includes(state.screen) ? 'home' : state.screen;
  return `
  <div class="bottomnav">
    ${items.map(i => i.fab ? `
      <button class="navitem fab ${state.showHangoutFilterSheet || state.screen==='cari-hangout-hasil' ? 'active' : ''}" style="position:relative;" onclick="openHangoutFromNav()">
        <span class="fab-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${i.icon}</svg></span>
        ${i.label}
      </button>` : `
      <button class="navitem ${activeKey===i.key?'active':''}" style="position:relative;" onclick="goScreen('${i.key}')">
        ${navBadge(i.badge || 0)}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${i.icon}</svg>
        ${i.label}
      </button>`).join('')}
  </div>`;
}

// Center "Hang Out" tab: opens the same filter sheet as the Pilih Layanan
// tile, from whichever screen the client is on.
function openHangoutFromNav(){
  state.mode = 'klien';
  state.showAllServices = false;
  openHangoutSearchFilter();
}

function goScreen(s){
  state.mode = 'klien';
  state.screen = s;
  state.showAllServices = false;
  render();
  if(s === 'home' && state.lawyers.length === 0) loadLawyers();
  if(s === 'konsultasi') loadMyBookings();
  if(s === 'cakrawala') loadCakrawalaFeed();
}
function goHome(){ state.screen = 'home'; state.showAllServices = false; state.showLawyerFilterSheet = false; state.showNotarisFilterSheet = false; state.showKonsultanFilterSheet = false; state.showHangoutFilterSheet = false; render(); }

/* ============================================================
   Live-ish updates while the tab stays open
   ------------------------------------------------------------
   This mockup has no real push-notification channel — it's a static
   HTML file with no server to push from. What it CAN do honestly is
   poll the API for booking changes while the app is open and, if
   anything new shows up, both bump the nav badge above and fire a
   browser Notification() popup (notifyNewActivity()). That covers the
   "I'm using the app right now" case. Getting a phone notification
   while Lexara is closed needs real infrastructure on the actual
   Express/Prisma backend — e.g. Firebase Cloud Messaging or web push
   (VAPID) — which is outside what a front-end mockup file can provide.
============================================================ */
async function pollForBookingUpdates(){
  if(!state.token || !state.user) return;
  if(typeof document !== 'undefined' && document.hidden) return; // tab not in front — skip this tick
  const before = new Map(state.myBookings.map(b => [b.id, b.status]));
  try{
    const fresh = await api('/bookings/me');
    const isLawyer = state.user.role === 'lawyer';
    fresh.forEach(b => {
      const prevStatus = before.get(b.id);
      if(prevStatus === undefined) return; // first load — nothing to compare yet
      if(prevStatus === b.status) return;
      if(isLawyer && b.status === 'pending_approval'){
        notifyNewActivity('Permintaan konsultasi baru', (b.client ? b.client.fullName : 'Klien') + ' mengajukan konsultasi.');
      }else if(!isLawyer && b.status === 'pending_payment'){
        notifyNewActivity('Permintaan diterima', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' menerima permintaan Anda — lanjutkan pembayaran.');
      }else if(!isLawyer && b.status === 'pending_reschedule'){
        notifyNewActivity('Usulan jadwal baru', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' mengusulkan jam lain untuk konsultasi Anda.');
      }else if(!isLawyer && b.status === 'rejected'){
        notifyNewActivity('Permintaan ditolak', (b.lawyer ? b.lawyer.user.fullName : 'Pengacara') + ' tidak dapat menerima permintaan Anda.');
      }
    });
    state.myBookings = fresh;
    render();
  }catch(e){ /* silent — this is a background refresh, not a user action */ }
}

/* ============================================================
   Boot
============================================================ */
loadSession();
render();
if(state.token){
  loadLawyers();
  loadMyBookings();
  loadCakrawalaFeed();
  // 60s, not 20s — this hits the API on every open tab; too short risks
  // exhausting Supabase's connection pool on small/free-tier plans and
  // showing "terjadi kesalahan pada server" more often than before this
  // polling existed. Widen further (or drop it) if errors keep happening.
  setInterval(pollForBookingUpdates, 60000);
}
startBannerAutoplay();
</script>
