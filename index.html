const LEGAL_DOCS = {"privasi": "<p><em>Versi ringkas berlapis untuk ditampilkan di aplikasi | PT Syihab Adinata &amp; Partners | Versi 1.0</em></p>\n<p><em>Versi 1.0 | Berlaku efektif: <mark>[tanggal]</mark> | Dokumen lengkap: Kebijakan Privasi Lexara</em></p>\n<p>Pemberitahuan ini adalah <strong>ringkasan berlapis</strong> tentang cara PT Syihab Adinata &amp; Partners (\"Kami\") memproses Data Pribadi Anda di Lexara. Penjelasan lengkap ada di <strong>Kebijakan Privasi</strong>. Pemberitahuan ini ditampilkan pada saat pendaftaran dan pada momen tertentu saat Anda memberikan data (lihat bagian 6).</p>\n<div class=\"lg-tw\"><table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>Ringkasan 1 Layar</strong></p>\n<p>• Kami mengumpulkan data yang dibutuhkan untuk mempertemukan Anda dengan Mitra, memproses pembayaran, dan menjaga keamanan.</p>\n<p>• Untuk <strong>data sensitif</strong> (kesehatan/psikologis, catatan pidana, data anak) dan <strong>lokasi presisi</strong>, Kami meminta persetujuan Anda <strong>terpisah</strong> dari Ketentuan Penggunaan.</p>\n<p>• Kami <strong>tidak menjual</strong> Data Pribadi Anda.</p>\n<p>• Data perkara Anda dibagikan hanya kepada Mitra yang Anda pilih, setelah Anda membuka Obrolan dan menyetujui.</p>\n<p>• Anda dapat mengakses, memperbaiki, menghapus data, dan menarik persetujuan di <strong>Pengaturan &gt; Privasi &amp; Data</strong>.</p>\n<p>• Kontak Petugas Pelindungan Data Pribadi (PPDP): <mark><mark>[email]</mark></mark>.</p></td>\n</tr>\n</tbody>\n</table></div>\n<h2><strong>1. Apa yang Kami Kumpulkan dan untuk Apa</strong></h2>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Data</strong></th>\n<th><strong>Untuk apa</strong></th>\n<th><strong>Dasar</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Akun dan identitas (nama, kontak, tanggal lahir untuk verifikasi usia 18+)</td>\n<td>Membuat akun, verifikasi, keamanan</td>\n<td>Perjanjian</td>\n</tr>\n<tr class=\"even\">\n<td>Brief dan Obrolan (uraian masalah, pesan, lampiran)</td>\n<td>Menghubungkan Anda dengan Mitra, menyepakati harga, menyusun PKS</td>\n<td>Perjanjian; persetujuan untuk data sensitif</td>\n</tr>\n<tr class=\"odd\">\n<td>Pembayaran (riwayat, nominal, token dari penyedia pembayaran)</td>\n<td>Memproses Biaya Platform dan Honor, faktur, pengembalian</td>\n<td>Perjanjian; kewajiban hukum</td>\n</tr>\n<tr class=\"even\">\n<td>Lokasi dan alamat</td>\n<td>Mencari Mitra terdekat; lokasi presisi hanya bila diizinkan</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"odd\">\n<td>Progress, PKS, dan feedback</td>\n<td>Memantau layanan, bukti kesepakatan, reputasi</td>\n<td>Perjanjian</td>\n</tr>\n<tr class=\"even\">\n<td>Perangkat dan penggunaan</td>\n<td>Keamanan, pencegahan penipuan, perbaikan layanan</td>\n<td>Kepentingan yang sah; persetujuan untuk analitik non-esensial</td>\n</tr>\n</tbody>\n</table></div>\n<h2><strong>2. Persetujuan yang Kami Minta Secara Terpisah</strong></h2>\n<p>Persetujuan berikut tidak dicentang otomatis dan tidak digabung dengan Ketentuan Penggunaan. Menolak persetujuan opsional tidak membuat Anda kehilangan layanan dasar.</p>\n<ul>\n<li><p>Membagikan data sensitif yang Anda unggah kepada Mitra pilihan Anda.</p></li>\n<li><p>Lokasi presisi untuk pencarian Mitra terdekat.</p></li>\n<li><p>Promosi dan pemasaran; analitik dan personalisasi non-esensial.</p></li>\n<li><p>Fitur AI atas input Anda <mark><mark>[jika diaktifkan]</mark></mark>.</p></li>\n<li><p>Perekaman sesi (per sesi, dengan persetujuan semua pihak).</p></li>\n<li><p>Pemeriksaan dokumen kelayakan program subsidi <mark><mark>[jika tersedia]</mark></mark>.</p></li>\n<li><p>Penampilan feedback dengan nama atau inisial Anda; transfer data ke luar Indonesia bila diwajibkan memerlukan persetujuan <mark><mark>[jika berlaku]</mark></mark>.</p></li>\n</ul>\n<h2><strong>3. Dengan Siapa Data Dibagikan</strong></h2>\n<ul>\n<li><p><strong>Mitra yang Anda pilih</strong>, hanya data yang diperlukan. Sebelum PKS ditandatangani, Mitra hanya melihat ringkasan tanpa identitas lengkap dan dokumen.</p></li>\n<li><p><strong>Penyedia pembayaran</strong> berizin, <strong>penyedia teknologi</strong> (hosting, OTP, video, analitik) yang bertindak atas instruksi Kami, dan <strong>penasihat profesional</strong> Kami.</p></li>\n<li><p><strong>Otoritas berwenang</strong> bila diwajibkan hukum.</p></li>\n</ul>\n<h2><strong>4. Hak Anda</strong></h2>\n<p>Anda berhak mengakses dan memperoleh salinan data, memperbaiki, menghapus atau mengakhiri pemrosesan, menarik persetujuan, mengajukan keberatan atas pemrosesan otomatis, menunda atau membatasi pemrosesan, memperoleh portabilitas data, dan meminta ganti rugi. Ajukan lewat <strong>Pengaturan &gt; Privasi &amp; Data</strong> atau email PPDP. Penarikan persetujuan dan pembatasan pemrosesan ditindaklanjuti paling lambat 3 x 24 jam setelah permohonan terverifikasi.</p>\n<h2><strong>5. Keamanan dan Kegagalan Pelindungan Data</strong></h2>\n<p>Kami menerapkan pengamanan teknis dan organisasi yang wajar. Bila terjadi kegagalan pelindungan Data Pribadi, Kami memberi tahu Anda dan lembaga PDP yang berwenang secara tertulis paling lambat 3 x 24 jam sejak diketahui secara pasti, patut, dan wajar.</p>\n<h2><strong>6. Pemberitahuan pada Momen Tertentu (teks untuk ditampilkan di aplikasi)</strong></h2>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Momen</strong></th>\n<th><strong>Teks yang ditampilkan</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pendaftaran</td>\n<td>\"Kami memakai data Anda untuk membuat akun dan mempertemukan Anda dengan Mitra. Baca ringkasan privasi dan atur persetujuan Anda. Kami tidak menjual data Anda.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Pertanyaan keselamatan (Psikolog/korban)</td>\n<td>\"Jawaban Anda membantu kami menampilkan bantuan darurat. Jawaban tidak menghalangi layanan dan tidak dipakai untuk keputusan otomatis.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Sebelum membuka Obrolan</td>\n<td>\"Membuka Obrolan membagikan brief singkat Anda kepada Mitra ini, tanpa identitas lengkap. Biaya Platform maksimal Rp200.000 dan dikembalikan sesuai kebijakan.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Unggah dokumen sensitif</td>\n<td>\"Dokumen ini mungkin berisi data sensitif. Dokumen hanya dibagikan kepada Mitra pilihan Anda setelah Anda menyetujui, dan dapat Anda tarik kapan saja.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Izin lokasi</td>\n<td>\"Lexara memakai lokasi Anda untuk menampilkan Mitra terdekat. Anda juga bisa mengetik alamat secara manual.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Pembuatan PKS</td>\n<td>\"PKS memuat nama, identitas, dan ringkasan kebutuhan Anda. Data ini dibagikan kepada Mitra yang menandatangani PKS.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Perekaman sesi</td>\n<td>\"Sesi ini akan direkam hanya jika Anda dan Mitra sama-sama menyetujui. Rekaman dapat dihapus sesuai kebijakan retensi.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Fitur AI</td>\n<td>\"Input Anda diproses oleh fitur AI dengan persetujuan Anda. Jawaban dapat keliru dan bukan nasihat profesional.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Feedback</td>\n<td>\"Feedback Anda dibuka bersamaan dengan feedback Mitra. Jangan menulis rahasia perkara atau data pribadi pihak ketiga.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Program subsidi</td>\n<td>\"Dokumen kelayakan Anda hanya dipakai untuk menilai program ini dan dihapus sesuai kebijakan retensi.\"</td>\n</tr>\n</tbody>\n</table></div>\n<h2><strong>7. Kontak</strong></h2>\n<p>PPDP Lexara: <mark><mark>[nama]</mark></mark>, <mark><mark>[email]</mark></mark>, <mark><mark>[telepon]</mark></mark>, <mark><mark>[alamat]</mark></mark>. Anda juga berhak mengadu kepada lembaga pelindungan data pribadi yang berwenang. Baca selengkapnya di <strong>Kebijakan Privasi Lexara</strong>.</p>", "kebijakan": "<p><em>Versi lengkap | PT Syihab Adinata &amp; Partners | Versi 1.0 | Selaras UU PDP dan PP 33/2026</em></p>\n<p><em>Versi 1.0 | Berlaku efektif: <mark>[tanggal; disarankan paling lambat 16 Januari 2027]</mark> | Terakhir diperbarui: <mark>[tanggal]</mark></em></p>\n<div class=\"lg-tw\"><table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>Ringkasan</strong></p>\n<p>• Kebijakan ini menjelaskan secara lengkap bagaimana Kami memproses Data Pribadi Pelanggan dan Mitra di Lexara. Versi ringkasnya ada di <strong>Pemberitahuan Privasi</strong>.</p>\n<p>• Kami memproses data hanya dengan dasar yang sah, meminta persetujuan eksplisit <strong>terpisah</strong> untuk data sensitif dan lokasi presisi, dan tidak menjual Data Pribadi.</p>\n<p>• Anda dapat mengajukan hak Anda melalui <strong>Pengaturan &gt; Privasi &amp; Data</strong> atau email PPDP.</p></td>\n</tr>\n</tbody>\n</table></div>\n<h3><strong>1. Tentang Kebijakan Ini</strong></h3>\n<p><strong>1.1</strong> Kebijakan ini berlaku bagi seluruh pengguna Aplikasi Lexara dan situs terkait: Pelanggan, calon Pelanggan, dan Mitra. Kebijakan ini disusun berdasarkan UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi (UU PDP) dan PP No. 33 Tahun 2026 tentang peraturan pelaksanaannya.</p>\n<p><strong>1.2</strong> Istilah yang tidak didefinisikan di sini mengikuti Ketentuan Penggunaan Lexara.</p>\n<h3><strong>2. Siapa Kami dan Peran Para Pihak</strong></h3>\n<p><strong>2.1 Pengendali Data Pribadi:</strong> PT Syihab Adinata &amp; Partners, <mark><mark>[alamat lengkap]</mark></mark>, NIB <mark><mark>[nomor]</mark></mark>, Tanda Daftar PSE <mark><mark>[nomor]</mark></mark> (\"Kami\").</p>\n<p><strong>2.2 Petugas Pelindungan Data Pribadi (PPDP):</strong> <mark><mark>[nama/jabatan]</mark></mark>, <mark><mark>[email]</mark></mark>, <mark><mark>[telepon]</mark></mark>. PPDP bertugas memberi saran dan memastikan kepatuhan, memberi saran atas penilaian dampak, dan menjadi narahubung bagi Anda dan lembaga PDP.</p>\n<p><strong>2.3 Mitra</strong> (Advokat, Notaris/PPAT, Konsultan, Akuntan, Psikolog, Wartawan/Media, Ahli Hukum, Auditor) memproses data Anda untuk jasa profesionalnya dan bertanggung jawab atas kerahasiaan sesuai profesinya. Dalam hal ini Mitra bertindak sebagai <strong>pengendali tersendiri</strong> atas data yang diterimanya untuk memberi layanan kepada Anda, sebagaimana diatur dalam Perjanjian Kemitraan. Kami dan Mitra tidak menentukan bersama tujuan dan cara pemrosesan yang sama kecuali dinyatakan lain dalam perjanjian tertulis.</p>\n<p><strong>2.4 Prosesor Data Pribadi</strong> adalah pihak yang memproses data atas instruksi Kami (misalnya penyedia hosting, pengiriman OTP, panggilan video, analitik) berdasarkan perjanjian yang mengatur cakupan dan cara pemrosesan, jenis dan tujuan, jangka waktu, hak dan kewajiban, serta mekanisme pengawasan dan audit. Prosesor hanya dapat menggunakan prosesor lain dengan persetujuan tertulis Kami.</p>\n<h3><strong>3. Data yang Kami Proses</strong></h3>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Kategori</strong></th>\n<th><strong>Contoh</strong></th>\n<th><strong>Sumber</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Akun dan identitas</td>\n<td>Nama, email, nomor telepon, kata sandi (terenkripsi), foto profil (opsional), tanggal lahir (verifikasi usia 18+), jenis kelamin (opsional)</td>\n<td>Anda</td>\n</tr>\n<tr class=\"even\">\n<td>Lokasi dan alamat</td>\n<td>Alamat, lokasi perkiraan; lokasi presisi hanya bila diizinkan</td>\n<td>Anda, perangkat</td>\n</tr>\n<tr class=\"odd\">\n<td>Brief, Obrolan, dan dokumen</td>\n<td>Uraian masalah, pesan, lampiran (kontrak, bukti, putusan), data pihak lain yang Anda masukkan</td>\n<td>Anda, Mitra</td>\n</tr>\n<tr class=\"even\">\n<td>Penawaran, PKS, dan Progress</td>\n<td>Nominal, lingkup, jangka waktu, versi PKS dan Addendum, status milestone, jadwal</td>\n<td>Anda, Mitra, sistem</td>\n</tr>\n<tr class=\"odd\">\n<td>Pembayaran</td>\n<td>Riwayat Biaya Platform dan Honor, faktur, token dari penyedia pembayaran (Kami tidak menyimpan nomor kartu lengkap)</td>\n<td>Anda, penyedia pembayaran</td>\n</tr>\n<tr class=\"even\">\n<td>Data Pribadi Spesifik</td>\n<td>Data kesehatan atau psikologis, catatan kejahatan, data anak, data keuangan pribadi, biometrik (bila verifikasi wajah dipakai), sepanjang Anda unggah atau diperlukan layanan</td>\n<td>Anda</td>\n</tr>\n<tr class=\"odd\">\n<td>Perangkat dan penggunaan</td>\n<td>Alamat IP, jenis perangkat, sistem operasi, log aktivitas (metadata), laporan kerusakan</td>\n<td>Perangkat</td>\n</tr>\n<tr class=\"even\">\n<td>Feedback dan pengaduan</td>\n<td>Rating, ulasan, laporan, riwayat sengketa</td>\n<td>Anda, Mitra</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>3.1</strong> Kami meminimalkan data: Mitra hanya menerima ringkasan brief sebelum PKS ditandatangani, dan identitas lengkap serta dokumen dibuka setelah PKS dan persetujuan yang diperlukan. Kami tidak membaca isi komunikasi dan dokumen Anda kecuali dalam hal yang dijelaskan pada bagian 7.</p>\n<h3><strong>4. Tujuan dan Dasar Pemrosesan</strong></h3>\n<p><strong>4.1</strong> Sebelum memproses, Kami memiliki dasar pemrosesan yang sah sesuai peraturan: persetujuan eksplisit untuk satu atau beberapa tujuan tertentu; pelaksanaan perjanjian; kewajiban hukum; kepentingan vital; atau kepentingan lain dengan menyeimbangkan kepentingan Kami dan hak Anda. Pemrosesan tidak bersifat diskriminatif.</p>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Tujuan</strong></th>\n<th><strong>Data utama</strong></th>\n<th><strong>Dasar pemrosesan</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Membuat dan mengelola akun, verifikasi</td>\n<td>Akun dan identitas</td>\n<td>Pelaksanaan perjanjian</td>\n</tr>\n<tr class=\"even\">\n<td>Pencarian, Obrolan, penawaran, PKS, dan Progress</td>\n<td>Brief, Obrolan, penawaran, PKS</td>\n<td>Pelaksanaan perjanjian</td>\n</tr>\n<tr class=\"odd\">\n<td>Pembayaran Biaya Platform dan Honor, faktur, pengembalian</td>\n<td>Pembayaran</td>\n<td>Pelaksanaan perjanjian; kewajiban hukum (pembukuan dan perpajakan)</td>\n</tr>\n<tr class=\"even\">\n<td>Membagikan Data Pribadi Spesifik kepada Mitra pilihan Anda</td>\n<td>Data spesifik</td>\n<td><strong>Persetujuan eksplisit terpisah</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>Pencarian Mitra terdekat dengan lokasi presisi</td>\n<td>Lokasi presisi</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"even\">\n<td>Keamanan, pencegahan penipuan, penegakan Ketentuan, penanganan sengketa</td>\n<td>Perangkat, akun, transaksi, log</td>\n<td>Kepentingan yang sah; kewajiban hukum</td>\n</tr>\n<tr class=\"odd\">\n<td>Kewajiban hukum (perpajakan, permintaan aparat berwenang yang sah, kewajiban PSE)</td>\n<td>Sesuai kebutuhan</td>\n<td>Kewajiban hukum</td>\n</tr>\n<tr class=\"even\">\n<td>Analitik non-esensial dan personalisasi</td>\n<td>Perangkat dan penggunaan</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"odd\">\n<td>Promosi dan pemasaran</td>\n<td>Akun, preferensi</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"even\">\n<td>Program subsidi dan rujukan bantuan hukum</td>\n<td>Dokumen kelayakan</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"odd\">\n<td>Fitur AI <mark><mark>[jika diaktifkan]</mark></mark></td>\n<td>Input Anda</td>\n<td>Persetujuan</td>\n</tr>\n<tr class=\"even\">\n<td>Perlindungan keselamatan Anda dalam keadaan darurat</td>\n<td>Informasi yang Anda berikan</td>\n<td>Kepentingan vital</td>\n</tr>\n</tbody>\n</table></div>\n<h3><strong>5. Persetujuan Eksplisit</strong></h3>\n<p><strong>5.1</strong> Persetujuan diminta terpisah dari penerimaan Ketentuan Penggunaan, untuk tujuan tertentu yang Kami jelaskan, tidak dicentang otomatis, dan dicatat (versi teks, waktu, perangkat). Daftar: (a) pembagian data spesifik kepada Mitra; (b) lokasi presisi; (c) promosi; (d) analitik dan personalisasi; (e) fitur AI; (f) perekaman sesi per sesi; (g) pemeriksaan kelayakan subsidi; (h) penampilan feedback dengan nama atau inisial; (i) transfer lintas negara bila diwajibkan.</p>\n<p><strong>5.2</strong> Menolak persetujuan opsional tidak membuat Anda kehilangan layanan dasar. Untuk layanan yang secara nyata memerlukan data spesifik (misalnya konsultasi psikologis), Mitra tidak dapat memberi layanan tersebut tanpa data yang relevan.</p>\n<p><strong>5.3</strong> Anda dapat menarik persetujuan kapan saja di <strong>Pengaturan &gt; Privasi &amp; Data</strong>. Setelah permohonan terverifikasi, Kami menghentikan pemrosesan berbasis persetujuan itu paling lambat 3 x 24 jam. Penarikan tidak memengaruhi pemrosesan yang sudah dilakukan secara sah.</p>\n<h3><strong>6. Pembagian Data</strong></h3>\n<p><strong>6.1</strong> Kami membagikan data kepada: (a) <strong>Mitra yang Anda pilih</strong> (hanya yang diperlukan); (b) <strong>penyedia jasa pembayaran</strong> berizin; (c) <strong>prosesor</strong> (hosting/cloud, OTP, video, analitik) berdasarkan perjanjian pemrosesan; (d) <strong>penasihat profesional</strong> Kami (hukum, audit, keamanan); (e) <strong>aparat atau otoritas berwenang</strong> bila diwajibkan hukum; dan (f) pihak dalam <strong>restrukturisasi korporasi</strong> dengan pemberitahuan kepada Anda dan perlindungan setara.</p>\n<p><strong>6.2</strong> Kami <strong>tidak menjual</strong> Data Pribadi Anda.</p>\n<h3><strong>7. Kerahasiaan, Akses Staf, dan Mitra</strong></h3>\n<p><strong>7.1</strong> Staf Lexara tidak membaca isi Obrolan dan dokumen secara rutin. Akses terbatas hanya untuk: menangani laporan pelanggaran atau pengaduan, mediasi sengketa (terbatas pada bukti yang diajukan), pelaksanaan perintah hukum yang sah, atau dengan persetujuan Anda. Setiap akses sensitif dicatat dalam log audit.</p>\n<p><strong>7.2</strong> Mitra wajib menjaga kerahasiaan sesuai kode etik profesinya dan Perjanjian Kemitraan, termasuk tidak menggunakan data Anda di luar layanan. Untuk Psikolog, Progress tidak memuat isi klinis, dan catatan internal Mitra tidak terlihat Pelanggan.</p>\n<h3><strong>8. Transfer Data ke Luar Wilayah Indonesia</strong></h3>\n<p><strong>8.1</strong> Data utama disimpan di <mark><mark>[Indonesia / lokasi server]</mark></mark>. Jika data ditransfer ke luar Indonesia (misalnya oleh penyedia cloud), Kami lebih dahulu memetakan alur transfer, memastikan data yang ditransfer sesuai kebutuhan, menilai instrumen hukum dan risikonya, serta menyampaikan kepada Anda tujuan transfer, mekanisme pelindungan, dan risiko beserta mitigasinya.</p>\n<p><strong>8.2</strong> Transfer hanya dilakukan ke negara dengan tingkat pelindungan yang setara atau lebih tinggi. Jika tidak terpenuhi, Kami memastikan pelindungan yang memadai dan mengikat. Jika keduanya tidak terpenuhi, Kami meminta persetujuan Anda.</p>\n<h3><strong>9. Jangka Waktu Penyimpanan</strong></h3>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Jenis data</strong></th>\n<th><strong>Masa simpan <mark>[usulan; finalkan]</mark></strong></th>\n<th><strong>Setelah masa simpan</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Akun dan profil</td>\n<td>Selama akun aktif + <mark>[12]</mark> bulan setelah penutupan</td>\n<td>Dihapus atau dianonimkan</td>\n</tr>\n<tr class=\"even\">\n<td>Transaksi dan bukti pembayaran</td>\n<td><mark>[10 tahun, selaras kewajiban pembukuan/perpajakan; verifikasi]</mark></td>\n<td>Dihapus atau dianonimkan</td>\n</tr>\n<tr class=\"odd\">\n<td>Chat dan dokumen perkara</td>\n<td><mark>[24]</mark> bulan setelah layanan ditutup, atau lebih cepat atas permintaan Anda</td>\n<td>Dihapus</td>\n</tr>\n<tr class=\"even\">\n<td>PKS, Addendum, dan riwayat penawaran</td>\n<td><mark>[10 tahun]</mark> sebagai bukti perjanjian <mark><mark>[verifikasi]</mark></mark></td>\n<td>Dihapus atau dianonimkan</td>\n</tr>\n<tr class=\"odd\">\n<td>Jadwal dan Progress (tanpa isi klinis)</td>\n<td><mark>[24]</mark> bulan setelah layanan ditutup</td>\n<td>Dihapus</td>\n</tr>\n<tr class=\"even\">\n<td>Log keamanan</td>\n<td><mark>[12]</mark> bulan</td>\n<td>Dihapus</td>\n</tr>\n<tr class=\"odd\">\n<td>Data verifikasi Mitra</td>\n<td>Selama kemitraan + <mark>[24]</mark> bulan</td>\n<td>Dihapus</td>\n</tr>\n<tr class=\"even\">\n<td>Dokumen kelayakan subsidi</td>\n<td>Sampai keputusan program + <mark>[6]</mark> bulan</td>\n<td>Dihapus</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>9.1</strong> Data dapat disimpan lebih lama jika diwajibkan hukum atau diperlukan untuk sengketa yang sedang berjalan. Penghapusan dilakukan otomatis setelah masa simpan berakhir.</p>\n<h3><strong>10. Keamanan</strong></h3>\n<p><strong>10.1</strong> Kami menerapkan langkah teknis dan organisasi yang wajar, antara lain: <mark><mark>[enkripsi saat transmisi dan penyimpanan]</mark></mark>, pembatasan akses berdasarkan kebutuhan (need-to-know), penyamaran data pada tampilan tertentu, log audit append-only, OTP ulang untuk aksi bernilai tinggi (tanda tangan PKS, ubah rekening, unduh dokumen), pengujian keamanan berkala, serta prosedur penanganan insiden.</p>\n<p><strong>10.2</strong> Tidak ada sistem yang sepenuhnya kebal. Jaga kerahasiaan kredensial dan segera laporkan aktivitas mencurigakan.</p>\n<h3><strong>11. Hak Anda dan Cara Menggunakannya</strong></h3>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Hak</strong></th>\n<th><strong>Penjelasan</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Akses dan salinan</td>\n<td>Mengetahui dan memperoleh data Anda beserta rekam jejak pemrosesannya.</td>\n</tr>\n<tr class=\"even\">\n<td>Perbaikan</td>\n<td>Memperbaiki data yang keliru atau tidak lengkap.</td>\n</tr>\n<tr class=\"odd\">\n<td>Penghapusan/pengakhiran</td>\n<td>Meminta data dihapus atau pemrosesan diakhiri, sepanjang tidak bertentangan dengan kewajiban hukum.</td>\n</tr>\n<tr class=\"even\">\n<td>Penarikan persetujuan</td>\n<td>Menarik persetujuan yang diberikan; dihentikan paling lambat 3 x 24 jam setelah permohonan terverifikasi.</td>\n</tr>\n<tr class=\"odd\">\n<td>Keberatan</td>\n<td>Mengajukan keberatan atas pemrosesan otomatis atau profiling yang berdampak hukum atau signifikan.</td>\n</tr>\n<tr class=\"even\">\n<td>Penundaan/pembatasan</td>\n<td>Meminta pemrosesan ditunda atau dibatasi; ditindaklanjuti paling lambat 3 x 24 jam.</td>\n</tr>\n<tr class=\"odd\">\n<td>Portabilitas</td>\n<td>Memperoleh dan memindahkan data dalam format yang lazim, sepanjang tersedia.</td>\n</tr>\n<tr class=\"even\">\n<td>Ganti rugi</td>\n<td>Menuntut ganti rugi atas pelanggaran pemrosesan Data Pribadi (lihat bagian 12).</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>11.1 Cara mengajukan.</strong> Permohonan dibuat melalui kanal elektronik (<strong>Pengaturan &gt; Privasi &amp; Data</strong> atau email PPDP) dan tercatat. Permohonan memuat identitas pemohon, penjelasan mengenai hak dan kepentingan Anda, serta uraian permohonan atas data yang diproses.</p>\n<p><strong>11.2 Siapa yang dapat mengajukan.</strong> Anda sendiri, orang tua atau wali anak, wali penyandang disabilitas, atau pihak yang Anda beri kuasa.</p>\n<p><strong>11.3 Verifikasi dan tanggapan.</strong> Kami memverifikasi permohonan dengan cara yang proporsional, lalu memenuhi atau menolak sesuai peraturan, dengan alasan tertulis. Kami menanggapi paling lambat <mark>[x]</mark> hari kerja, kecuali jangka waktu yang lebih singkat diatur peraturan. Jika Kami tidak melaksanakan kewajiban, Anda dapat melaporkan kepada lembaga PDP yang berwenang.</p>\n<p><strong>11.4</strong> Hak tertentu dapat dibatasi jika diwajibkan hukum atau untuk penegakan hukum; Kami menjelaskan alasannya.</p>\n<h3><strong>12. Ganti Rugi</strong></h3>\n<p><strong>12.1</strong> Anda berhak menggugat dan menerima ganti rugi atas pelanggaran pemrosesan Data Pribadi tentang diri Anda. Permintaan diajukan kepada Kami melalui PPDP dan memuat identitas, bukti, serta hubungan hukum Anda dengan Kami terkait pemrosesan tersebut.</p>\n<p><strong>12.2</strong> Kami memiliki mekanisme penanganan: penerimaan permintaan, penilaian, dan jawaban tertulis dalam <mark>[x]</mark> hari kerja. Jika ditolak atau tidak tercapai kesepakatan, Anda dapat mengajukan gugatan sesuai peraturan.</p>\n<h3><strong>13. Keputusan Otomatis, Profiling, dan Fitur AI</strong></h3>\n<p><strong>13.1</strong> Kami tidak membuat keputusan yang berdampak hukum atau signifikan terhadap Anda semata-mata berdasarkan pemrosesan otomatis. Pengurutan hasil pencarian memakai relevansi (filter, jarak, ketersediaan), bukan pembayaran maupun profil sensitif Anda.</p>\n<p><strong>13.2</strong> <mark><mark>[Jika fitur AI aktif]</mark></mark> Input Anda diproses hanya dengan persetujuan terpisah dan tidak dipakai untuk melatih model tanpa persetujuan. Anda dapat mengajukan keberatan sebagaimana pada bagian 11.</p>\n<p><strong>13.3</strong> Sebelum pemrosesan berisiko tinggi (data spesifik, skala besar, teknologi baru, pemantauan sistematis, atau keputusan otomatis), Kami melakukan penilaian dampak pelindungan Data Pribadi, mendokumentasikannya, dan memperhatikan saran PPDP.</p>\n<h3><strong>14. Anak, Penyandang Disabilitas, dan Kelompok Rentan</strong></h3>\n<p><strong>14.1</strong> Aplikasi hanya untuk berusia 18 tahun ke atas. Jika kasus menyangkut anak, orang tua, wali, atau pendamping hukum membuat akun dan memberi persetujuan. Data anak diproses dengan perlindungan tambahan.</p>\n<p><strong>14.2</strong> Untuk korban tindak pidana dan kelompok rentan, Kami membatasi akses data hanya pada pihak yang membutuhkan, menyediakan penagihan dan notifikasi yang diskret, dan mewajibkan Mitra menjaga kerahasiaan identitas korban.</p>\n<h3><strong>15. Non-Diskriminasi</strong></h3>\n<p><strong>15.1</strong> Kami memastikan pemrosesan tidak diskriminatif. Fitur seperti filter jenis kelamin Mitra tersedia sebagai pilihan Anda untuk kenyamanan, bukan untuk menilai atau membatasi Anda.</p>\n<h3><strong>16. Kegagalan Pelindungan Data Pribadi</strong></h3>\n<p><strong>16.1</strong> Bila terjadi kegagalan pelindungan Data Pribadi, Kami memberi tahu Anda dan lembaga PDP yang berwenang secara tertulis paling lambat 3 x 24 jam sejak diketahui secara pasti, patut, dan wajar. Pemberitahuan memuat data yang terungkap, waktu dan cara terungkapnya, upaya penanganan dan pemulihan, serta kontak PPDP.</p>\n<p><strong>16.2</strong> Bila kegagalan berdampak serius terhadap kepentingan masyarakat, Kami juga memberi tahu publik melalui media yang sesuai. Kami mendokumentasikan setiap kegagalan, menyampaikannya kepada lembaga PDP, dan memiliki prosedur pencegahan dan penanganan insiden yang ditinjau berkala. Prosesor wajib melaporkan insiden kepada Kami pada kesempatan pertama.</p>\n<h3><strong>17. Lokasi, Cookie, SDK, dan Analitik</strong></h3>\n<p><strong>17.1</strong> Lokasi presisi hanya diminta saat Anda memakai fitur \"terdekat\"; Anda dapat menolaknya dan memasukkan alamat manual.</p>\n<p><strong>17.2</strong> Cookie atau SDK esensial dipakai untuk menjalankan Aplikasi. Cookie/SDK analitik dan pemasaran non-esensial hanya aktif dengan persetujuan Anda. Daftar: <mark><mark>[daftar SDK/cookie]</mark></mark>.</p>\n<h3><strong>18. Data Mitra Profesional</strong></h3>\n<p><strong>18.1</strong> Untuk Mitra, Kami memproses identitas, dokumen legalitas profesi (kartu/izin praktik, SK, sertifikat), kontak, rekening pencairan, profil publik, hasil verifikasi, tingkat respons, dan feedback. Dasarnya adalah perjanjian kemitraan, kewajiban hukum, dan persetujuan untuk hal opsional (misalnya foto). Rincian ada dalam Perjanjian Kemitraan.</p>\n<h3><strong>19. Tata Kelola Internal</strong></h3>\n<p><strong>19.1</strong> Kami menetapkan ketentuan pemrosesan internal, menunjuk PPDP, melaksanakan penilaian dampak, menjaga catatan kegiatan pemrosesan, dan melatih staf. Kami melaksanakan perintah lembaga PDP sesuai peraturan.</p>\n<h3><strong>20. Perubahan Kebijakan</strong></h3>\n<p><strong>20.1</strong> Kami dapat memperbarui Kebijakan ini. Perubahan material diberitahukan melalui Aplikasi atau email, dan Kami meminta persetujuan baru bila perubahan memengaruhi dasar pemrosesan yang bergantung pada persetujuan.</p>\n<h3><strong>21. Kontak dan Pengaduan</strong></h3>\n<p><strong>21.1</strong> PPDP: <mark><mark>[nama]</mark></mark>, <mark><mark>[email]</mark></mark>, <mark><mark>[telepon]</mark></mark>, <mark><mark>[alamat]</mark></mark>. Kami menanggapi pengaduan dalam <mark>[3]</mark> hari kerja.</p>\n<p><strong>21.2</strong> Anda juga berhak mengadu kepada lembaga pelindungan data pribadi yang berwenang dan menempuh penyelesaian sengketa sesuai hukum.</p>\n<h1><strong>Lampiran — Catatan untuk Tim Legal</strong></h1>\n<div class=\"lg-tw\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Butir</strong></th>\n<th><strong>Catatan</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Tanggal berlaku</td>\n<td>PP 33/2026 berlaku 16 Januari 2027. Draf ini disusun mengikutinya; sebaiknya berlaku efektif paling lambat tanggal tersebut.</td>\n</tr>\n<tr class=\"even\">\n<td>Pengendali tersendiri vs bersama</td>\n<td>Bagian 2.3 mengasumsikan Lexara dan Mitra pengendali tersendiri. Bila Tim Legal menilai keduanya menentukan tujuan dan cara bersama, berlaku ketentuan pengendali bersama (perjanjian peran dan <strong>tanggung renteng</strong>). Putuskan sebelum Perjanjian Kemitraan difinalkan.</td>\n</tr>\n<tr class=\"odd\">\n<td>PPDP</td>\n<td>Kegiatan inti Lexara mencakup pemrosesan data spesifik dan/atau yang berkaitan dengan tindak pidana dalam skala besar. Penunjukan PPDP kemungkinan wajib; tetapkan nama dan kanal sebelum rilis.</td>\n</tr>\n<tr class=\"even\">\n<td>Penilaian dampak</td>\n<td>Lakukan dan dokumentasikan penilaian dampak sebelum peluncuran (data spesifik, skala besar, fitur AI bila diaktifkan).</td>\n</tr>\n<tr class=\"odd\">\n<td>Retensi</td>\n<td>Angka pada bagian 9 adalah usulan (selaras Panduan Developer) dan memerlukan konfirmasi hukum.</td>\n</tr>\n<tr class=\"even\">\n<td>Jangka waktu hak</td>\n<td>Jangka waktu 3 x 24 jam hanya untuk penarikan persetujuan, pembatasan, dan pemberitahuan kegagalan. Jangka waktu hak lain mengikuti teks resmi PP 33/2026 dan peraturan lembaga PDP (belum terbentuk penuh); verifikasi dan isi bagian 11.3.</td>\n</tr>\n<tr class=\"odd\">\n<td>Ketentuan internal</td>\n<td>PP mewajibkan ketentuan pemrosesan internal mengacu pedoman lembaga PDP. Kebijakan ini bersifat eksternal; siapkan versi internal terpisah.</td>\n</tr>\n</tbody>\n</table></div>", "ketentuan": "<p><em>PT Syihab Adinata &amp; Partners | Versi 1.0 | Draf untuk ditelaah Tim Legal | Selaras Alur Layanan v0.2</em></p>\n<p><em>Versi 1.0 | Berlaku efektif: <mark>[tanggal]</mark> | Terakhir diperbarui: <mark>[tanggal]</mark></em></p>\n<div class=\"lg-tw\"><table>\n\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>Ringkasan Penting (tampilkan di layar pertama sebelum Pelanggan menyetujui)</strong></p>\n<p>• Lexara adalah platform yang mempertemukan Anda dengan profesional independen (\"Mitra\"). Lexara <strong>bukan</strong> kantor hukum, notaris, kantor akuntan publik, perusahaan media, atau praktik psikologi, dan tidak memberikan nasihat profesional.</p>\n<p>• Untuk membuka obrolan dengan satu Mitra, Anda membayar <strong>Biaya Platform maksimal Rp200.000</strong>. Biaya ini dikembalikan otomatis bila Mitra tidak membalas atau menolak sebelum diskusi substantif.</p>\n<p>• <strong>Honor disepakati langsung</strong> antara Anda dan Mitra melalui obrolan dan pop-up penawaran. Lexara tidak menetapkan harga.</p>\n<p>• Layanan dimulai setelah Anda dan Mitra menandatangani <strong>Perjanjian Kerja Sama (PKS)</strong>. Perubahan lingkup, jangka waktu, atau harga hanya lewat addendum.</p>\n<p>• Tidak ada jaminan hasil perkara, putusan, pemberitaan, atau keluaran tertentu.</p>\n<p>• Lexara bukan layanan gawat darurat. Jika Anda atau orang lain dalam bahaya, hubungi 112 atau 110.</p>\n<p>• Data Anda diproses sesuai Pemberitahuan Privasi dan Kebijakan Privasi. Persetujuan untuk data sensitif dan lokasi presisi diminta <strong>terpisah</strong> dari Ketentuan ini dan dapat Anda tarik kapan saja.</p></td>\n</tr>\n</tbody>\n</table></div>\n<h1><strong>Bagian I — Ketentuan Umum</strong></h1>\n<h3><strong>Pasal 1 — Definisi</strong></h3>\n<p><strong>(1) \"Lexara\"</strong> atau <strong>\"Aplikasi\"</strong> adalah aplikasi dan situs yang dioperasikan oleh <strong>PT Syihab Adinata &amp; Partners</strong> (\"<strong>Kami</strong>\"), berkedudukan di <mark><mark>[alamat lengkap]</mark></mark>, NIB <mark><mark>[nomor]</mark></mark>, Tanda Daftar PSE <mark><mark>[nomor]</mark></mark>.</p>\n<p><strong>(2) \"Pelanggan\"</strong> atau <strong>\"Anda\"</strong> adalah orang perseorangan atau badan usaha yang membuat akun untuk mencari dan memakai Layanan Mitra (Justice Seeker).</p>\n<p><strong>(3) \"Mitra\"</strong> atau <strong>\"praktisi\"</strong> adalah profesional yang terdaftar dan terverifikasi di Aplikasi: Advokat, Notaris/PPAT, Konsultan, Akuntan, Psikolog, Wartawan/Media, Ahli Hukum, dan Auditor.</p>\n<p><strong>(4) \"Obrolan\"</strong> adalah ruang percakapan antara satu Pelanggan dan satu Mitra yang dibuka setelah Biaya Platform dibayar.</p>\n<p><strong>(5) \"Biaya Platform\"</strong> adalah biaya akses Obrolan yang dibayar kepada Kami, maksimal Rp200.000 per Obrolan per Mitra.</p>\n<p><strong>(6) \"Honor\"</strong> adalah imbalan jasa yang disepakati antara Pelanggan dan Mitra.</p>\n<p><strong>(7) \"PKS\"</strong> adalah Perjanjian Kerja Sama Pemberian Layanan antara Pelanggan dan Mitra yang dibuat melalui Aplikasi, beserta <strong>\"Addendum\"</strong> atas perubahannya.</p>\n<p><strong>(8) \"Progress\"</strong> adalah fitur pemantauan status pelaksanaan layanan di Aplikasi.</p>\n<p><strong>(9) \"Pusat Resolusi\"</strong> adalah fitur pengaduan dan penyelesaian sengketa di Aplikasi.</p>\n<p><strong>(10) \"Data Pribadi\"</strong> dan <strong>\"Data Pribadi Spesifik\"</strong> memiliki arti sebagaimana dalam UU Pelindungan Data Pribadi.</p>\n<p><strong>(11) \"Jam aktif\"</strong> adalah pukul 08.00–20.00 waktu setempat Mitra, setiap hari.</p>\n<h3><strong>Pasal 2 — Penerimaan dan Perubahan Ketentuan</strong></h3>\n<p><strong>(1)</strong> Dengan mencentang persetujuan, membuat akun, atau menggunakan Aplikasi, Anda menyatakan telah membaca, memahami, dan menyetujui Ketentuan ini sebagai perjanjian elektronik yang sah.</p>\n<p><strong>(2)</strong> Persetujuan atas Ketentuan ini <strong>tidak sama</strong> dengan persetujuan pemrosesan Data Pribadi tertentu. Persetujuan data diminta terpisah sebagaimana dijelaskan dalam Pemberitahuan Privasi dan Kebijakan Privasi.</p>\n<p><strong>(3)</strong> Kami dapat mengubah Ketentuan ini. Perubahan material diberitahukan melalui Aplikasi atau email paling lambat <mark>[14]</mark> hari sebelum berlaku. Jika tidak setuju, Anda dapat berhenti menggunakan Aplikasi dan menutup akun. Obrolan dan PKS yang sudah berjalan tetap tunduk pada Ketentuan yang berlaku saat dibuat.</p>\n<p><strong>(4)</strong> Ketentuan ini tidak mengurangi hak Anda berdasarkan peraturan perundang-undangan, termasuk hak sebagai konsumen.</p>\n<h3><strong>Pasal 3 — Peran Lexara</strong></h3>\n<p><strong>(1)</strong> Lexara adalah penyelenggara sistem elektronik yang menyediakan sarana pencarian, Obrolan, penawaran harga, pembuatan PKS, pemantauan Progress, dan pembayaran.</p>\n<p><strong>(2)</strong> Lexara <strong>bukan</strong> kantor advokat, konsultan hukum, notaris/PPAT, kantor akuntan publik, perusahaan pers, praktik atau klinik psikologi, maupun lembaga sertifikasi. Lexara tidak memberikan nasihat hukum, keuangan, pajak, psikologis, atau audit, tidak mewakili Anda di pengadilan atau instansi, dan bukan pihak dalam PKS antara Pelanggan dan Mitra.</p>\n<p><strong>(3)</strong> Tidak terbentuk hubungan advokat–klien, notaris–penghadap, psikolog–klien, atau hubungan profesional lain antara Anda dan Lexara. Hubungan tersebut hanya terbentuk dengan Mitra.</p>\n<p><strong>(4)</strong> Informasi umum dalam Aplikasi (artikel, template, tanya jawab awal) bersifat edukatif dan bukan pengganti nasihat profesional atas kasus spesifik Anda.</p>\n<p><strong>(5)</strong> Kami berkomitmen menyediakan verifikasi administratif Mitra, menjaga keamanan platform, menyediakan mekanisme pengaduan, dan menampilkan biaya secara transparan agar akses keadilan terjangkau bagi Pelanggan dan proporsional bagi Mitra.</p>\n<h3><strong>Pasal 4 — Akun dan Kelayakan</strong></h3>\n<p><strong>(1)</strong> Anda harus berusia minimal 18 tahun atau cakap hukum untuk membuat akun.</p>\n<p><strong>(2)</strong> Anak di bawah 18 tahun tidak dapat membuat akun. Jika kebutuhan hukum menyangkut anak, orang tua, wali, atau pendamping hukum yang cakap membuat akun dan bertindak atas nama anak; data anak diproses dengan perlindungan tambahan.</p>\n<p><strong>(3)</strong> Anda wajib memberikan data yang benar, lengkap, dan terkini. Pelanggan badan usaha bertindak melalui wakil yang sah.</p>\n<p><strong>(4)</strong> Anda wajib menjaga kerahasiaan kredensial dan kode OTP, serta segera melapor jika terjadi penyalahgunaan akun. Anda bertanggung jawab atas aktivitas melalui akun Anda, kecuali akibat kelalaian Kami.</p>\n<p><strong>(5)</strong> Kami dapat meminta verifikasi tambahan, misalnya untuk program subsidi atau tanda tangan PKS.</p>\n<h1><strong>Bagian II — Alur Penggunaan Layanan</strong></h1>\n<h3><strong>Pasal 5 — Alur Penggunaan</strong></h3>\n<p><strong>(1)</strong> Alur penggunaan Layanan Mitra terdiri atas: (a) mencari dan memfilter Mitra; (b) memilih Mitra; (c) membayar Biaya Platform dan membuka Obrolan; (d) berdiskusi mengenai masalah dan harga; (e) menyepakati harga melalui pop-up penawaran; (f) menandatangani PKS; (g) pelaksanaan layanan dan pemantauan melalui Progress; dan (h) penyelesaian serta feedback dua arah.</p>\n<p><strong>(2)</strong> Layanan yang tersedia: Cari Lawyer/Advokat, Notaris/PPAT, Konsultan, Akuntan, Psikolog, Wartawan/Media, Ahli Hukum, dan Auditor dan Analis. Ketersediaan dapat berbeda per wilayah dan dapat berubah.</p>\n<p><strong>(3)</strong> Anda dapat menyaring Mitra berdasarkan area praktik atau keahlian, tingkat perkara (bila ada), jenis layanan, wilayah kerja, pengalaman, jenis kelamin, dan biaya investasi. Urutan tampilan ditentukan oleh <mark><mark>[relevansi: filter, jarak, ketersediaan]</mark></mark> dan <strong>bukan</strong> oleh pembayaran. <mark>[Konfirmasi kebijakan: Lexara tidak menerima pembayaran dari Mitra untuk memengaruhi peringkat.]</mark></p>\n<p><strong>(4)</strong> Fitur \"terdekat\" memerlukan izin lokasi. Anda dapat menolak izin tersebut dan memasukkan alamat secara manual.</p>\n<h3><strong>Pasal 6 — Biaya Platform dan Pengembalian</strong></h3>\n<p><strong>(1)</strong> Biaya Platform adalah biaya <strong>akses Obrolan</strong> dengan satu Mitra. Biaya ini bukan Honor Mitra dan bukan jaminan bahwa Mitra akan menerima atau menyelesaikan perkara Anda.</p>\n<p><strong>(2)</strong> Besarnya mengikuti tingkat kompleksitas area yang Anda pilih saat filter, tidak pernah melebihi <strong>Rp200.000</strong> per Obrolan per Mitra, dan ditampilkan sebelum Anda membayar bersama kebijakan pengembaliannya.</p>\n<p><strong>(3)</strong> Mitra wajib membalas dalam <mark>[12]</mark> jam aktif sejak Biaya Platform dibayar (<mark>[2]</mark> jam aktif untuk permintaan mendesak yang memenuhi syarat). Obrolan pembuka berlangsung paling lama <mark>[7]</mark> hari dan dimaksudkan untuk memahami masalah serta menyepakati harga, bukan konsultasi lengkap.</p>\n<p><strong>(4) Biaya Platform dikembalikan 100% secara otomatis</strong> apabila: (a) Mitra tidak membalas dalam batas waktu; (b) Mitra menolak sebelum diskusi substantif (misalnya karena konflik kepentingan, di luar kompetensi, atau kapasitas penuh); (c) Anda membatalkan sebelum Mitra membalas; (d) Obrolan disalahgunakan Mitra (misalnya ajakan bayar di luar aplikasi, tekanan nominal, atau diskriminasi); atau (e) terjadi gangguan teknis pada Lexara.</p>\n<p><strong>(5)</strong> Biaya Platform <strong>tidak dikembalikan</strong> apabila diskusi substantif sudah terjadi (Mitra telah menanggapi masalah atau memberi estimasi) lalu para pihak tidak sepakat, apabila Anda tidak merespons Mitra selama <mark>[5]</mark> hari, atau apabila Obrolan Anda salahgunakan (pelecehan, permintaan melanggar hukum). Anda bebas membuka Obrolan dengan Mitra lain.</p>\n<p><strong>(6)</strong> Jika Anda menilai balasan Mitra tidak bermakna (misalnya hanya sapaan), Anda dapat mengajukan pengaduan dalam <mark>[24]</mark> jam setelah balasan pertama. Kami meninjau paling lambat <mark>[2]</mark> hari kerja dan mengembalikan biaya bila terbukti.</p>\n<p><strong>(7)</strong> Pengembalian diproses paling lambat <mark>[1x24]</mark> jam sejak syarat terpenuhi dan dikirim ke metode pembayaran awal. Waktu dana masuk mengikuti kanal pembayaran Anda.</p>\n<p><strong>(8)</strong> <mark><mark>[Jika program subsidi tersedia]</mark></mark> Biaya Platform dapat dikurangi atau dibebaskan sesuai syarat kelayakan yang ditampilkan di Aplikasi. <mark>[Keputusan: apakah Biaya Platform dikreditkan ke Honor bila Anda melanjutkan dengan Mitra yang sama.]</mark></p>\n<h3><strong>Pasal 7 — Honor, Penawaran Harga, dan PKS</strong></h3>\n<p><strong>(1)</strong> Honor disepakati langsung oleh Pelanggan dan Mitra sesuai besar kecilnya masalah. Lexara <strong>tidak menetapkan harga</strong>; panduan tingkat kompleksitas dan rentang indikatif yang ditampilkan bersifat tidak mengikat. Bila nominal berada jauh di luar rentang indikatif Mitra, Aplikasi menampilkan peringatan netral dan meminta alasan singkat dari Mitra tanpa memblokir kesepakatan.</p>\n<p><strong>(2)</strong> Penawaran harga diajukan melalui pop-up dalam Obrolan, memuat nominal, ruang lingkup, jangka waktu, dan bila ada termin serta biaya pihak ketiga. Harga berlaku setelah Mitra mengonfirmasi. Penawaran kedaluwarsa dalam <mark>[48]</mark> jam dan dibatasi maksimal <mark>[5]</mark> putaran tawar. Penawaran yang telah dikirim tidak dapat diubah; tawar balik membuat versi baru.</p>\n<p><strong>(3)</strong> Setelah harga dikonfirmasi, Aplikasi membuat PKS dari template berdasarkan data pendaftaran masing-masing pihak dan hasil diskusi. Klausul wajib tidak dapat diubah; ruang lingkup, jangka waktu, termin, dan jumlah revisi dapat disesuaikan sebelum tanda tangan. Kedua pihak menandatangani secara elektronik dalam <mark>[48]</mark> jam <mark><mark>[dengan tanda tangan elektronik tersertifikasi; verifikasi]</mark></mark>.</p>\n<p><strong>(4)</strong> Layanan dimulai setelah PKS ditandatangani kedua pihak dan <mark><mark>[termin pertama dibayar dalam 24 jam]</mark></mark>. Perubahan ruang lingkup, jangka waktu, atau harga hanya sah melalui Addendum yang disetujui kedua pihak. Mitra tidak wajib mengerjakan pekerjaan tambahan tanpa Addendum.</p>\n<p><strong>(5)</strong> Honorarium untuk profesi yang diatur kode etik atau peraturan khusus (misalnya Advokat dan Notaris/PPAT) tunduk pada ketentuan profesi tersebut <mark><mark>[verifikasi, termasuk larangan honorarium berbasis persentase hasil]</mark></mark>.</p>\n<p><strong>(6)</strong> Biaya pihak ketiga (misalnya biaya perkara, PNBP, pajak, iklan, transportasi) dicantumkan terpisah sebagai estimasi dan batas, serta ditagih dengan bukti resmi.</p>\n<h3><strong>Pasal 8 — Pembayaran Honor</strong></h3>\n<p><strong>(1)</strong> <mark>[Asumsi skema: Honor dibayar melalui Aplikasi sesuai termin dalam PKS. Dana ditahan sementara dan dilepas saat milestone diterima atau otomatis setelah jendela review berakhir. Verifikasi dahulu kewajiban izin Penyelenggara Jasa Pembayaran; bila Honor dibayar langsung antar pihak, ketentuan ini diganti.]</mark></p>\n<p><strong>(2)</strong> Pembayaran diproses melalui penyedia jasa pembayaran berizin pihak ketiga. Lexara bukan bank dan bukan penerbit uang elektronik.</p>\n<p><strong>(3)</strong> Bukti transaksi dan faktur tersedia di Aplikasi. <mark><mark>[Pengenaan PPN/pajak lain: harga sudah termasuk / belum termasuk pajak.]</mark></mark></p>\n<p><strong>(4)</strong> Kami dapat menahan atau menolak transaksi yang terindikasi penipuan atau pelanggaran hukum.</p>\n<p><strong>(5)</strong> Pembayaran di luar Aplikasi dilarang dan tidak dilindungi mekanisme penahanan dana, pengaduan, dan pengembalian dana Lexara.</p>\n<h3><strong>Pasal 9 — Pelaksanaan, Progress, dan Penerimaan Hasil</strong></h3>\n<p><strong>(1)</strong> Pelanggan menyediakan informasi dan dokumen tepat waktu serta hadir sesuai jadwal. Mitra melaksanakan layanan sesuai ruang lingkup PKS dan kode etik profesinya.</p>\n<p><strong>(2)</strong> Mitra memperbarui Progress paling lambat <mark>[24]</mark> jam setelah kejadian penting (misalnya sidang, sesi, atau pengiriman hasil) dan minimal setiap <mark>[7]</mark> hari selama layanan berjalan. Catatan internal Mitra tidak terlihat Pelanggan. Untuk layanan Psikolog, Progress hanya memuat jadwal, kehadiran, dan milestone administratif tanpa isi klinis.</p>\n<p><strong>(3)</strong> Setelah Mitra menandai milestone selesai, Pelanggan memiliki <mark>[72]</mark> jam untuk menerima, meminta revisi sesuai jatah, atau mengajukan sengketa. Jika tidak ada respons, hasil dianggap diterima dan termin dilepas.</p>\n<p><strong>(4)</strong> Jika Pelanggan tidak menyediakan informasi yang diperlukan selama <mark>[3]</mark> hari, layanan berstatus \"Ditunda\" dan hitungan jangka waktu berhenti sementara. Setelah <mark>[14]</mark> hari, Mitra dapat menutup layanan dengan Honor proporsional.</p>\n<p><strong>(5)</strong> Jika Mitra tidak responsif selama <mark>[48]</mark> jam aktif, Kami mengingatkan dan mengeskalasi. Setelah <mark>[5]</mark> hari tanpa respons, Pelanggan dapat mengganti Mitra dengan pengembalian proporsional.</p>\n<p><strong>(6)</strong> Pada akhir layanan, kedua pihak dapat memberikan feedback sesuai Pasal 12.</p>\n<h3><strong>Pasal 10 — Pembatalan, Penghentian, dan Pengembalian Honor</strong></h3>\n<p><strong>(1) Sebelum PKS ditandatangani:</strong> pembatalan tidak menimbulkan kewajiban Honor. Perlakuan Biaya Platform mengikuti Pasal 6.</p>\n<p><strong>(2) Setelah PKS, sebelum pekerjaan dimulai:</strong> Honor dikembalikan setelah dikurangi pekerjaan persiapan yang sudah dilakukan (dengan bukti).</p>\n<p><strong>(3) Dihentikan Pelanggan di tengah layanan:</strong> Pelanggan membayar proporsional untuk milestone selesai dan biaya yang sudah dikeluarkan; sisanya dikembalikan.</p>\n<p><strong>(4) Dihentikan Mitra dengan alasan sah</strong> (konflik kepentingan, etik, izin kedaluwarsa, atau informasi palsu): pengembalian proporsional dan bantuan transisi (serah terima berkas, rujukan Mitra pengganti). Mitra tidak boleh meninggalkan Pelanggan menjelang tenggat kritis.</p>\n<p><strong>(5) Sesi terjadwal</strong> (konsultasi, psikolog, dan sejenisnya) <mark><mark>[usulan]</mark></mark>: dibatalkan Pelanggan ≥ 24 jam sebelum jadwal, dikembalikan 100%; 2 sampai &lt; 24 jam, dikembalikan 50%; &lt; 2 jam atau tidak hadir setelah masa tenggang 15 menit, tidak dikembalikan, kecuali ada bukti keadaan darurat yang ditinjau Kami. Jika Mitra membatalkan atau tidak hadir, Pelanggan menerima pengembalian 100% ditambah kredit kompensasi <mark>[10% nilai sesi, min Rp25.000, maks Rp100.000]</mark> berlaku <mark>[90]</mark> hari.</p>\n<p><strong>(6) Keadaan memaksa atau darurat terbukti:</strong> jadwal ulang atau pengembalian proporsional tanpa penalti bagi kedua pihak.</p>\n<p><strong>(7) Izin praktik Mitra kedaluwarsa atau dicabut:</strong> layanan dijeda otomatis, kedua pihak diberi tahu, transisi dibantu, dan pengembalian dilakukan proporsional.</p>\n<h3><strong>Pasal 11 — Hubungan antara Pelanggan dan Mitra</strong></h3>\n<p><strong>(1)</strong> Mitra adalah profesional independen, bukan karyawan, agen, atau perwakilan Lexara.</p>\n<p><strong>(2)</strong> Mitra bertanggung jawab atas mutu, ketepatan, dan kepatuhan etik jasanya. Pelanggan bertanggung jawab atas kebenaran informasi dan dokumen yang diberikan serta keputusan yang diambil.</p>\n<p><strong>(3) Tidak ada jaminan hasil.</strong> Kami dan Mitra tidak menjamin kemenangan perkara, putusan tertentu, persetujuan instansi, hasil atau opini audit, penerbitan akta, pemberitaan, maupun viralnya konten.</p>\n<p><strong>(4)</strong> Mitra wajib mengungkapkan potensi konflik kepentingan dan berhak menolak permintaan yang di luar kompetensi atau melanggar hukum dan etik. Pelanggan berhak mengganti Mitra sesuai PKS.</p>\n<p><strong>(5)</strong> Jika Pelanggan tidak mampu membayar Honor, Kami dapat menawarkan Mitra lain yang lebih terjangkau, program subsidi, atau rujukan bantuan hukum gratis (misalnya Posbakum atau Organisasi Bantuan Hukum).</p>\n<h3><strong>Pasal 12 — Verifikasi Mitra dan Feedback</strong></h3>\n<p><strong>(1)</strong> Kami melakukan verifikasi administratif atas identitas dan dokumen legalitas profesi Mitra. Verifikasi bersifat administratif pada saat dilakukan dan bukan penilaian kompetensi atau jaminan mutu. Anda tetap disarankan memeriksa kredensial Mitra.</p>\n<p><strong>(2)</strong> Kedua pihak dapat saling memberikan feedback. Feedback bersifat <strong>buta-ganda</strong>: baru dibuka setelah kedua pihak mengirim atau setelah <mark>[7]</mark> hari. Penilaian Mitra terhadap Pelanggan berkaitan dengan kerja sama <mark><mark>[keputusan: visibilitas]</mark></mark>, dan Mitra dapat menjawab ulasan publik satu kali.</p>\n<p><strong>(3)</strong> Feedback harus jujur, berdasarkan pengalaman, dan dilarang memuat rahasia perkara, Data Pribadi pihak ketiga, unsur SARA, fitnah, atau ancaman. Kami dapat memoderasi atau menghapus feedback yang melanggar. Pembalasan dan pembelian ulasan dilarang.</p>\n<p><strong>(4)</strong> <mark>[Konfirmasi kebijakan: Lexara tidak menampilkan klaim \"terbaik\", persentase kemenangan, atau testimoni hasil perkara yang dapat bertentangan dengan kode etik profesi Mitra.]</mark></p>\n<h3><strong>Pasal 13 — Kerahasiaan dan Komunikasi</strong></h3>\n<p><strong>(1)</strong> Komunikasi dalam Aplikasi diproses sesuai Pemberitahuan Privasi dan Kebijakan Privasi serta dilindungi dengan <mark><mark>[enkripsi saat transmisi dan penyimpanan]</mark></mark>.</p>\n<p><strong>(2)</strong> Mitra terikat kewajiban kerahasiaan sesuai profesinya. Kami mewajibkan Mitra menjaga kerahasiaan melalui perjanjian kemitraan.</p>\n<p><strong>(3)</strong> Kami tidak memantau isi komunikasi secara rutin. Akses hanya untuk penanganan laporan pelanggaran, permintaan sah aparat berwenang berdasarkan hukum, atau dengan persetujuan Anda.</p>\n<p><strong>(4)</strong> Perekaman sesi hanya dilakukan jika seluruh pihak menyetujui secara eksplisit untuk sesi tersebut.</p>\n<p><strong>(5)</strong> Kerahasiaan tunduk pada pengecualian hukum dan kode etik profesi, misalnya ancaman nyata terhadap keselamatan jiwa atau perintah pengadilan.</p>\n<h1><strong>Bagian III — Ketentuan Khusus per Layanan</strong></h1>\n<h3><strong>Pasal 14 — Ketentuan Khusus</strong></h3>\n<p><strong>14.1 Lawyer/Advokat.</strong> Advokat bertindak independen sesuai UU 18/2003. Hubungan klien terbentuk saat PKS dan, bila beracara, Surat Kuasa Khusus ditandatangani. \"Konsultasi\" tidak otomatis mencakup beracara. Pendampingan pada tingkat perkara (PN, PT, MA, PK, upaya hukum lainnya) dilakukan sesuai kuasa. Pembuatan dokumen hukum (Legal Opinion, Legal Memorandum, NDA, MOU/MOA, perjanjian, somasi, dll.) mengikuti ruang lingkup PKS. Pelanggan wajib segera menyampaikan tenggat hukum yang berjalan, dan Pelanggan dapat mencabut kuasa kapan saja.</p>\n<p><strong>14.2 Notaris/PPAT.</strong> Kewenangan sesuai UU Jabatan Notaris dan ketentuan PPAT, termasuk wilayah jabatan. Konsultasi dapat daring, tetapi pembuatan dan penandatanganan akta tunduk pada peraturan, termasuk <strong>kehadiran para pihak secara tatap muka</strong> dan kelengkapan dokumen. Notaris/PPAT bersikap tidak memihak terhadap seluruh pihak dalam akta dan dapat menolak bila persyaratan tidak terpenuhi. Biaya PNBP, pajak, dan biaya pihak ketiga diperlakukan sebagai dana titipan dengan bukti. Proses yang bergantung pada sistem pemerintah dapat tertunda di luar kendali Mitra.</p>\n<p><strong>14.3 Konsultan.</strong> Saran dan dokumen (studi kelayakan, business plan, SOP, kebijakan, proyeksi keuangan, dll.) bersifat rekomendasi berdasarkan informasi Pelanggan; keputusan bisnis tetap tanggung jawab Pelanggan. Konsultan yang bukan advokat tidak beracara di pengadilan. Konsultan ISO tidak menjamin sertifikasi karena sertifikat diterbitkan lembaga sertifikasi terakreditasi.</p>\n<p><strong>14.4 Akuntan.</strong> Layanan meliputi pembukuan, laporan keuangan, perpajakan, payroll, audit internal keuangan, dan perencanaan keuangan berdasarkan dokumen Pelanggan. Kewajiban pelaporan dan pembayaran pajak tetap menjadi tanggung jawab Pelanggan sebagai Wajib Pajak. Pelaporan dilakukan melalui mekanisme kuasa resmi, bukan dengan berbagi kata sandi <mark><mark>[verifikasi]</mark></mark>. Jasa atestasi atau assurance hanya oleh pihak berizin. Layanan berulang tidak diperpanjang otomatis tanpa pemberitahuan dan persetujuan.</p>\n<p><strong>14.5 Psikolog.</strong> Layanan oleh psikolog berizin sesuai kode etik, berupa konsultasi, pendampingan persidangan dan lapas, serta pendampingan harian. Layanan ini bukan layanan darurat, bukan pengganti penanganan medis atau psikiatri, dan tidak meresepkan obat. Informed consent diberikan sebelum layanan dimulai. Kerahasiaan memiliki batas (risiko membahayakan diri atau orang lain, kewajiban hukum, perintah pengadilan) yang dijelaskan sebelum Pelanggan bercerita. Pendampingan persidangan atau lapas dimulai setelah izin atau ketentuan terpenuhi. Untuk anak diperlukan persetujuan orang tua atau wali.</p>\n<p><strong>14.6 Wartawan/Media.</strong> Layanan berupa jasa kehumasan dan produksi konten (press release/copywriting, produksi dan penyuntingan video, fotografi dokumentasi, pengelolaan media sosial, press conference, konsultasi komunikasi publik) dan/atau penyampaian informasi kepada media. (a) Keputusan pemuatan berita sepenuhnya milik redaksi media yang independen; Lexara dan Mitra tidak menjanjikan pemuatan, jumlah tayangan, viralitas, atau dampak terhadap proses hukum. (b) Konten berbayar atau kehumasan wajib berlabel. (c) Mitra wajib mematuhi UU 40/1999 dan Kode Etik Jurnalistik, termasuk larangan menyalahgunakan profesi dan menerima suap, kewajiban verifikasi, hak jawab, serta perlindungan identitas korban kesusilaan dan anak. (d) Pelanggan bertanggung jawab atas kebenaran bahan dan dilarang meminta konten yang tidak benar, memfitnah, melanggar privasi, atau mengganggu peradilan. (e) Nama paket \"No Viral No Justice\" adalah nama layanan, bukan janji hasil.</p>\n<p><strong>14.7 Ahli Hukum.</strong> Ahli memberi pendapat atau keterangan secara independen sesuai keahlian dan keyakinan ilmiahnya. Honor tidak bergantung pada isi atau hasil pendapat, dan Pelanggan dilarang mensyaratkan isi pendapat. Pendapat ahli tidak mengikat hakim atau penyidik, dan penerimaannya sebagai alat bukti ditentukan pihak berwenang. Kehadiran di persidangan dan biayanya disepakati dalam PKS.</p>\n<p><strong>14.8 Auditor dan Analis.</strong> Ruang lingkup disepakati dalam PKS/Surat Penugasan. Opini atas laporan keuangan hanya dapat diberikan Akuntan Publik atau KAP berizin (UU 5/2011). Sertifikat sistem manajemen (misalnya ISO) hanya diterbitkan lembaga sertifikasi terakreditasi. Pelanggan wajib memberi akses data, dan hasil audit didasarkan pada data tersebut. Pelanggan dapat menanggapi fakta pada temuan sementara tetapi tidak dapat memesan atau mengubah temuan. Audit forensik tidak menggantikan proses penegakan hukum.</p>\n<h1><strong>Bagian IV — Keselamatan, Larangan, dan Tanggung Jawab</strong></h1>\n<h3><strong>Pasal 15 — Keadaan Darurat</strong></h3>\n<p><strong>(1)</strong> Lexara bukan layanan darurat dan tidak menjamin respons segera.</p>\n<p><strong>(2)</strong> Jika Anda atau orang lain menghadapi ancaman keselamatan, kekerasan, atau krisis kejiwaan, segera hubungi <strong>112</strong> (layanan darurat nasional), <strong>110</strong> (Polisi), atau fasilitas kesehatan terdekat. Korban kekerasan terhadap perempuan dan anak dapat menghubungi <strong>SAPA 129</strong> <mark><mark>[verifikasi nomor sebelum rilis]</mark></mark>.</p>\n<p><strong>(3)</strong> Pada laya Pusat Resolusi, kedua pihak menyampaikan versinya; pembayaran termin berikutnya ditahan selama proses. Target <mark>[48]</mark> jam.</p>\n<p><strong>(2) Tingkat 2, mediasi Lexara:</strong> ditangani tim yang tidak terlibat dalam kasus. Kedua pihak mengirim penjelasan dan bukti (log, deliverable, PKS, riwayat tawar). Keputusan tertulis disertai alasan, target <mark>[10]</mark> hari kerja (maks <mark>[14]</mark>). Lexara hanya memutus hal level platform (pelepasan atau pengembalian dana, pemenuhan kesepakatan) dan tidak menilai kebenaran substansi profesional. Banding dapat diajukan sekali dalam <mark>[3]</mark> hari kepada peninjau lain.</p>\n<p><strong>(3) Tingkat 3, jalur eksternal:</strong> organisasi profesi atau dewan kehormatan (mutu dan etik), BPSK, atau pengadilan sesuai UU Perlindungan Konsumen, termasuk di tempat kedudukan konsumen. Untuk pihak yang bukan konsumen, Pengadilan Negeri <mark><mark>[kota]</mark></mark>.</p>\n<p><strong>(4)</strong> Pengaduan kepada Kami dapat disampaikan lewat menu Bantuan atau email <mark><mark>[alamat email]</mark></mark>; Kami menanggapi dalam <mark>[3]</mark> hari kerja. Laporan konten ilegal atau pelanggaran dapat disampaikan lewat fitur Laporkan.</p>\n<h3><strong>Pasal 24 — Hukum yang Berlaku, Bahasa, dan Ketentuan Lain</strong></h3>\n<p><strong>(1)</strong> Ketentuan ini diatur oleh hukum Republik Indonesia dan dibuat dalam Bahasa Indonesia. Jika tersedia terjemahan, versi Bahasa Indonesia yang berlaku.</p>\n<p><strong>(2)</strong> Jika suatu ketentuan dinyatakan tidak sah, ketentuan lain tetap berlaku. Tidak digunakannya suatu hak bukan berarti melepaskan hak tersebut.</p>\n<p><strong>(3)</strong> Kami dapat mengalihkan hak dan kewajiban dalam rangka restrukturisasi korporasi dengan pemberitahuan kepada Anda, tanpa mengurangi pelindungan hak Anda.</p>\n<p><strong>(4)</strong> Pemberitahuan kepada Anda disampaikan melalui Aplikasi atau email terdaftar. Kontak: PT Syihab Adinata &amp; Partners, <mark><mark>[alamat lengkap function readLegalConsent(){
  try{ return JSON.parse(localStorage.getItem('lexara_consent') || 'null') || {}; }catch(e){ return {}; }
}
function hasLegalConsent(){
  let force = false;
  try{ force = /[?&]legal=1/.test(location.search); }catch(e){}
  if(!LEGAL_GATE_ENABLED && !force) return true;
  const c = readLegalConsent();
  return c.version === LEGAL_VERSION && !!c.privacyAt && !!c.policyAt && !!c.termsAt;
}
function resetScreenScroll(){
  const el = document.querySelector('#app .screen.active');
  if(el) el.scrollTop = 0;
}
function openLegalDoc(key){ state.legalDoc = key; render(); resetScreenScroll(); }
function closeLegalDoc(){ state.legalDoc = null; render(); resetScreenScroll(); }
function legalJump(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function toggleConsentCheck(){
  state.consentChecked = !state.consentChecked;
  render();
}
// Langkah 1: Pemberitahuan Privasi -> Langkah 2: Syarat dan Ketentuan.
// Tiap langkah punya ceklis sendiri; keduanya wajib sebelum Masuk/Daftar.
function acceptLegalConsent(){
  if(!state.consentChecked) return;
  const now = new Date().toISOString();
  let c = readLegalConsent();
  if(c.version !== LEGAL_VERSION) c = { version: LEGAL_VERSION };
  const step = state.consentStep;
  if(step === 'privasi'){ c.privacyAt = now; state.consentStep = 'kebijakan'; }
  else if(step === 'kebijakan'){ c.policyAt = now; state.consentStep = 'ketentuan'; }
  else { c.termsAt = now; }
  try{ localStorage.setItem('lexara_consent', JSON.stringify(c)); }catch(e){}
  state.consentChecked = false;
  render(); resetScreenScroll();
}
function consentBack(){
  state.consentStep = state.consentStep === 'ketentuan' ? 'kebijakan' : 'privasi'; state.consentChecked = false;
  render(); resetScreenScroll();
}

// Layar pertama untuk pengunjung yang belum login (sebelum Masuk/Daftar):
// teks lengkap langsung ditampilkan, dengan ceklis persetujuan di bagian bawah.
function renderConsentGate(){
  const c = readLegalConsent();
  if(!state.consentStep){
    const ok = c.version === LEGAL_VERSION;
    state.consentStep = !(ok && c.privacyAt) ? 'privasi' : !(ok && c.policyAt) ? 'kebijakan' : 'ketentuan';
  }
  const st = state.consentStep, stepNo = st === 'privasi' ? 1 : st === 'kebijakan' ? 2 : 3;
  const NAMES = { privasi:['Pemberitahuan Privasi','PEMBERITAHUAN PRIVASI','memahami'], kebijakan:['Kebijakan Privasi','KEBIJAKAN PRIVASI','memahami'], ketentuan:['Ketentuan Penggunaan','KETENTUAN PENGGUNAAN','menyetujui'] };
  const nm = NAMES[st];
  const title = nm[0];
  const label = 'Saya telah membaca dan '+nm[2]+' <b>'+nm[0]+'</b> Lexara.';
  return `
  <div class="screen active" style="display:flex;flex-direction:column;">
    <div class="legal-head">
      ${stepNo === 1 ? '' : `<button class="legal-back" onclick="consentBack()" aria-label="Kembali"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>`}
      <div class="legal-title">${title}</div>
      <div class="legal-step">${stepNo} dari 3</div>
    </div>
    <div class="legal-body" style="padding-bottom:24px;">
      <div class="legal-hero">
        <div class="lh-title">${nm[1]}<br>LEXARA</div>
        <div class="lh-sub">PT Syihab Adinata &amp; Partners</div>
      </div>
      ${LEGAL_DOCS[st]}
    </div>
    <div class="consent-bar">
      <label class="consent-check">
        <input type="checkbox" ${state.consentChecked ? 'checked' : ''} onchange="toggleConsentCheck()">
        <span>${label}</span>
      </label>
      <button class="btn btn-primary" style="width:100%;flex:none;" ${state.consentChecked ? '' : 'disabled'} onclick="acceptLegalConsent()">${stepNo < 3 ? 'Lanjutkan' : 'Setuju dan Lanjutkan'}</button>
    </div>
  </div>`;
}

/* ---------- API helper ---------- */
async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json' };
  if(opts.auth !== false && state.token){
    headers['Authorization'] = 'Bearer ' + state.token;
  }
  let res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  }catch(networkErr){
    throw new Error('Tidak bisa menghubungi server (' + API_BASE + '). Pastikan backend sedang berjalan.');
  }
  let data = {};
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    let msg = data && data.error ? data.error : ('Permintaan gagal (' + res.status + ')');
    if(data && data.detail) msg += '\n\nDetail teknis: ' + data.detail;
    throw new Error(msg);
  }
  return data;
}

function initials(name){ return (name||'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function formatRupiah(n){ return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function stars(rating){ const full = Math.round(rating||0); return '★'.repeat(full) + '☆'.repeat(5-full); }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) + ', ' +
         d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
}

/* ============================================================
   Render root
============================================================ */
// render() always rebuilds #app's HTML from scratch, which would otherwise
// silently reset any open scrollable panel — the active screen, or a filter
// bottom sheet's .sheet-body — back to the top on every single tap (e.g.
// picking a filter chip). This captures the current scroll position(s)
// before the rebuild and restores them on the freshly-created elements
// right after, so scrolling only happens when the client actually scrolls.
function setAppHtml(app, html){
  const screenScroll = app.querySelector('.screen.active')?.scrollTop || 0;
  const sheetScroll = app.querySelector('.sheet-body')?.scrollTop || 0;
  // A bottom sheet (filter sheet, "Lihat Semua", etc.) plays a slide-up +
  // fade-in entrance animation when it first opens. Because render() always
  // rebuilds the whole #app from scratch, the sheet's DOM nodes get
  // recreated on every single tap too — which would replay that same
  // entrance animation each time, making a simple filter pick look like the
  // whole screen "refreshing"/jumping. Remember whether a sheet was already
  // open before this rebuild so we can skip the animation on the new nodes.
  const sheetWasOpen = !!app.querySelector('.sheet-panel');
  app.innerHTML = html;
  {
    // Bilah tombol bawah (cta-bar) harus berhenti di atas navigasi bawah, bukan tertimpa.
    const nav = app.querySelector('.bottomnav');
    app.classList.toggle('has-nav', !!nav);
    if(nav) app.style.setProperty('--navh', (nav.offsetHeight + 18) + 'px');
  }
  if(screenScroll){
    const el = app.querySelector('.screen.active');
    if(el) el.scrollTop = screenScroll;
  }
  if(sheetScroll){
    const el = app.querySelector('.sheet-body');
    if(el) el.scrollTop = sheetScroll;
  }
  if(sheetWasOpen){
    const panel = app.querySelector('.sheet-panel');
    const backdrop = app.querySelector('.sheet-backdrop');
    if(panel) panel.style.animation = 'none';
    if(backdrop) backdrop.style.animation = 'none';
  }
}

function render(){
  const app = document.getElementById('app');

  // The full-text reader works both signed-out (from the consent screen) and
  // signed-in (from Akun), so it takes over before anything else.
  if(state.legalDoc){
    setAppHtml(app, renderLegalDoc());
    return;
  }

  if(!state.token || !state.user){
    // First visit (or after the documents' version changed): consent screen
    // comes before Masuk/Daftar.
    if(!hasLegalConsent()){
      setAppHtml(app, renderConsentGate());
      return;
    }
    setAppHtml(app, state.authScreen === 'login' ? renderLogin() : renderRegister());
    return;
  }

  // The pengacara dashboard takes over the whole screen except when the
  // lawyer has drilled into the profile-completion form — that form needs
  // its own back button rather than the dashboard's fixed layout.
  if(state.chat){
    // Jangan bangun ulang layar chat bila sudah tampil (agar ketikan & scroll tidak hilang).
    if(document.getElementById('chat-root')) updateChatDom(); else setAppHtml(app, renderChat());
    return;
  }
  if(state.checkout){ setAppHtml(app, renderCheckout()); return; }
  if(state.flow){ setAppHtml(app, renderFlow()); if(state.flow && state.flow.view === 'conv') flowPaintMsgs(false); return; }

  if(state.mode === 'pengacara' && state.screen !== 'lawyer-profile-form'){
    setAppHtml(app, renderLawyerDashboard() + renderBottomNav());
    return;
  }

  let html = '';
  if(state.screen === 'home') html = renderHome();
  else if(state.screen === 'detail') html = renderDetail();
  else if(state.screen === 'booking') html = renderBooking();
  else if(state.screen === 'confirm') html = renderConfirm();
  else if(state.screen === 'konsultasi') html = renderKonsultasi();
  else if(state.screen === 'cakrawala') html = renderCakrawala();
  else if(state.screen === 'profil') html = renderProfil();
  else if(state.screen === 'lawyer-profile-form') html = renderLawyerProfileForm();
  else if(state.screen === 'layanan-detail') html = renderLayananDetail();
  else if(state.screen === 'cari-lawyer-hasil') html = renderSearchResultsScreen('lawyer');
  else if(state.screen === 'cari-notaris-hasil') html = renderSearchResultsScreen('notaris');
  else if(state.screen === 'cari-konsultan-hasil') html = renderSearchResultsScreen('konsultan');
  else if(SVC_KINDS.some(k => SVC[k].screen === state.screen)) html = renderSearchResultsScreen(SVC_KINDS.find(k => SVC[k].screen === state.screen));
  else if(state.screen === 'cari-hangout-hasil') html = renderSearchResultsScreen('hangout');
  else html = renderHome();

  html += renderBottomNav();
  if(state.showAllServices) html += renderAllServicesSheet();
  // These two overlay whichever screen is behind them — normally 'home',
  // but also 'cari-lawyer-hasil'/'cari-notaris-hasil' when the client taps
  // "Ubah" on an already-submitted search — rather than replacing it, same
  // mechanism as the sheet above, so the client sees the filter as a
  // bottom sheet, not a full page nav.
  if(state.showLawyerFilterSheet) html += renderCariLawyerFilter();
  if(state.showNotarisFilterSheet) html += renderCariNotarisFilter();
  if(state.showKonsultanFilterSheet) html += renderCariKonsultanFilter();
  if(state.showSvcFilterSheet) html += renderCariSvcFilter();
  if(state.showHangoutFilterSheet) html += renderCariHangoutFilter();
  setAppHtml(app, html);
  setupHomeScroll();
}

async function loadLawyers(){
  state.lawyersLoading = true;
  state.lawyersError = null;
  render();
  try{
    const params = new URLSearchParams();
    const sortMap = { rating:'rating', price:'price', exp:'experience' };
    params.set('sortBy', sortMap[state.sortBy] || 'rating');
    params.set('pageSize', '50');

    const f = state.activeSearchFilters;
    if(f){
      // Advanced filters from "Cari Lawyer/Advokat" take priority over the
      // plain category chips — setCategory()/setSort() clear f when the
      // client goes back to simple chip browsing.
      if(f.areaPraktik.length) params.set('specialization', f.areaPraktik.join(','));
      // "Tingkat Perkara" no longer exists on the "Cari Lawyer/Advokat"
      // filter (removed per client request), so caseLevel is never sent
      // for a lawyer search. "Jenis Layanan" only still exists on the
      // "Cari Notaris/PPAT" filter, so it's guarded here too — a plain
      // lawyer activeSearchFilters object no longer has this field at all.
      if(f.jenisLayanan && f.jenisLayanan.length) params.set('serviceType', f.jenisLayanan.join(','));
      if(f.gender && f.gender !== 'semua') params.set('gender', f.gender);
      if(f.pengalamanMin) params.set('minExperience', f.pengalamanMin);
      if(f.pengalamanMax) params.set('maxExperience', f.pengalamanMax);
      // "Hang Out" prices an in-person meet-up (the video rate stands in for it),
      // so its fee range is applied after the fetch below — the backend's
      // minFee/maxFee compares against the CHAT rate, which would be wrong here.
      if(f.kind !== 'hangout'){
        if(f.biayaMin) params.set('minFee', f.biayaMin);
        if(f.biayaMax) params.set('maxFee', f.biayaMax);
      }
      // Wilayah Kerja by region: a specific city/kabupaten, or — when only a
      // province is picked — every city/kabupaten inside that province.
      if(f.kota) params.set('city', f.kota);
      else if(f.provinsi && WILAYAH_INDONESIA[f.provinsi]) params.set('city', WILAYAH_INDONESIA[f.provinsi].join(','));
      if(f.wilayah === 'terdekat' && f.userLat !== null){
        params.set('lat', f.userLat);
        params.set('lng', f.userLng);
      }
    }else{
      const category = CATEGORIES.find(c => c.label === state.activeCategory);
      if(category && category.specialization) params.set('specialization', category.specialization);
    }

    const result = await api('/lawyers?' + params.toString(), { auth:false });
    state.lawyers = result.items;
    if(f && f.kind === 'hangout'){
      const min = Number(f.biayaMin) || 0, max = Number(f.biayaMax) || Infinity, rad = Number(f.radiusKm) || Infinity;
      state.lawyers = state.lawyers.filter(l =>
        l.distanceKm != null && l.distanceKm <= rad && l.hourlyRateVideo >= min && l.hourlyRateVideo <= max);
    }
  }catch(e){
    state.lawyersError = e.message;
    state.lawyers = [];
  }finally{
    state.lawyersLoading = false;
    render();
  }
}

// A sub-service itself isn't a bookable thing in the backend (there's no
// per-document/per-service order flow) — picking one either jumps straight
// to the real, working lawyer list filtered by the closest matching
// specialization, or, when the category has none, gives an honest "segera"
// notice naming the exact thing they tapped rather than pretending to book it.
function selectLayananItem(serviceKey, item){
  const s = SERVICE_CATALOG.find(x => x.key === serviceKey);
  if(s && s.key === 'pendampingan'){
    // Tag the request so it survives into the booking screen (shown to the
    // lawyer as context) and picks the "Tatap Muka" method automatically.
    state.bookingServiceNote = 'Pendampingan · ' + item;
    state.activeCategory = PENDAMPINGAN_CATEGORY_MAP[item] || 'Semua';
    state.screen = 'home';
    loadLawyers().then(scrollToAllLawyers);
  }else if(s && s.mapCategory){
    state.screen = 'home';
    state.activeCategory = s.mapCategory;
    state.bookingServiceNote = null;
    // loadLawyers() re-renders #homeScreen once the list finishes loading —
    // scrolling before that would just get wiped out by that later render,
    // so wait for its promise instead of a fixed timeout.
    loadLawyers().then(scrollToAllLawyers);
  }else{
    comingSoon(item);
  }
}

// Dedicated results page for "Cari Lawyer/Advokat" / "Cari Notaris/PPAT" —

// (which has its own promo banner, category grid, etc. and would bury the
// results the client specifically asked for). Reuses the exact same
// state.lawyers / state.activeSearchFilters / sort machinery as the home
// screen's list — this is just a focused, single-purpose view of it.
function renderSearchResultsScreen(kind){
  let filtered = state.lawyers;
  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();

  }else if(state.lawyersError){
    body = `<div class="error-box">${state.lawyersError}</div>`;
  }else if(filtered.length === 0){
    body = renderEmptySearch();
  }else{
    body = filtered.map(l => renderLawyerCard(l, kind === 'hangout' ? 'hangout' : null)).join('');
  }

  const title = isSvc(kind) ? SVC[kind].label : kind === 'notaris' ? 'Cari Notaris/PPAT' : kind === 'konsultan' ? 'Cari Konsultan' : kind === 'hangout' ? 'Hang Out' : 'Cari Lawyer/Advokat';
  const hasFilters = state.activeSearchFilters && state.activeSearchFilters.kind === kind;

  return `
  <div class="screen active" style="display:flex;">
    <div class="detail-header">
      <div class="nav-strip">
        <button class="back-link" onclick="goHome()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Kembali
        </button>
      </div>
      <div class="detail-hero">
        <div class="profile-name">${title}</div>
        <div class="profile-spec" style="color:#C8D1E3;">${state.lawyersLoading ? 'Memuat…' : filtered.length + ' ditemukan'}</div>
      </div>
    </div>
    <div class="content">

      ${hasFilters ? `
      <div class="active-filter-bar">
        <span>🔎 Filter aktif (${countActiveFilters(state.activeSearchFilters)} kriteria)</span>
        <span class="active-filter-actions">
          <button type="button" class="btn-link" onclick="openActiveSearchFilterEditor()">Ubah</button>
          <button type="button" class="btn-link" onclick="clearLawyerSearchFilters()">Hapus</button>
        </span>
      </div>` : `
      <button type="button" class="btn btn-outline" style="width:100%;margin-bottom:14px;" onclick="openActiveSearchFilterEditor()">Atur Filter</button>`}

      <div class="sort-row">
        <div class="result-count">${state.lawyersLoading ? '…' : filtered.length + ' pengacara ditemukan'}</div>
        <select onchange="setSort(this.value)">
          <option value="rating" ${state.sortBy==='rating'?'selected':''}>Rating tertinggi</option>
          <option value="price" ${state.sortBy==='price'?'selected':''}>Harga terendah</option>
          <option value="exp" ${state.sortBy==='exp'?'selected':''}>Pengalaman</option>
        </select>
      </div>

      ${body}
    </div>
  </div>`;
}

function requestUserLocation(){

// Works for either shape: the draft filter (Sets, while editing on the
// filter screen) or the submitted filter (plain arrays, once applied).
function countActiveFilters(f){
  if(!f) return 0;
  const sizeOf = (x) => (x.size !== undefined ? x.size : x.length);
  let n = 0;
  if(f.areaPraktik && sizeOf(f.areaPraktik)) n++;
  if(f.jenisLayanan && sizeOf(f.jenisLayanan)) n++; // only present for "Cari Notaris/PPAT" now
  if(f.wilayah === 'terdekat') n++;
  if(f.provinsi || f.kota) n++;
  if(f.radiusKm) n++; // only present for "Hang Out"
  if(f.pengalamanMin || f.pengalamanMax) n++;
  if(f.gender !== 'semua') n++;
  if(f.biayaMin || f.biayaMax) n++;
  if(f.biayaDokumenMin || f.biayaDokumenMax) n++; // only present for "Cari Notaris/PPAT" (informational tier)
  return n;
}

function submitLawyerSearchFilter(){
  const f = state.lawyerSearchFilter;
  if(f.wilayah === 'terdekat' && f.userLat === null){
    requestUserLocation();
    return;
  }
  state.activeSearchFilters = {
    kind: 'lawyer',
    areaPraktik: Array.from(f.areaPraktik),
    wilayah: f.wilayah,
    provinsi: f.provinsi, kota: f.kota,
